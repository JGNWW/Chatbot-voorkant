name: Zoekkwaliteit (regressie-gate)

# Draait het eval-harnas op de zoeklaag zodra er iets aan de zoeklogica, het corpus of een
# vragenset verandert. De zoeklogica staat sinds kort op één plek (docs/search-core.js); de
# browser laadt dat bestand en Node laadt hetzelfde bestand, dus deze gate toetst precies wat
# de voorlichter krijgt. Er is geen kopie meer die uit de pas kan lopen.
#
# Draait in --no-sem modus: alleen de trefwoordlaag, zodat de check snel is en geen model van
# 118 MB hoeft te downloaden. De drempels staan met marge onder de gemeten waarden.

on:
  pull_request:
    paths:
      - docs/search-core.js
      - docs/index.html
      - docs/data/corpus.json
      - docs/data/embeddings.json
      - scripts/eval.mjs
      - scripts/corelib.mjs
      - scripts/eval_set.json
      - scripts/eval_set_gauntlet_dev.json
      - scripts/eval_set_gauntlet_blind.json
      - scripts/antwoord_eval.mjs
      - scripts/standaardvragen.json
  push:
    paths:
      - docs/search-core.js
      - docs/index.html
      - docs/data/corpus.json
      - docs/data/embeddings.json
      - scripts/eval.mjs
      - scripts/corelib.mjs
      - scripts/eval_set.json
      - scripts/eval_set_auto.json
      - scripts/eval_set_gauntlet_dev.json
      - scripts/eval_set_gauntlet_blind.json
      - scripts/quote_test.mjs
      - scripts/antwoord_eval.mjs
      - scripts/standaardvragen.json

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Citaten mogen nooit midden in een zin afbreken
        run: node scripts/quote_test.mjs
      - name: De voorgebouwde index rangschikt hetzelfde als de zoeker
        run: node scripts/index_test.mjs
      # Kan de app op de standaardvragen van de site überhaupt een antwoord geven? Deze gate
      # vangt wat een zoek-eval niet ziet: de juiste pagina gevonden, en tóch "Wij hebben geen
      # informatie over dit onderwerp" omdat het antwoord in een tabel stond.
      - name: Standaardvragen leveren een compleet citaat op (103)
        run: node scripts/antwoord_eval.mjs --no-sem --gate
      # De drempels hieronder horen bij de treffertoets zoals die sinds "Een landenpagina is geen
      # antwoord op een vraag zonder land" telt: een landvariant is alleen een treffer als de
      # vraag dat land noemt. De oude drempels (0,91 en 0,82) stamden van vóór die strengere
      # toets en waren daarna niet meer haalbaar — deze staan met marge onder de gemeten waarden.
      - name: Gate op de handgemaakte vragen (126)
        env:
          GATE_RECALL: "0.90"
          GATE_MRR: "0.80"
        run: node scripts/eval.mjs --no-sem --gate
      - name: Gate op de gegenereerde vragen (1000)
        env:
          GATE_RECALL: "0.95"
          GATE_MRR: "0.88"
        run: node scripts/eval.mjs --no-sem --gate --set=eval_set_auto.json
      # De vijandige set: vragen in de woorden van de beller. Hier is nog veel te winnen, dus
      # de drempel staat laag — hij is er om achteruitgang te vangen, niet om te vieren.
      - name: Gate op de vijandige vragen (114, dev)
        env:
          GATE_RECALL: "0.52"
          GATE_MRR: "0.37"
        run: node scripts/eval.mjs --no-sem --gate --set=eval_set_gauntlet_dev.json
      - name: Gate op de vijandige vragen (108, blind)
        env:
          GATE_RECALL: "0.44"
          GATE_MRR: "0.33"
        run: node scripts/eval.mjs --no-sem --gate --set=eval_set_gauntlet_blind.json
