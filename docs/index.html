<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Voorlichter Chatbot — NederlandWereldwijd (testomgeving)</title>
<style>
:root{--rijk-blauw:#154273;--rijk-licht:#007bc7;--cap-blauw:#1f7ec4;--vraag-bg:#cfe6fb;--vraag-tekst:#14375e;--groen:#39870c;--oranje:#d3780c;--grijs:#f3f3f3;--rand:#d6d6d6;}
*{box-sizing:border-box;}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--grijs);color:#1a1a1a;}
.app{max-width:760px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
.header{background:var(--rijk-blauw);color:#fff;padding:18px 24px;}
.header h1{margin:0;font-size:1.3rem;}
.header p{margin:4px 0 0;font-size:.82rem;opacity:.85;}
.keybar{background:#0f3258;color:#fff;padding:10px 24px;font-size:.82rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.keybar select,.keybar input{padding:7px 10px;border:none;border-radius:6px;font-size:.85rem;}
.keybar input{flex:1;min-width:180px;}
.keybar a{color:#9fd0ff;font-size:.78rem;white-space:nowrap;}
.keybar .status{font-size:.78rem;width:100%;}
.conversation{flex:1;padding:24px;overflow-y:auto;}
.empty{color:#666;font-style:italic;}
.samples{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;}
.samples button{background:#fff;border:1px solid var(--rand);border-radius:16px;padding:6px 12px;font-size:.8rem;cursor:pointer;}
.turn{margin-bottom:28px;}
.label{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:#6a6a6a;margin-bottom:4px;}
.turn{margin-bottom:22px;}
.row{display:flex;margin-bottom:14px;gap:10px;align-items:flex-end;}
.row.user{justify-content:flex-end;}
.bubble{position:relative;max-width:80%;padding:12px 16px;border-radius:16px;line-height:1.45;}
.bubble.vraag{background:var(--vraag-bg);color:var(--vraag-tekst);border-bottom-right-radius:4px;font-weight:600;}
.bubble.vraag::after{content:"";position:absolute;right:-7px;bottom:8px;border-width:8px 0 0 10px;border-style:solid;border-color:transparent transparent transparent var(--vraag-bg);}
.avatar{width:44px;height:44px;border-radius:50%;flex:0 0 44px;background:#fff;border:1px solid var(--rand);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:22px;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.bubble.antwoord{background:#fff;border:1px solid var(--rand);border-bottom-left-radius:4px;max-width:84%;padding:14px 16px;}
.bubble.antwoord::after{content:"";position:absolute;left:-8px;bottom:8px;border-width:8px 10px 0 0;border-style:solid;border-color:transparent #fff transparent transparent;}
.bubble.antwoord::before{content:"";position:absolute;left:-9px;bottom:7px;border-width:9px 11px 0 0;border-style:solid;border-color:transparent var(--rand) transparent transparent;}
.restated{font-style:italic;color:#333;margin-bottom:12px;}
.bridge{margin:0 0 10px;font-weight:600;}
blockquote.answer{margin:0 0 8px;padding:12px 16px;background:#f7faf4;border-left:4px solid var(--groen);white-space:pre-wrap;line-height:1.5;border-radius:4px;}
blockquote.answer.unverified{background:#fdf6ec;border-left-color:var(--oranje);}
.cite-src{font-size:.72rem;color:#6a6a6a;margin:0 0 12px 4px;}
.note{font-size:.85rem;color:var(--oranje);margin:10px 0;}
.no-answer{color:#666;margin-bottom:12px;}
.section{margin-top:16px;font-size:.9rem;}
.section ul{margin:4px 0 0;padding-left:18px;}
.section .label{margin-bottom:6px;}
.clarify{margin:12px 0;padding:12px 14px;background:#eef4fb;border:1px solid #cfe0f2;border-radius:8px;}
.clarify .label{color:var(--rijk-blauw);}
.clarify button{display:block;text-align:left;width:100%;margin-top:6px;background:#fff;border:1px solid #cfe0f2;border-radius:6px;padding:8px 10px;font-size:.88rem;cursor:pointer;}
.clarify button:hover{background:#f5f9fd;}
.followups{margin-top:16px;}
.followups .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
.followups button{background:#fff;border:1px solid var(--rand);border-radius:16px;padding:6px 12px;font-size:.82rem;cursor:pointer;}
.followups button:hover{background:#f0f5fa;border-color:var(--rijk-licht);}
a{color:var(--rijk-licht);}
.loading{margin-top:12px;color:#555;font-style:italic;}
.error{margin-top:12px;color:#b00020;}
.composer{display:flex;gap:8px;padding:16px 24px;background:#fff;border-top:1px solid var(--rand);}
.composer input{flex:1;padding:12px 14px;border:1px solid var(--rand);border-radius:8px;font-size:1rem;}
.composer button{padding:12px 20px;background:var(--rijk-blauw);color:#fff;border:none;border-radius:8px;font-size:1rem;cursor:pointer;}
.composer button:disabled{opacity:.5;cursor:default;}
.composer button:hover:not(:disabled){background:#0f3258;}
.badge{display:inline-block;font-size:.7rem;padding:2px 8px;border-radius:10px;margin-left:8px;vertical-align:middle;}
.badge.ai{background:#e6f0fa;color:var(--rijk-blauw);}
.badge.demo{background:#fdecec;color:#b00020;}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <h1>Voorlichter-assistent <span id="mode-badge"></span></h1>
    <p>Antwoorden letterlijk overgenomen van NederlandWereldwijd.nl — testomgeving over de volledige site</p>
  </header>
  <div class="keybar">
    <select id="provider" title="Kies AI-provider"></select>
    <select id="model" title="Kies model"></select>
    <input id="apikey" type="password" placeholder="Plak je API-sleutel (optioneel)" />
    <a id="keylink" href="#" target="_blank" rel="noreferrer">sleutel ophalen</a>
    <span class="status" id="keystatus"></span>
  </div>
  <main class="conversation" id="conv">
    <p class="empty" id="loadmsg">Corpus laden…</p>
    <div class="samples" id="samples"></div>
  </main>
  <form class="composer" id="form">
    <input id="input" type="text" placeholder="Typ hier de vraag van de burger…" autocomplete="off" autofocus />
    <button type="submit" id="send" disabled>Laden…</button>
  </form>
</div>
<script>
const SYSTEM=`Je helpt een voorlichter van het klantcontactcentrum van NederlandWereldwijd. Je krijgt de vraag van de burger en enkele genummerde pagina's van NederlandWereldwijd.nl met hun LETTERLIJKE tekst.

Stel een antwoord samen dat bestaat uit:
1. "bridge": één korte, natuurlijke inleidende zin die de vraag herpakt en GRAMMATICAAL NAADLOOS overloopt in het eerste citaat. Schrijf deze zin PAS NADAT je de citaten hebt gekozen, zodat hij precies op het eerste citaat aansluit. Eindig niet op een dubbele punt als het citaat begint met een vraag of een zin die daar niet logisch op volgt.
2. "citations": de relevante passages die samen de vraag beantwoorden. Geef NIET de volledige tekst, maar per passage alleen een VERWIJZING: "source_index" (paginanummer), "start" (de eerste 4 tot 8 woorden van de passage, EXACT overgenomen uit de paginatekst) en "end" (de laatste 4 tot 8 woorden van de passage, EXACT overgenomen). De app knipt zelf het stuk tussen start en end uit de pagina. Begin en eindig op een natuurlijke zinsgrens; de passage moet aaneengesloten in de tekst staan. Kopieer "start" en "end" exact (zelfde woorden, leestekens en hoofdletters) zodat ze letterlijk terug te vinden zijn. Je mag passages uit verschillende pagina's combineren.
3. "clarifications": vragen die de voorlichter aan de burger moet stellen om een PRECIEZER antwoord te geven, als het antwoord daarvan afhangt. Veel antwoorden hangen af van het LAND waar de aanvrager woont. Geef per verduidelijking een "question" (wat de voorlichter moet uitvragen) en een "prefill" (een begin van een vervolgvraag dat de voorlichter kan aanvullen, bv. "Visum voor Nederland aanvragen vanuit "). Laat leeg als alles al duidelijk is.
4. "followups": 2 tot 4 logische vervolgvragen die de burger waarschijnlijk ook heeft (volledige, op zichzelf staande vragen).

Antwoord UITSLUITEND met JSON (geen tekst eromheen, geen codeblok):
{"restated_question":"<de vraag kort en helder geherformuleerd>","bridge":"<korte inleidende zin>","citations":[{"source_index":<paginanummer>,"start":"<eerste woorden van de passage>","end":"<laatste woorden van de passage>"}],"clarifications":[{"question":"<wat uit te vragen>","prefill":"<begin vervolgvraag>"}],"followups":["<vervolgvraag>"],"related_indices":[<max 3 andere relevante paginanummers>],"note":"<korte toelichting of leeg>"}

Als geen van de pagina's de vraag beantwoordt: laat "citations" leeg en leg dat uit in "note".`;

// ---- AI-providers (allemaal rechtstreeks vanuit de browser, met je eigen sleutel) ----
const PROVIDERS={
  gemini:{label:"Google Gemini (gratis)",models:["gemini-2.5-flash","gemini-2.0-flash","gemini-2.5-flash-lite"],keyUrl:"https://aistudio.google.com/apikey",keyHint:"Gratis sleutel via Google AI Studio",
    async call(key,model,system,user){
      const url=`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`;
      const cfg={temperature:0,maxOutputTokens:8000,responseMimeType:"application/json"};
      // 2.5-modellen "denken" standaard; die redeneer-tokens vullen anders de limiet. Uitzetten.
      if(model.indexOf("2.5")>=0)cfg.thinkingConfig={thinkingBudget:0};
      const body={systemInstruction:{parts:[{text:system}]},contents:[{role:"user",parts:[{text:user}]}],generationConfig:cfg};
      const r=await fetch(url,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});
      if(!r.ok)throw new Error("Gemini "+r.status+": "+(await r.text()).slice(0,200));
      const d=await r.json();
      const txt=(d.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("");
      if(!txt&&d.candidates?.[0]?.finishReason)throw new Error("Gemini gaf geen tekst terug ("+d.candidates[0].finishReason+"). Probeer opnieuw of kies een ander model.");
      return txt;}},
  openai:{label:"OpenAI (ChatGPT)",models:["gpt-4o-mini","gpt-4o","gpt-4.1-mini"],keyUrl:"https://platform.openai.com/api-keys",keyHint:"Sleutel via platform.openai.com (betaald)",
    async call(key,model,system,user){
      const r=await fetch("https://api.openai.com/v1/chat/completions",{method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+key},body:JSON.stringify({model,temperature:0,max_tokens:3000,response_format:{type:"json_object"},messages:[{role:"system",content:system},{role:"user",content:user}]})});
      if(!r.ok)throw new Error("OpenAI "+r.status+": "+(await r.text()).slice(0,200));
      const d=await r.json();return d.choices?.[0]?.message?.content||"";}},
  anthropic:{label:"Anthropic (Claude)",models:["claude-sonnet-4-6","claude-haiku-4-5-20251001"],keyUrl:"https://console.anthropic.com/settings/keys",keyHint:"Sleutel via console.anthropic.com (betaald)",
    async call(key,model,system,user){
      const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model,max_tokens:3000,system,messages:[{role:"user",content:user},{role:"assistant",content:"{"}]})});
      if(!r.ok)throw new Error("Claude "+r.status+": "+(await r.text()).slice(0,200));
      const d=await r.json();return "{"+(d.content||[]).map(c=>c.text||"").join("");}},
  openrouter:{label:"OpenRouter (veel modellen)",keyUrl:"https://openrouter.ai/keys",keyHint:"Sleutel via openrouter.ai (gratis modellen beschikbaar)",
    fallbackModels:["deepseek/deepseek-chat-v3-0324:free","meta-llama/llama-3.3-70b-instruct:free","openai/gpt-4o-mini"],
    async loadModels(){
      const r=await fetch("https://openrouter.ai/api/v1/models");
      const d=await r.json();
      const free=(d.data||[]).filter(m=>m.id.endsWith(":free")).map(m=>m.id);
      const pref=["deepseek","llama-3.3","gemini","qwen","mistral"];
      free.sort((a,b)=>{const ra=pref.findIndex(x=>a.includes(x)),rb=pref.findIndex(x=>b.includes(x));return (ra<0?99:ra)-(rb<0?99:rb)||a.localeCompare(b);});
      const popular=["openai/gpt-4o-mini","anthropic/claude-3.5-sonnet","google/gemini-2.5-flash"];
      return [...free,...popular];},
    async call(key,model,system,user){
      const r=await fetch("https://openrouter.ai/api/v1/chat/completions",{method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+key},body:JSON.stringify({model,temperature:0,max_tokens:3000,messages:[{role:"system",content:system},{role:"user",content:user}]})});
      if(!r.ok)throw new Error("OpenRouter "+r.status+": "+(await r.text()).slice(0,200));
      const d=await r.json();
      if(d.error)throw new Error("OpenRouter: "+(d.error.message||JSON.stringify(d.error)).slice(0,200));
      return d.choices?.[0]?.message?.content||"";}}
};

const STOP=new Set("de het een en van in op te voor met aan is ik je u hoe wat waar wanneer kan moet mijn uw ben wil naar om dat die er ook als of bij dan zijn heb heeft wordt worden the a to of".split(" "));
const SAMPLES=["Hoe vraag ik een ID-kaart aan vanuit het buitenland?","Wat kost een paspoort vanuit het buitenland?","Wat is een BSN?","Mijn rijbewijs is gestolen in het buitenland, wat nu?","Ik ben mijn DigiD-wachtwoord vergeten","Wat is een apostille?"];
const TOPK=5; // aantal kandidaat-pagina's dat naar het AI-model gaat
let CORPUS=[],PTOKENS=[];

function tokenize(t){return t.toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>2&&!STOP.has(w));}
// Zoek-index per pagina = titel + samenvatting (AI of meta-omschrijving) + url-slug.
function searchText(p){return [p.title,p.summary||p.desc||p.text.slice(0,200),p.url].join(" ");}
function tokensOf(p){return new Set(p.url.split(/[-\/]/).concat(tokenize(searchText(p))).map(s=>s.toLowerCase()));}
function rank(q){const qt=tokenize(q);if(!qt.length)return [];const s=[];for(let i=0;i<CORPUS.length;i++){let o=0;for(const t of qt)if(PTOKENS[i].has(t))o++;if(o)s.push([o,i]);}s.sort((a,b)=>b[0]-a[0]);return s.slice(0,TOPK).map(x=>x[1]);}
function normalize(s){return s.replace(/\s+/g," ").trim().toLowerCase();}

// Repareer afgekapte JSON: knip terug tot na de laatst afgesloten haak en sluit
// de nog openstaande haken. Afgemaakte citaten blijven zo behouden.
function tryRepairJSON(raw){
  const a=raw.indexOf("{");if(a<0)return null;
  const s=raw.slice(a);
  let inStr=false,esc=false;const stack=[];let cut=-1,cutStack=null;
  for(let i=0;i<s.length;i++){
    const ch=s[i];
    if(inStr){if(esc)esc=false;else if(ch==="\\")esc=true;else if(ch==='"')inStr=false;continue;}
    if(ch==='"'){inStr=true;continue;}
    if(ch==='{')stack.push('}');
    else if(ch==='[')stack.push(']');
    else if(ch==='}'||ch===']'){stack.pop();cut=i+1;cutStack=stack.slice();}
  }
  if(cut<0)return null;
  let fixed=s.slice(0,cut).replace(/,\s*$/,"");
  for(let k=cutStack.length-1;k>=0;k--)fixed+=cutStack[k];
  try{return JSON.parse(fixed);}catch(e){return null;}
}
// Tolerant JSON uitlezen: fences eraf, normaal parsen, anders repareren, anders nette melding.
function parseModelJSON(text){
  let t=(text||"").trim();
  const fence=t.match(/```(?:json)?\s*([\s\S]*?)```/i);
  if(fence)t=fence[1].trim();
  const a=t.indexOf("{");
  if(a<0)throw new Error("Geen JSON in modelantwoord. Ruwe output: "+(text||"").slice(0,150));
  const m=t.slice(a).match(/\{[\s\S]*\}/);
  if(m){try{return JSON.parse(m[0]);}catch(e){/* val door naar reparatie */}}
  const rep=tryRepairJSON(t);
  if(rep){rep.__partial=true;return rep;}
  throw new Error("Het antwoord werd afgebroken (te lang). Probeer de vraag opnieuw te stellen.");
}
// Zoek een (kort) exact fragment in de tekst; bij geen exacte match een witruimte-tolerante poging.
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");}
function findFrom(text,phrase,from){
  if(!phrase)return null;from=from||0;
  let i=text.indexOf(phrase,from);
  if(i>=0)return {i,len:phrase.length};
  const words=phrase.trim().split(/\s+/).map(escRe);
  if(!words.length)return null;
  const m=new RegExp(words.join("\\s+"),"i").exec(text.slice(from));
  return m?{i:from+m.index,len:m[0].length}:null;
}
// Knip op basis van start/end-verwijzing het exacte, aaneengesloten stuk uit de paginatekst.
function extractQuote(text,start,end){
  const s=findFrom(text,(start||"").trim(),0);
  if(!s)return null;
  const ep=(end||"").trim();
  if(ep){const e=findFrom(text,ep,s.i);if(e&&e.i+e.len>s.i){let q=text.slice(s.i,e.i+e.len);return q.length>2000?q.slice(0,2000):q;}}
  const nl=text.indexOf("\n",s.i);
  return text.slice(s.i, nl>s.i?nl:Math.min(text.length,s.i+600)).trim();
}

const conv=document.getElementById("conv"),provSel=document.getElementById("provider"),modelSel=document.getElementById("model"),keyInput=document.getElementById("apikey"),keyLink=document.getElementById("keylink"),keyStatus=document.getElementById("keystatus"),modeBadge=document.getElementById("mode-badge"),sendBtn=document.getElementById("send");

Object.entries(PROVIDERS).forEach(([id,p])=>{const o=document.createElement("option");o.value=id;o.textContent=p.label;provSel.appendChild(o);});
provSel.value=localStorage.getItem("provider")||"gemini";

async function fillModels(){
  const p=PROVIDERS[provSel.value];
  let models=p.models||[];
  if(p.loadModels){
    modelSel.innerHTML="<option>laden…</option>";modelSel.disabled=true;
    try{models=await p.loadModels();}catch(e){models=p.fallbackModels||[];}
    modelSel.disabled=false;
  }
  modelSel.innerHTML="";
  models.forEach(m=>{const o=document.createElement("option");o.value=m;o.textContent=m;modelSel.appendChild(o);});
  const saved=localStorage.getItem("model_"+provSel.value);
  modelSel.value=models.includes(saved)?saved:models[0];
  localStorage.setItem("model_"+provSel.value,modelSel.value);
  refreshMode();
}
function loadKey(){keyInput.value=localStorage.getItem("apikey_"+provSel.value)||"";}
function refreshMode(){const p=PROVIDERS[provSel.value];keyLink.href=p.keyUrl;keyInput.placeholder=p.keyHint;const has=keyInput.value.trim().length>10;keyStatus.textContent=has?("AI-modus actief — "+p.label+" / "+modelSel.value):("Demo-modus (geen AI). Tip: "+p.keyHint);modeBadge.innerHTML=has?'<span class="badge ai">AI</span>':'<span class="badge demo">DEMO</span>';}

provSel.addEventListener("change",()=>{localStorage.setItem("provider",provSel.value);fillModels();loadKey();refreshMode();});
modelSel.addEventListener("change",()=>{localStorage.setItem("model_"+provSel.value,modelSel.value);refreshMode();});
keyInput.addEventListener("input",()=>{localStorage.setItem("apikey_"+provSel.value,keyInput.value);refreshMode();});
fillModels();loadKey();refreshMode();

const inputEl=document.getElementById("input");
function askText(t){inputEl.value=t;document.getElementById("form").requestSubmit();}
function prefill(t){inputEl.value=t;inputEl.focus();inputEl.setSelectionRange(t.length,t.length);}

const samples=document.getElementById("samples");
SAMPLES.forEach(s=>{const b=document.createElement("button");b.textContent=s;b.onclick=()=>askText(s);samples.appendChild(b);});

(async function load(){
  try{
    const r=await fetch("data/corpus.json");
    if(!r.ok)throw new Error("corpus.json niet gevonden ("+r.status+")");
    CORPUS=await r.json();PTOKENS=CORPUS.map(tokensOf);
    const withSum=CORPUS.filter(p=>p.summary).length;
    document.getElementById("loadmsg").textContent="Corpus geladen: "+CORPUS.length+" pagina's"+(withSum?(" ("+withSum+" met AI-samenvatting)"):"")+". Stel een vraag — bijvoorbeeld:";
    sendBtn.disabled=false;sendBtn.textContent="Vraag stellen";
  }catch(e){document.getElementById("loadmsg").innerHTML='<span class="error">Corpus laden mislukt: '+escapeHtml(e.message)+'</span>';}
})();

async function runQuestion(q){
  if(sendBtn.disabled||!q)return;
  const turn=addTurn(q);
  const cands=rank(q);
  if(!cands.length){renderResult(turn,{restated_question:q,bridge:"",citations:[],note:"Geen passende pagina gevonden voor deze vraag.",used:[],related:[]});return;}
  const key=keyInput.value.trim();
  try{const result=key.length>10?await askAI(q,cands,key):demoAnswer(q,cands);renderResult(turn,result);}
  catch(err){turn.querySelector(".slot").innerHTML='<div class="bubble antwoord"><div class="error">Er ging iets mis: '+escapeHtml(err.message)+'</div></div>';}
}
document.getElementById("form").addEventListener("submit",(e)=>{e.preventDefault();const q=inputEl.value.trim();if(!q)return;inputEl.value="";runQuestion(q);});

function srcOf(i){return {title:CORPUS[i].title,url:CORPUS[i].url};}

function demoAnswer(q,cands){
  const p=CORPUS[cands[0]];const paras=p.text.split("\n").filter(x=>x.length>40);
  return {restated_question:q,bridge:"",demo:true,
    citations:[{text:paras.slice(0,2).join("\n"),verified:true,src:srcOf(cands[0])}],
    note:"DEMO-modus: begin van de best-matchende pagina, niet door AI geselecteerd of geciteerd. Vul een sleutel in voor een echte inleiding + letterlijke citaten.",
    used:[srcOf(cands[0])],related:cands.slice(1).map(srcOf)};
}

async function askAI(q,cands,key){
  const listing=cands.map((idx,n)=>`[${n}] TITEL: ${CORPUS[idx].title}\nURL: ${CORPUS[idx].url}\nTEKST:\n${CORPUS[idx].text}`).join("\n\n---\n\n");
  const user=`Vraag van de voorlichter:\n${q}\n\nPagina's:\n${listing}`;
  const text=await PROVIDERS[provSel.value].call(key,modelSel.value,SYSTEM,user);
  const r=parseModelJSON(text);
  const rawCites=Array.isArray(r.citations)?r.citations:[];
  const citations=[];const usedSet=new Set();let notFound=0;
  for(const c of rawCites){
    const local=c.source_index;const gi=Number.isInteger(local)?cands[local]:null;if(gi===null)continue;
    // Knip het exacte stuk zelf uit de pagina o.b.v. de start/end-verwijzing -> altijd letterlijk.
    const quote=extractQuote(CORPUS[gi].text,c.start,c.end);
    if(!quote){notFound++;continue;}
    citations.push({text:quote,verified:true,src:srcOf(gi)});usedSet.add(gi);
  }
  const used=[...usedSet].map(srcOf);
  let related=(r.related_indices||[]).map(n=>cands[n]).filter(i=>Number.isInteger(i)&&!usedSet.has(i)).map(srcOf);
  let note=r.note||"";
  if(r.__partial&&citations.length)note="Het antwoord was lang en mogelijk niet volledig; de getoonde citaten kloppen wel. Stel de vraag eventueel specifieker.";
  if(!citations.length){
    // Geen citaat gevonden: toon toch de beste kandidaten als bron.
    if(!related.length)related=cands.slice(0,3).map(srcOf);
    if(notFound)note="De passage kon niet exact op de bronpagina worden teruggevonden. Bekijk de bron hieronder.";
    else if(!note)note="Op de gevonden pagina's staat geen letterlijk antwoord op deze vraag. Bekijk de bron hieronder.";
  }
  const clarifications=(Array.isArray(r.clarifications)?r.clarifications:[]).map(c=>({question:(c.question||"").trim(),prefill:(c.prefill||"").trim()})).filter(c=>c.question);
  const followups=(Array.isArray(r.followups)?r.followups:[]).map(f=>(f||"").trim()).filter(Boolean);
  return {restated_question:r.restated_question||q,bridge:r.bridge||"",citations,used,related,note,clarifications,followups};
}

function addTurn(q){
  document.querySelector(".empty")?.remove();document.getElementById("samples")?.remove();
  const art=document.createElement("article");art.className="turn";
  art.innerHTML=`<div class="row user"><div class="bubble vraag">${escapeHtml(q)}</div></div>`
    +`<div class="row bot"><div class="avatar"><img src="assets/avatar.png" alt="" onerror="this.parentNode.textContent='🐶'"></div><div class="slot"><div class="bubble antwoord"><div class="loading">Bezig met opzoeken…</div></div></div></div>`;
  conv.appendChild(art);art.scrollIntoView({behavior:"smooth",block:"end"});return art;
}
function sourceList(items){return `<ul>${items.map(s=>`<li><a href="${s.url}" target="_blank" rel="noreferrer">${escapeHtml(s.title)}</a></li>`).join("")}</ul>`;}
function renderResult(turn,r){
  const badge=r.demo?'<span class="badge demo">DEMO</span>':'<span class="badge ai">AI</span>';
  let h=`<div class="bubble antwoord"><div class="restated"><span class="label">Je vraag (zoals begrepen) ${badge}</span>${escapeHtml(r.restated_question)}</div>`;
  if(r.bridge)h+=`<p class="bridge">${escapeHtml(r.bridge)}</p>`;
  if(r.citations&&r.citations.length){
    const multi=r.used&&r.used.length>1;
    for(const c of r.citations){
      h+=`<blockquote class="answer ${c.verified?'verified':'unverified'}">${escapeHtml(c.text)}</blockquote>`;
      if(multi)h+=`<div class="cite-src">— ${escapeHtml(c.src.title)}</div>`;
    }
  }else h+=`<div class="no-answer">Geen letterlijk antwoord gevonden.</div>`;
  if(r.note)h+=`<div class="note">${escapeHtml(r.note)}</div>`;
  const clar=r.clarifications||[];
  if(clar.length){
    h+=`<div class="clarify"><span class="label">Voor een preciezer antwoord — vraag na</span>`;
    clar.forEach((c,i)=>{h+=`<button data-prefill="${escapeHtml(c.prefill||c.question)}">${escapeHtml(c.question)}</button>`;});
    h+=`</div>`;
  }
  if(r.used&&r.used.length)h+=`<div class="section"><span class="label">Lees meer — gebruikte bronnen</span>${sourceList(r.used)}</div>`;
  if(r.related&&r.related.length)h+=`<div class="section"><span class="label">Misschien ook relevant</span>${sourceList(r.related)}</div>`;
  const fups=r.followups||[];
  if(fups.length){
    h+=`<div class="followups"><span class="label">Mogelijke vervolgvragen</span><div class="chips">`;
    fups.forEach(f=>{h+=`<button data-q="${escapeHtml(f)}">${escapeHtml(f)}</button>`;});
    h+=`</div></div>`;
  }
  h+=`</div>`;
  const slot=turn.querySelector(".slot");slot.innerHTML=h;
  slot.querySelectorAll(".followups button").forEach(b=>b.onclick=()=>askText(b.getAttribute("data-q")));
  slot.querySelectorAll(".clarify button").forEach(b=>b.onclick=()=>prefill(b.getAttribute("data-prefill")));
  turn.scrollIntoView({behavior:"smooth",block:"end"});
}
function escapeHtml(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
</script>
