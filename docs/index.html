<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Leo (voorlichter assistent) — NederlandWereldwijd (testomgeving)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
<style>
:root{
  /* Rijksoverheid-palet, in lijn met het avatar-icoon (blauwe pet, navy contouren, gele hond) */
  --rijk-blauw:#154273;   /* ro-darker  – header, koppen */
  --rijk-licht:#007bc7;   /* ro-blue    – links, accenten */
  --rijk-donker:#01689b;  /* ro-dark    – hover */
  --cap-blauw:#007bc7;    /* pet-blauw  – bronverwijzingen */
  --geel:#ffb612;         /* ro-yellow  – icoon-accent */
  --oranje:#e17000;       /* ro-orange */
  --groen:#39870c;        /* ro-green */
  --rood:#d52b1e;         /* ro-red */
  --vraag-bg:#d9ebf7;     /* ro-lighter – vraagbubbel */
  --vraag-tekst:#154273;
  --blauw-bg:#e6f0f7;     /* ro-bg      – lichte blauwe vlakken */
  --blauw-licht:#b3d7ee;  /* ro-light   – zachte blauwe randen */
  --grijs:#f3f3f3;        /* bg-alt */
  --rand:#e5e5e5;         /* line-light */
  --rand-sterk:#c9c9c9;   /* line */
  --ink:#333333;
  --ink-licht:#696969;
}
*{box-sizing:border-box;}
body{margin:0;font-family:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.6;background:#eef1f5;color:var(--ink);-webkit-font-smoothing:antialiased;}
html,body{height:100%;}
.layout{display:flex;height:100vh;width:100%;overflow:hidden;background:#fff;}
/* Zijbalk met merk + recente gesprekken (zoals ChatGPT/Claude) */
.sidebar{flex:0 0 270px;background:#f7f8fa;border-right:1px solid var(--rand);display:flex;flex-direction:column;min-height:0;}
.sidebar-head{display:flex;align-items:center;gap:10px;padding:16px 16px 12px;}
.brand-logo{width:40px;height:40px;border-radius:50%;flex:0 0 40px;object-fit:cover;border:1px solid var(--rand);background:#fff;}
.brand-text{min-width:0;}
.brand-text h1{margin:0;font-size:1rem;font-weight:700;color:var(--rijk-blauw);line-height:1.2;}
.brand-sub{font-weight:400;font-size:.82em;color:var(--ink-licht);}
.brand-text p{margin:1px 0 0;font-size:.74rem;color:var(--ink-licht);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.new-chat{display:flex;align-items:center;justify-content:center;gap:7px;margin:6px 14px 10px;padding:10px 14px;background:var(--rijk-licht);color:#fff;border:none;border-radius:12px;font-size:.9rem;font-weight:600;font-family:inherit;cursor:pointer;transition:background .12s;}
.new-chat:hover{background:var(--rijk-donker);}
.convo-section{flex:1;min-height:0;overflow-y:auto;padding:4px 8px 8px;}
.convo-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-licht);font-weight:700;padding:8px 8px 4px;}
.convo-list{list-style:none;margin:0;padding:0;}
.convo-item{display:flex;align-items:center;gap:6px;border-radius:10px;padding:9px 10px;font-size:.88rem;color:var(--ink);cursor:pointer;transition:background .12s;}
.convo-item:hover{background:#eceff3;}
.convo-item.active{background:var(--blauw-bg);color:var(--rijk-blauw);font-weight:600;}
.convo-item .convo-title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.convo-del{flex:0 0 auto;border:none;background:transparent;color:var(--ink-licht);cursor:pointer;font-size:1rem;line-height:1;padding:2px 4px;border-radius:6px;opacity:0;}
.convo-item:hover .convo-del{opacity:1;}
.convo-del:hover{background:#dfe3e8;color:var(--rood);}
.convo-empty{color:var(--ink-licht);font-size:.82rem;font-style:italic;padding:8px 10px;}
.sidebar-foot{border-top:1px solid var(--rand);padding:10px 12px;}
.settings-btn{display:flex;align-items:center;gap:8px;width:100%;background:transparent;color:var(--ink-licht);border:none;border-radius:10px;padding:9px 10px;font-size:.86rem;font-family:inherit;cursor:pointer;transition:background .12s,color .12s;}
.settings-btn:hover{background:#eceff3;color:var(--rijk-blauw);}
.settings-btn[aria-expanded="true"]{background:var(--blauw-bg);color:var(--rijk-blauw);}
.settings-btn #mode-badge{margin-left:auto;}
/* Chat-kolom */
.chat{flex:1;display:flex;flex-direction:column;min-width:0;background:#fff;}
.chat-topbar{display:none;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--rand);background:#fff;}
.sidebar-toggle{background:transparent;border:none;color:var(--rijk-blauw);cursor:pointer;padding:4px;display:inline-flex;}
.chat-topbar-title{font-weight:700;color:var(--rijk-blauw);font-size:1rem;}
.sidebar-backdrop{display:none;}
.keybar.hidden{display:none;}
.keybar{background:var(--grijs);color:var(--ink);padding:14px 20px;font-size:.82rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--rand);}
.keybar select,.keybar input{padding:8px 10px;border:1px solid var(--rand);border-radius:8px;font-size:.85rem;background:#fff;color:var(--ink);font-family:inherit;}
.keybar input{flex:1;min-width:180px;}
.keybar a{color:var(--rijk-licht);font-size:.78rem;white-space:nowrap;font-weight:600;}
.keybar .status{font-size:.78rem;width:100%;color:var(--ink-licht);}
.conversation{flex:1;padding:32px 28px;overflow-y:auto;}
/* Welkomststaat: begroeting + composer samen verticaal gecentreerd (zoals ChatGPT) */
body.is-welcome .conversation{flex:0 0 auto;margin-top:auto;overflow:visible;padding-bottom:8px;}
body.is-welcome .composer{margin-bottom:auto;}
body.is-welcome .welcome{margin-top:0;}
body.is-welcome .empty{margin-top:0;}
.empty{color:var(--ink-licht);font-style:italic;text-align:center;margin-top:8vh;}
.samples{margin-top:18px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:680px;margin-left:auto;margin-right:auto;}
.samples button{background:#fff;border:1px solid var(--rand);border-radius:14px;padding:10px 16px;font-size:.88rem;cursor:pointer;color:var(--rijk-blauw);font-family:inherit;transition:background .12s,border-color .12s,transform .08s;}
.samples button:hover{background:var(--blauw-bg);border-color:var(--blauw-licht);transform:translateY(-1px);}
.label{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-licht);margin-bottom:4px;}
.turn{max-width:860px;margin:0 auto 22px;}
.row{display:flex;margin-bottom:14px;gap:12px;align-items:flex-start;animation:msg-in .28s ease both;}
.row.user{justify-content:flex-end;}
@keyframes msg-in{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.bubble{position:relative;max-width:80%;padding:12px 16px;border-radius:18px;line-height:1.55;}
.bubble.vraag{background:var(--vraag-bg);color:var(--vraag-tekst);font-weight:600;border-bottom-right-radius:6px;}
.avatar{width:38px;height:38px;border-radius:50%;flex:0 0 38px;background:#fff;border:1px solid var(--rand);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:20px;margin-top:2px;}
.avatar img{width:100%;height:100%;object-fit:cover;transform:scale(1.18);}
.bubble.antwoord{background:#fff;border:1px solid var(--rand);border-radius:18px;border-top-left-radius:6px;max-width:88%;padding:16px 18px;box-shadow:0 1px 2px rgba(20,40,70,.04);}
.restated-sub{font-size:.86rem;color:var(--ink-licht);margin:0 0 12px;line-height:1.45;}
.restated-sub .rs-label{font-weight:600;}
/* Tussenkopje dat opeenvolgende citaten groepeert (door de AI bepaald) */
.passage-heading{font-size:1rem;font-weight:700;color:var(--rijk-blauw);margin:20px 0 9px;padding-bottom:6px;border-bottom:1px solid var(--rand);}
/* Passage = één citaat als nette, gestructureerde tekst met een bron-kaartje eronder */
.passage{position:relative;margin:0 0 18px;}
.cite-body{border-left:3px solid var(--blauw-licht);padding:2px 40px 2px 16px;}
.passage.verified .cite-body{border-left-color:var(--rijk-licht);}
.passage.unverified .cite-body{border-left-color:var(--oranje);}
.cite-body.clickable-cite{cursor:pointer;transition:background .12s;border-radius:0 8px 8px 0;}
.cite-body.clickable-cite:hover{background:var(--blauw-bg);}
.cite-h{font-weight:700;color:var(--rijk-blauw);font-size:1.04rem;margin:0 0 5px;line-height:1.3;}
.cite-h:not(:first-child){margin-top:12px;}
.cite-p{margin:0 0 7px;line-height:1.6;}
.cite-p:last-child{margin-bottom:0;}
/* Bron-kaartje direct onder de passage (bron dicht bij de bewering) */
.src-card{display:inline-flex;align-items:center;gap:8px;margin:9px 0 0 16px;padding:6px 10px 6px 7px;border:1px solid var(--rand);border-radius:12px;background:#fff;cursor:pointer;max-width:100%;transition:background .12s,border-color .12s;}
.src-card:hover{background:var(--blauw-bg);border-color:var(--blauw-licht);}
.src-badge{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:var(--rijk-licht);color:#fff;font-size:.72rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center;}
.passage.unverified .src-badge{background:var(--oranje);}
.src-info{display:inline-flex;align-items:center;gap:5px;min-width:0;color:var(--rijk-blauw);}
.src-title{font-weight:600;font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px;}
.src-go{font-size:.78rem;color:var(--ink-licht);white-space:nowrap;}
.src-live{flex:0 0 auto;margin-left:2px;color:var(--ink-licht);text-decoration:none;font-size:.95rem;padding:0 3px;border-radius:6px;}
.src-live:hover{color:var(--rijk-licht);}
ol.srclist{margin:4px 0 0;padding-left:20px;}
ol.srclist li{margin:2px 0;}
.note{font-size:.85rem;color:var(--oranje);margin:10px 0;}
.no-answer{color:#666;margin-bottom:12px;}
.section{margin-top:16px;font-size:.9rem;}
.section ul{margin:4px 0 0;padding-left:18px;}
.section .label{margin-bottom:6px;}
.clarify{margin:12px 0;padding:12px 14px;background:var(--blauw-bg);border:1px solid var(--blauw-licht);border-radius:8px;}
.clarify .label{color:var(--rijk-blauw);}
.clarify button{display:block;text-align:left;width:100%;margin-top:6px;background:#fff;border:1px solid var(--blauw-licht);border-radius:6px;padding:8px 10px;font-size:.88rem;cursor:pointer;}
.clarify button:hover{background:#f5f9fd;}
.followups{margin-top:16px;}
.followups .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
.followups button{background:#fff;border:1px solid var(--rand);border-radius:14px;padding:8px 14px;font-size:.85rem;cursor:pointer;color:var(--rijk-blauw);font-family:inherit;transition:background .12s,border-color .12s;}
.followups button:hover{background:var(--blauw-bg);border-color:var(--blauw-licht);}
a{color:var(--rijk-licht);}
.loading{margin-top:12px;color:#555;font-style:italic;}
.error{margin-top:12px;color:var(--rood);}
.composer{padding:12px 24px 20px;background:linear-gradient(to top,#fff 70%,rgba(255,255,255,0));position:sticky;bottom:0;}
.composer-pill{display:flex;align-items:center;gap:8px;max-width:860px;margin:0 auto;background:#fff;border:1.5px solid var(--rand);border-radius:26px;padding:5px 6px 5px 18px;box-shadow:0 2px 12px rgba(20,40,70,.07);transition:border-color .15s,box-shadow .15s;}
.composer-pill:focus-within{border-color:var(--rijk-licht);box-shadow:0 3px 16px rgba(0,123,199,.15);}
.composer input{flex:1;padding:10px 0;border:none;outline:none;font-size:1rem;background:transparent;font-family:inherit;color:var(--ink);}
.send-btn{flex:0 0 auto;width:40px;height:40px;border-radius:50%;background:var(--rijk-licht);color:#fff;border:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background .12s,transform .08s;}
.send-btn:hover:not(:disabled){background:var(--rijk-donker);}
.send-btn:active:not(:disabled){transform:scale(.93);}
.send-btn:disabled{background:var(--rand-sterk);cursor:default;}
.badge{display:inline-block;font-size:.7rem;padding:2px 8px;border-radius:10px;margin-left:8px;vertical-align:middle;}
.badge.ai{background:var(--blauw-bg);color:var(--rijk-blauw);}
.badge.demo{background:#fdecec;color:var(--rood);}
/* Welkomststaat (lege conversatie) */
.welcome{font-style:normal;color:#3a4a5c;line-height:1.6;text-align:center;max-width:600px;margin:7vh auto 0;font-size:1.12rem;}
.welcome-logo{display:block;width:84px;height:84px;border-radius:50%;object-fit:cover;margin:0 auto 18px;border:1px solid var(--rand);box-shadow:0 4px 16px rgba(20,40,70,.1);}
.welcome strong{color:var(--rijk-blauw);font-size:1.32rem;display:block;margin-bottom:6px;font-weight:700;}
.welcome .hint{display:block;margin-top:14px;color:var(--ink-licht);font-style:normal;font-size:.92rem;}
/* Typing-indicator: shimmer over de tekst (modern, zoals Claude) */
.shimmer{font-weight:600;background:linear-gradient(90deg,#aab6c4 20%,var(--rijk-blauw) 50%,#aab6c4 80%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:shimmer 1.5s linear infinite;}
@keyframes shimmer{to{background-position:-200% 0;}}
@media (prefers-reduced-motion:reduce){.shimmer{animation:none;color:var(--ink-licht);-webkit-text-fill-color:currentColor;}}
/* Kopieer-knop per citaat */
.copy-cite{position:absolute;top:0;right:0;background:rgba(255,255,255,.9);border:1px solid var(--rand);border-radius:8px;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:#5a6b7b;opacity:0;transition:opacity .12s;z-index:2;}
.passage:hover .copy-cite,.copy-cite:focus-visible{opacity:1;}
.copy-cite:hover{background:#fff;color:var(--rijk-blauw);}
.copy-cite.ok{opacity:1;color:var(--groen);border-color:var(--groen);}
/* Inklapbare bron-secties */
details.section>summary{cursor:pointer;list-style:none;}
details.section>summary::-webkit-details-marker{display:none;}
details.section>summary .label{display:inline-block;margin-bottom:0;}
details.section>summary::before{content:"\25B8";color:#9aa6b2;margin-right:6px;font-size:.7rem;}
details.section[open]>summary::before{content:"\25BE";}
details.section>summary:hover .label{color:var(--rijk-blauw);}
/* Antwoord-footer: bronnen/acties visueel scheiden van het antwoord zelf */
.answer-footer{margin-top:18px;padding-top:14px;border-top:1px solid var(--rand);}
.answer-footer>:first-child{margin-top:0;}
.answer-actions{display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap;}
.answer-actions .spacer{flex:1;}
.act-btn{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--rand);border-radius:16px;padding:5px 11px;font-size:.78rem;cursor:pointer;color:#33485c;}
.act-btn:hover{background:#f0f5fa;border-color:var(--rijk-licht);}
.act-btn.ok{border-color:var(--groen);color:var(--groen);}
/* Feedback (klopt dit antwoord?) */
.feedback{display:inline-flex;gap:6px;align-items:center;font-size:.78rem;color:var(--ink-licht);}
.fb-btn{background:#fff;border:1px solid var(--rand);border-radius:50%;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:.9rem;line-height:1;}
.fb-btn:hover{background:#f0f5fa;}
.fb-btn.sel-up{background:#e9f6e3;border-color:var(--groen);}
.fb-btn.sel-down{background:#fdecec;border-color:var(--rood);}
/* Toegankelijkheid: zichtbare focus voor toetsenbordnavigatie */
:focus-visible{outline:2px solid var(--rijk-licht);outline-offset:2px;}
/* Citaat klikbaar -> bronpagina-paneel */
.clickable-cite{cursor:pointer;}
/* Bron-viewer: in-flow rechterkolom op breed scherm (duwt niets weg, geen overflow) */
.viewer{flex:0 0 0;overflow:hidden;background:#fff;border-left:1px solid var(--rand);transition:flex-basis .25s ease;}
body.viewer-open .viewer{flex-basis:clamp(360px,34vw,540px);}
.viewer-inner{width:clamp(360px,34vw,540px);height:100%;display:flex;flex-direction:column;}
.viewer-head{display:flex;align-items:center;gap:10px;padding:14px 16px;background:rgba(255,255,255,.9);backdrop-filter:saturate(1.6) blur(8px);color:var(--rijk-blauw);border-bottom:1px solid var(--rand);flex:0 0 auto;}
.viewer-title{flex:1 1 auto;min-width:0;font-size:.92rem;font-weight:700;line-height:1.3;color:var(--rijk-blauw);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.viewer-open{flex:0 0 auto;color:var(--rijk-licht);background:#fff;font-size:.76rem;font-weight:600;white-space:nowrap;text-decoration:none;border:1px solid var(--rand);border-radius:14px;padding:5px 12px;transition:background .12s,border-color .12s;}
.viewer-open:hover{background:var(--blauw-bg);border-color:var(--blauw-licht);}
.viewer-close{background:#fff;color:var(--ink-licht);border:1px solid var(--rand);border-radius:50%;width:34px;height:34px;cursor:pointer;flex:0 0 auto;font-size:.85rem;line-height:1;transition:background .12s,color .12s;}
.viewer-close:hover{background:var(--grijs);color:var(--rijk-blauw);}
.viewer-body{padding:20px 22px;overflow-y:auto;line-height:1.65;font-size:.95rem;color:var(--ink);word-wrap:break-word;}
.viewer-body .vp{margin:0 0 3px;white-space:pre-wrap;}
.viewer-body .vh{font-weight:700;color:var(--rijk-blauw);margin:16px 0 5px;line-height:1.25;white-space:pre-wrap;}
.viewer-body .vh:first-child{margin-top:0;}
.viewer-body .vh1{font-size:1.22rem;}
.viewer-body .vh2{font-size:1.08rem;}
.viewer-body .vh3{font-size:.98rem;color:#33495f;}
.viewer-body mark.hl{background:#ffec70;padding:1px 1px;border-radius:2px;box-shadow:0 0 0 3px #ffec70;}
.viewer-note{color:var(--oranje);font-size:.85rem;margin-bottom:12px;font-style:italic;}
.viewer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:55;border:0;}
.viewer-backdrop[hidden]{display:none;}
.viewer-backdrop{display:none;}
/* Smal/middel: viewer wordt een over-elkaar schuivend paneel met verduistering */
@media (max-width:900px){
  .viewer{position:fixed;top:0;right:0;bottom:0;width:0;border-left:none;box-shadow:-6px 0 40px rgba(20,40,70,.18);z-index:62;transition:width .25s ease;}
  body.viewer-open .viewer{width:min(460px,94vw);}
  .viewer-inner{width:min(460px,94vw);}
  body.viewer-open .viewer-backdrop{display:block;}
}
/* Mobiel: zijbalk wordt off-canvas met hamburger */
@media (max-width:760px){
  .chat-topbar{display:flex;}
  .sidebar{position:fixed;top:0;left:0;bottom:0;z-index:65;transform:translateX(-100%);transition:transform .25s ease;box-shadow:6px 0 40px rgba(20,40,70,.18);}
  body.sidebar-open .sidebar{transform:translateX(0);}
  body.sidebar-open .sidebar-backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);border:0;z-index:64;}
  .conversation{padding:20px 16px;}
  .composer{padding:10px 12px 16px;}
  .bubble{max-width:90%;}
  .bubble.antwoord{max-width:96%;}
  .welcome{font-size:1.04rem;}
  .answer-actions{gap:8px;}
}
</style>
</head>
<body class="is-welcome">
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <img class="brand-logo" src="assets/avatar.png" alt="" onerror="this.style.display='none'" />
      <div class="brand-text">
        <h1>Leo <span class="brand-sub">(voorlichter assistent)</span></h1>
        <p>NederlandWereldwijd — testomgeving</p>
      </div>
    </div>
    <button id="reset" class="new-chat" title="Begin een nieuw gesprek"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Nieuw gesprek</button>
    <div class="convo-section">
      <div class="convo-label">Recente gesprekken</div>
      <ul class="convo-list" id="convo-list"></ul>
    </div>
    <div class="sidebar-foot">

<script>
const SYSTEM=`Je helpt een voorlichter van het klantcontactcentrum van NederlandWereldwijd. Je krijgt de vraag van de burger en enkele genummerde pagina's van NederlandWereldwijd.nl met hun LETTERLIJKE tekst.

Stel een antwoord samen dat bestaat uit:
1. "citations": de relevante passages die samen de vraag beantwoorden. Geef NIET de volledige tekst, maar per passage alleen een VERWIJZING: "source_index" (paginanummer), "start" (de eerste 4 tot 8 woorden van de passage, EXACT overgenomen uit de paginatekst) en "end" (de laatste 4 tot 8 woorden van de passage, EXACT overgenomen). De app knipt zelf het stuk tussen start en end uit de pagina. Begin en eindig op een natuurlijke zinsgrens; de passage moet aaneengesloten in de tekst staan. Kopieer "start" en "end" exact (zelfde woorden, leestekens en hoofdletters) zodat ze letterlijk terug te vinden zijn. Je mag passages uit verschillende pagina's combineren. REGELS voor goede citaten:
   - Citeer alleen VOLLEDIGE, op zichzelf staande zinnen of alinea's met inhoud. Citeer NOOIT een los kopje, sectietitel, knoptekst of navigatielabel (korte regels zonder werkwoord, zoals "Buitenland", "Let op:" of "Tijdelijke aanvraaglocaties").
   - Kies zo WEINIG citaten als nodig. Voeg alleen een tweede of derde citaat toe als dat ECHT nieuwe, aanvullende informatie geeft. Geen overlappende of herhalende citaten.
   - VOLGORDE & TUSSENKOPJES: zet de citaten in een logische leesvolgorde en groepeer ze met een "heading" per citaat onder korte tussenkopjes (bv. "Waar aanvragen", "Kosten", "Wat u nodig heeft", "Hoe lang het duurt", "Uitzonderingen"). Een tussenkopje is een KORT, beschrijvend label van 2 tot 4 woorden — GEEN zin en GEEN dubbele punt. Citaten die bij elkaar horen krijgen EXACT dezelfde "heading" (dan komen ze onder één kopje); een nieuw onderwerp krijgt een nieuwe heading. Houd een logische volgorde aan: eerst het kernantwoord, dan waar/hoe aanvragen, daarna voorwaarden, kosten en termijnen, en uitzonderingen als laatste. Laat de "heading" van het EERSTE citaat ALTIJD LEEG — dat citaat is het kernantwoord en wordt zonder kopje getoond. Gebruik dus GEEN kopje zoals "Kernantwoord". Gebruik tussenkopjes alleen als het antwoord uit meerdere onderdelen bestaat; bij één kort, samenhangend antwoord laat je alle headings leeg.
2. "clarifications": vragen die de voorlichter aan de burger moet stellen om een PRECIEZER antwoord te geven, als het antwoord daarvan afhangt. Veel antwoorden hangen af van het LAND waar de aanvrager woont. Geef per verduidelijking een "question" (wat de voorlichter moet uitvragen) en een "prefill" (een begin van een vervolgvraag dat de voorlichter kan aanvullen, bv. "Visum voor Nederland aanvragen vanuit "). Laat leeg als alles al duidelijk is.
3. "followups": 2 tot 4 logische vervolgvragen die de burger waarschijnlijk ook heeft (volledige, op zichzelf staande vragen).

Antwoord UITSLUITEND met JSON (geen tekst eromheen, geen codeblok):
{"restated_question":"<de vraag kort en helder geherformuleerd>","citations":[{"source_index":<paginanummer>,"heading":"<kort tussenkopje of leeg>","start":"<eerste woorden van de passage>","end":"<laatste woorden van de passage>"}],"clarifications":[{"question":"<wat uit te vragen>","prefill":"<begin vervolgvraag>"}],"followups":["<vervolgvraag>"],"related_indices":[<max 3 andere relevante paginanummers>],"note":"<korte toelichting of leeg>"}

Als geen van de pagina's de vraag beantwoordt: laat "citations" leeg en leg dat uit in "note".`;

// Herschrijft een (mogelijk elliptische) vervolgvraag tot een zelfstandige vraag, met gesprekscontext.
const CONDENSE_SYSTEM=`Je krijgt de samenvatting van een lopend gesprek tussen een voorlichter en een AI over overheidsvragen, plus een nieuwe vraag. Herschrijf de NIEUWE vraag tot één zelfstandige, op zichzelf staande vraag die ook zonder de context te begrijpen is (vul ontbrekend onderwerp aan uit de context). Betreft de nieuwe vraag duidelijk een nieuw onderwerp, geef hem dan vrijwel ongewijzigd terug. Antwoord UITSLUITEND met JSON: {"standalone_question":"<de zelfstandige vraag>"}`;

// Gespreksgeheugen: laatste beurten (zelfstandige vraag + korte samenvatting van het antwoord).
let history=[];

// ---- AI-providers (allemaal rechtstreeks vanuit de browser, met je eigen sleutel) ----
const PROVIDERS={
  gemini:{label:"Google Gemini (gratis)",models:["gemini-2.5-flash","gemini-2.0-flash","gemini-2.5-flash-lite"],keyUrl:"https://aistudio.google.com/apikey",keyHint:"Gratis sleutel via Google AI Studio",
    async call(key,model,system,user){
      const url=`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`;
      const cfg={temperature:0,maxOutputTokens:8000,responseMimeType:"application/json"};
      // 2.5-modellen "denken" standaard; die redeneer-tokens vullen anders de limiet. Uitzetten.
      if(model.indexOf("2.5")>=0)cfg.thinkingConfig={thinkingBudget:0};
      const body={systemInstruction:{parts:[{text:system}]},contents:[{role:"user",parts:[{text:user}]}],generationConfig:cfg};
      const r=await fetch(url,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});
      if(!r.ok)throw new Error("Gemini "+r.status+": "+(await r.text()).slice(0,200));
      const d=await r.json();
      const txt=(d.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("");
      if(!txt&&d.candidates?.[0]?.finishReason)throw new Error("Gemini gaf geen tekst terug ("+d.candidates[0].finishReason+"). Probeer opnieuw of kies een ander model.");
      return txt;}},
  openai:{label:"OpenAI (ChatGPT)",models:["gpt-4o-mini","gpt-4o","gpt-4.1-mini"],keyUrl:"https://platform.openai.com/api-keys",keyHint:"Sleutel via platform.openai.com (betaald)",
    async call(key,model,system,user){
      const r=await fetch("https://api.openai.com/v1/chat/completions",{method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+key},body:JSON.stringify({model,temperature:0,max_tokens:3000,response_format:{type:"json_object"},messages:[{role:"system",content:system},{role:"user",content:user}]})});
      if(!r.ok)throw new Error("OpenAI "+r.status+": "+(await r.text()).slice(0,200));
      const d=await r.json();return d.choices?.[0]?.message?.content||"";}},
  anthropic:{label:"Anthropic (Claude)",models:["claude-sonnet-4-6","claude-haiku-4-5-20251001"],keyUrl:"https://console.anthropic.com/settings/keys",keyHint:"Sleutel via console.anthropic.com (betaald)",
    async call(key,model,system,user){
      const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model,max_tokens:3000,system,messages:[{role:"user",content:user},{role:"assistant",content:"{"}]})});
      if(!r.ok)throw new Error("Claude "+r.status+": "+(await r.text()).slice(0,200));
      const d=await r.json();return "{"+(d.content||[]).map(c=>c.text||"").join("");}},
  openrouter:{label:"OpenRouter (veel modellen)",keyUrl:"https://openrouter.ai/keys",keyHint:"Sleutel via openrouter.ai (gratis modellen beschikbaar)",
    fallbackModels:["deepseek/deepseek-chat-v3-0324:free","meta-llama/llama-3.3-70b-instruct:free","openai/gpt-4o-mini"],
    async loadModels(){
      const r=await fetch("https://openrouter.ai/api/v1/models");
      const d=await r.json();
      const free=(d.data||[]).filter(m=>m.id.endsWith(":free")).map(m=>m.id);
      const pref=["deepseek","llama-3.3","gemini","qwen","mistral"];
      free.sort((a,b)=>{const ra=pref.findIndex(x=>a.includes(x)),rb=pref.findIndex(x=>b.includes(x));return (ra<0?99:ra)-(rb<0?99:rb)||a.localeCompare(b);});
      const popular=["openai/gpt-4o-mini","anthropic/claude-3.5-sonnet","google/gemini-2.5-flash"];
      return [...free,...popular];},
    async call(key,model,system,user){
      const r=await fetch("https://openrouter.ai/api/v1/chat/completions",{method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+key},body:JSON.stringify({model,temperature:0,max_tokens:3000,messages:[{role:"system",content:system},{role:"user",content:user}]})});
      if(!r.ok)throw new Error("OpenRouter "+r.status+": "+(await r.text()).slice(0,200));
      const d=await r.json();
      if(d.error)throw new Error("OpenRouter: "+(d.error.message||JSON.stringify(d.error)).slice(0,200));
      return d.choices?.[0]?.message?.content||"";}}
};

const STOP=new Set("de het een en van in op te voor met aan is ik je u hoe wat waar wanneer kan moet mijn uw ben wil naar om dat die er ook als of bij dan zijn heb heeft wordt worden the a to of".split(" "));
const SAMPLES=["Hoe vraag ik een ID-kaart aan vanuit het buitenland?","Wat kost een paspoort vanuit het buitenland?","Wat is een BSN?","Mijn rijbewijs is gestolen in het buitenland, wat nu?","Ik ben mijn DigiD-wachtwoord vergeten","Wat is een apostille?"];
const TOPK=5; // aantal kandidaat-pagina's dat naar het AI-model gaat
let CORPUS=[],PTOKENS=[];

function tokenize(t){return t.toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>2&&!STOP.has(w));}
// Zoek-index per pagina = titel + samenvatting (AI of meta-omschrijving) + url-slug.
function searchText(p){return [p.title,p.summary||p.desc||p.text.slice(0,200),p.url].join(" ");}
function tokensOf(p){return new Set(p.url.split(/[-\/]/).concat(tokenize(searchText(p))).map(s=>s.toLowerCase()));}
function rank(q){const qt=tokenize(q);if(!qt.length)return [];const s=[];for(let i=0;i<CORPUS.length;i++){let o=0;for(const t of qt)if(PTOKENS[i].has(t))o++;if(o)s.push([o,i]);}s.sort((a,b)=>b[0]-a[0]);return s.slice(0,TOPK).map(x=>x[1]);}
function normalize(s){return s.replace(/\s+/g," ").trim().toLowerCase();}

// ---- Semantisch zoeken (embeddings in de browser, zelfde model als de vooraf berekende vectoren) ----
const SEM={ready:false,meta:null,vecs:null,extractor:null,modelPromise:null};
function setSearchStatus(t){const el=document.getElementById("semstatus");if(el)el.textContent=t;}
async function initSemantic(){
  try{
    const [mR,bR]=await Promise.all([fetch("data/embeddings.json"),fetch("data/embeddings.bin")]);
    if(!mR.ok||!bR.ok)throw new Error("geen embeddings");
    SEM.meta=await mR.json();
    SEM.vecs=new Int8Array(await bR.arrayBuffer());
    if(SEM.vecs.length!==SEM.meta.count*SEM.meta.dim)throw new Error("embeddings passen niet bij corpus");
    setSearchStatus("semantisch model laden…");
    SEM.modelPromise=(async()=>{
      const tf=await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1");
      tf.env.allowLocalModels=false;
      SEM.extractor=await tf.pipeline("feature-extraction",SEM.meta.model);
      SEM.ready=true;setSearchStatus("semantisch zoeken ✓");
    })().catch(e=>{SEM.ready=false;setSearchStatus("trefwoord-zoeken (semantisch niet geladen)");});
  }catch(e){SEM.ready=false;setSearchStatus("trefwoord-zoeken");}
}
async function semanticRank(q){
  await SEM.modelPromise;
  if(!SEM.ready)return rank(q);
  const out=await SEM.extractor([SEM.meta.query_prefix+q],{pooling:"mean",normalize:true});
  const qv=out.data,dim=SEM.meta.dim,n=SEM.meta.count,v=SEM.vecs;
  const scored=new Array(n);
  for(let i=0;i<n;i++){let dot=0;const off=i*dim;for(let d=0;d<dim;d++)dot+=qv[d]*v[off+d];scored[i]=[dot,i];}
  scored.sort((a,b)=>b[0]-a[0]);
  return scored.slice(0,TOPK).map(x=>x[1]);
}
async function rankFor(q){
  if(SEM.meta){try{const r=await semanticRank(q);if(r.length)return r;}catch(e){/* val terug op trefwoord */}}
  return rank(q);
}

// Repareer afgekapte JSON: knip terug tot na de laatst afgesloten haak en sluit
// de nog openstaande haken. Afgemaakte citaten blijven zo behouden.
function tryRepairJSON(raw){
  const a=raw.indexOf("{");if(a<0)return null;
  const s=raw.slice(a);
  let inStr=false,esc=false;const stack=[];let cut=-1,cutStack=null;
  for(let i=0;i<s.length;i++){
    const ch=s[i];
    if(inStr){if(esc)esc=false;else if(ch==="\\")esc=true;else if(ch==='"')inStr=false;continue;}
    if(ch==='"'){inStr=true;continue;}
    if(ch==='{')stack.push('}');
    else if(ch==='[')stack.push(']');
    else if(ch==='}'||ch===']'){stack.pop();cut=i+1;cutStack=stack.slice();}
  }
  if(cut<0)return null;
  let fixed=s.slice(0,cut).replace(/,\s*$/,"");
  for(let k=cutStack.length-1;k>=0;k--)fixed+=cutStack[k];
  try{return JSON.parse(fixed);}catch(e){return null;}
}
// Tolerant JSON uitlezen: fences eraf, normaal parsen, anders repareren, anders nette melding.
function parseModelJSON(text){
  let t=(text||"").trim();
  const fence=t.match(/```(?:json)?\s*([\s\S]*?)```/i);
  if(fence)t=fence[1].trim();
  const a=t.indexOf("{");
  if(a<0)throw new Error("Geen JSON in modelantwoord. Ruwe output: "+(text||"").slice(0,150));
  const m=t.slice(a).match(/\{[\s\S]*\}/);
  if(m){try{return JSON.parse(m[0]);}catch(e){/* val door naar reparatie */}}
  const rep=tryRepairJSON(t);
  if(rep){rep.__partial=true;return rep;}
  throw new Error("Het antwoord werd afgebroken (te lang). Probeer de vraag opnieuw te stellen.");
}
// Zoek een (kort) exact fragment in de tekst; bij geen exacte match een witruimte-tolerante poging.
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");}
function findFrom(text,phrase,from){
  if(!phrase)return null;from=from||0;
  let i=text.indexOf(phrase,from);
  if(i>=0)return {i,len:phrase.length};
  const words=phrase.trim().split(/\s+/).map(escRe);
  if(!words.length)return null;
  const m=new RegExp(words.join("\\s+"),"i").exec(text.slice(from));
  return m?{i:from+m.index,len:m[0].length}:null;
}
// Knip op basis van start/end-verwijzing het exacte, aaneengesloten stuk uit de paginatekst.
function extractQuote(text,start,end){
  const s=findFrom(text,(start||"").trim(),0);
  if(!s)return null;
  const ep=(end||"").trim();
  if(ep){const e=findFrom(text,ep,s.i);if(e&&e.i+e.len>s.i){let q=text.slice(s.i,e.i+e.len);return q.length>2000?q.slice(0,2000):q;}}
  const nl=text.indexOf("\n",s.i);
  return text.slice(s.i, nl>s.i?nl:Math.min(text.length,s.i+600)).trim();
}
// Een regel is een kopje/label als hij kort is en niet op een zin-einde eindigt.
function looksLikeHeading(line){
  const t=(line||"").trim();const w=t.split(/\s+/);
  return t.length>0 && w.length<=6 && !/[.!?]$/.test(t);
}
// Te zwak om als citaat te tonen: vrijwel leeg, of een kort kopje/label zonder echte zin.
function isWeakQuote(q){
  const t=(q||"").trim();
  if(t.length<12)return true;        // vrijwel niets
  if(t.includes("\n"))return false;  // meerregelig = inhoud
  return looksLikeHeading(t);        // korte regel zonder zin-einde = kopje/label
}
// Begint het citaat met een los kopje? Voeg dan de eerstvolgende inhoudsregel toe.
function expandHeading(text,quote){
  const t=(quote||"").trim();
  if(t.includes("\n")||!looksLikeHeading(t))return quote;
  // Het kopje moet als HELE regel voorkomen (niet als deel van een woord, bv. "Buitenlandse Zaken").
  const lines=text.split("\n");const li=lines.findIndex(l=>l.trim()===t);
  if(li<0)return quote;
  for(let j=li+1;j<lines.length;j++){
    const c=lines[j].trim();
    if(c.length>=25||/[.!?]$/.test(c)){       // eerste echte inhoudsregel
      let take=c.slice(0,500);const m=take.match(/[.!?](\s|$)/);if(m)take=take.slice(0,m.index+1);
      return t+" "+take.trim();               // letterlijk: kopje gevolgd door de eerste inhoudszin
    }
  }
  return quote;
}
// Sterke overlap tussen twee citaten (de één bevat (vrijwel) de ander).
function quotesOverlap(a,b){
  const x=a.toLowerCase().trim(),y=b.toLowerCase().trim();
  if(x.includes(y)||y.includes(x))return true;
  const sh=x.length<y.length?x:y,lo=x.length<y.length?y:x;
  return sh.length>=40 && lo.includes(sh.slice(0,Math.floor(sh.length*0.8)));
}

const conv=document.getElementById("conv"),provSel=document.getElementById("provider"),modelSel=document.getElementById("model"),keyInput=document.getElementById("apikey"),keyLink=document.getElementById("keylink"),keyStatus=document.getElementById("keystatus"),modeBadge=document.getElementById("mode-badge"),sendBtn=document.getElementById("send");

  modelSel.innerHTML="";

  const saved=localStorage.getItem("model_"+provSel.value);
  modelSel.value=models.includes(saved)?saved:models[0];
  localStorage.setItem("model_"+provSel.value,modelSel.value);
  refreshMode();
}
function loadKey(){keyInput.value=localStorage.getItem("apikey_"+provSel.value)||"";}

provSel.addEventListener("change",()=>{localStorage.setItem("provider",provSel.value);fillModels();loadKey();refreshMode();});
modelSel.addEventListener("change",()=>{localStorage.setItem("model_"+provSel.value,modelSel.value);refreshMode();});
keyInput.addEventListener("input",()=>{localStorage.setItem("apikey_"+provSel.value,keyInput.value);refreshMode();});
fillModels();loadKey();refreshMode();

const CONVO_KEY="vk_convos";
let convos=[];try{convos=JSON.parse(localStorage.getItem(CONVO_KEY)||"[]");}catch(e){convos=[];}
let activeConvo=null;
const convoListEl=document.getElementById("convo-list");
function saveConvos(){try{convos=convos.slice(0,40);localStorage.setItem(CONVO_KEY,JSON.stringify(convos));}catch(e){}}
function convoTitle(q){q=(q||"").trim();return q.length>42?q.slice(0,42)+"…":(q||"Nieuw gesprek");}
function renderConvoList(){
  convoListEl.innerHTML="";
  if(!convos.length){convoListEl.innerHTML='<li class="convo-empty">Nog geen gesprekken.</li>';return;}
  convos.forEach(c=>{
    const li=document.createElement("li");
    li.className="convo-item"+(c.id===activeConvo?" active":"");
    li.innerHTML='<span class="convo-title"></span><button class="convo-del" title="Verwijder gesprek" aria-label="Verwijder gesprek">✕</button>';
    li.querySelector(".convo-title").textContent=c.title;
    li.onclick=(e)=>{if(!e.target.closest(".convo-del"))loadConversation(c.id);};
    li.querySelector(".convo-del").onclick=(e)=>{e.stopPropagation();deleteConversation(c.id);};
    convoListEl.appendChild(li);
  });
}
function showWelcome(){
  document.body.classList.add("is-welcome");
  conv.innerHTML="";
  const p=document.createElement("p");p.className="empty welcome";
  p.innerHTML='<img class="welcome-logo" src="assets/avatar.png" alt="" onerror="this.style.display=\'none\'"><strong>Hoi, ik ben Leo. Ik help bij je werk als voorlichter.</strong> Ik zoek het letterlijke antwoord op de vraag van de burger op NederlandWereldwijd.nl en toon de bron erbij.<span class="hint">Stel een vraag — bijvoorbeeld:</span>';
  conv.appendChild(p);
  const s=document.createElement("div");s.className="samples";s.id="samples";
  SAMPLES.forEach(x=>{const b=document.createElement("button");b.textContent=x;b.onclick=()=>askText(x);s.appendChild(b);});
  conv.appendChild(s);
}
function newConversation(){activeConvo=null;history=[];showWelcome();renderConvoList();closeSidebar();inputEl&&inputEl.focus();}
function ensureConvo(firstQ){
  if(activeConvo&&convos.some(x=>x.id===activeConvo))return;
  const c={id:"c"+Date.now().toString(36),title:convoTitle(firstQ),turns:[],ts:Date.now()};
  convos.unshift(c);activeConvo=c.id;saveConvos();renderConvoList();
}
function recordTurn(q,result){
  ensureConvo(q);
  const c=convos.find(x=>x.id===activeConvo);if(!c)return;
  c.turns.push({q,result});c.ts=Date.now();
  convos=convos.filter(x=>x.id!==c.id);convos.unshift(c);
  saveConvos();renderConvoList();
}
function restoreTurn(q,result){
  const art=document.createElement("article");art.className="turn";
  art.innerHTML='<div class="row user"><div class="bubble vraag"></div></div><div class="row bot"><div class="avatar"><img src="assets/avatar.png" alt="" onerror="this.parentNode.textContent=\'🐶\'"></div><div class="slot"></div></div>';
  art.querySelector(".bubble.vraag").textContent=q;
  conv.appendChild(art);
  try{renderResult(art,result);}catch(e){art.querySelector(".slot").innerHTML='<div class="bubble antwoord"><div class="error">Dit antwoord kon niet worden hersteld.</div></div>';}
}
function loadConversation(id){
  const c=convos.find(x=>x.id===id);if(!c)return;
  activeConvo=id;history=[];
  document.body.classList.remove("is-welcome");
  conv.innerHTML="";
  c.turns.forEach(t=>{
    restoreTurn(t.q,t.result);
    const r=t.result;
    if(r&&r.citations&&r.citations.length)history.push({q:r.restated_question||t.q,summary:(r.citations[0].text||"").slice(0,220)});
  });
  if(history.length>6)history=history.slice(-6);
  renderConvoList();closeSidebar();
  conv.scrollTop=conv.scrollHeight;
}
function deleteConversation(id){
  convos=convos.filter(x=>x.id!==id);saveConvos();
  if(activeConvo===id)newConversation();else renderConvoList();
}

async function condenseQuestion(rawQ){
  if(!history.length)return rawQ;
  const key=keyInput.value.trim();
  if(key.length<=10)return rawQ; // demo-modus: geen herschrijving mogelijk
  const ctx=history.slice(-2).map(h=>`Vraag: ${h.q}\nAntwoord (kort): ${h.summary}`).join("\n\n");
  try{
    const text=await PROVIDERS[provSel.value].call(key,modelSel.value,CONDENSE_SYSTEM,`Gesprek tot nu toe:\n${ctx}\n\nNieuwe vraag: ${rawQ}`);
    const sq=(parseModelJSON(text).standalone_question||"").trim();
    return sq||rawQ;
  }catch(e){return rawQ;}
}

async function runQuestion(rawQ){
  if(sendBtn.disabled||!rawQ)return;
  const turn=addTurn(rawQ);               // toon de vraag zoals gesteld
  const q=await condenseQuestion(rawQ);   // maak er een zelfstandige vraag van (met context)
  const cands=await rankFor(q);
  if(!cands.length){const nores={restated_question:q,citations:[],note:"Geen passende pagina gevonden voor deze vraag.",used:[],related:[]};renderResult(turn,nores);recordTurn(rawQ,nores);return;}
  const key=keyInput.value.trim();
  try{
    const result=key.length>10?await askAI(q,cands,key):demoAnswer(q,cands);
    renderResult(turn,result);
    recordTurn(rawQ,result);
    if(result.citations&&result.citations.length){
      const summary=(result.citations[0].text||"").slice(0,220);
      history.push({q:result.restated_question||q,summary});
      if(history.length>6)history.shift();
    }
  }
  catch(err){turn.querySelector(".slot").innerHTML='<div class="bubble antwoord"><div class="error">Er ging iets mis: '+escapeHtml(err.message)+'</div></div>';}
}
document.getElementById("form").addEventListener("submit",(e)=>{e.preventDefault();const q=inputEl.value.trim();if(!q)return;inputEl.value="";runQuestion(q);});

function srcOf(i){return {title:CORPUS[i].title,url:CORPUS[i].url};}

function demoAnswer(q,cands){
  const p=CORPUS[cands[0]];const paras=p.text.split("\n").filter(x=>x.length>40);
  return {restated_question:q,demo:true,
    citations:[{text:paras.slice(0,2).join("\n"),verified:true,src:srcOf(cands[0]),srcIdx:cands[0]}],
    note:"DEMO-modus: begin van de best-matchende pagina, niet door AI geselecteerd of geciteerd. Vul een sleutel in voor een echte inleiding + letterlijke citaten.",
    used:[srcOf(cands[0])],related:cands.slice(1).map(srcOf)};
}

async function askAI(q,cands,key){
  const listing=cands.map((idx,n)=>`[${n}] TITEL: ${CORPUS[idx].title}\nURL: ${CORPUS[idx].url}\nTEKST:\n${CORPUS[idx].text}`).join("\n\n---\n\n");
  const user=`Vraag van de voorlichter:\n${q}\n\nPagina's:\n${listing}`;
  const text=await PROVIDERS[provSel.value].call(key,modelSel.value,SYSTEM,user);
  const r=parseModelJSON(text);
  const rawCites=Array.isArray(r.citations)?r.citations:[];
  const citations=[];const usedSet=new Set();let notFound=0;
  for(const c of rawCites){
    const local=c.source_index;const gi=Number.isInteger(local)?cands[local]:null;if(gi===null)continue;
    // Knip het exacte stuk zelf uit de pagina o.b.v. de start/end-verwijzing -> altijd letterlijk.
    let quote=extractQuote(CORPUS[gi].text,c.start,c.end);
    if(!quote){notFound++;continue;}
    quote=expandHeading(CORPUS[gi].text,quote);   // los kopje? vul aan met de inhoud eronder
    if(isWeakQuote(quote)){notFound++;continue;}  // nog steeds te kort/kopje -> overslaan
    if(citations.some(x=>quotesOverlap(x.text,quote)))continue; // dubbel/overlappend -> overslaan
    const heading=(c.heading||"").toString().trim().replace(/[:：]\s*$/,"").slice(0,60);
    citations.push({text:quote,verified:true,src:srcOf(gi),srcIdx:gi,heading});usedSet.add(gi);
  }
  const used=[...usedSet].map(srcOf);
  let related=(r.related_indices||[]).map(n=>cands[n]).filter(i=>Number.isInteger(i)&&!usedSet.has(i)).map(srcOf);
  let note=r.note||"";
  let clarifications=(Array.isArray(r.clarifications)?r.clarifications:[]).map(c=>({question:(c.question||"").trim(),prefill:(c.prefill||"").trim()})).filter(c=>c.question);
  let followups=(Array.isArray(r.followups)?r.followups:[]).map(f=>(f||"").trim()).filter(Boolean);
  if(r.__partial&&citations.length)note="Het antwoord was lang en mogelijk niet volledig; de getoonde citaten kloppen wel. Stel de vraag eventueel specifieker.";
  if(!citations.length){
    // Zonder onderbouwend citaat tonen we GEEN vrije AI-tekst (geen note),
    // zodat het model niet alsnog een eigen antwoord verzint.
    if(notFound){
      // Het model wilde wel citeren maar de passage was niet exact terug te vinden:
      // er bestaat waarschijnlijk wél een antwoord -> verwijs naar de bron.
      if(!related.length)related=cands.slice(0,3).map(srcOf);
      note="De passage kon niet exact op de bronpagina worden teruggevonden. Bekijk de bron hieronder.";
    }else{
      // Het model vond niets relevants op de pagina's: alleen 'Geen antwoord gevonden'.
      related=[];clarifications=[];followups=[];note="";
    }
  }
  return {restated_question:r.restated_question||q,citations,used,related,note,clarifications,followups};
}

  conv.appendChild(art);art.scrollIntoView({behavior:"smooth",block:"end"});return art;

function numberedSourceList(items){return `<ol class="srclist">${items.map(s=>`<li><a href="${s.url}" target="_blank" rel="noreferrer">${escapeHtml(s.title)}</a></li>`).join("")}</ol>`;}
const ICON_COPY='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>';

// Kopieer tekst naar het klembord, met korte visuele bevestiging op de knop.
function copyText(t,btn){
  const flash=()=>{if(!btn)return;const o=btn.innerHTML,hadLabel=/span/.test(o);btn.classList.add("ok");btn.innerHTML=ICON_OK+(hadLabel?"<span>Gekopieerd</span>":"");setTimeout(()=>{btn.innerHTML=o;btn.classList.remove("ok");},1400);};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(flash).catch(()=>fallbackCopy(t,flash));
  else fallbackCopy(t,flash);
}
function fallbackCopy(t,cb){const ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand("copy");}catch(e){}document.body.removeChild(ta);cb&&cb();}
// Het hele antwoord als platte tekst (inleiding + citaten met bron) — handig om door te geven aan de burger.
function answerPlainText(r){
  const parts=[];
  let lastH="";
  (r.citations||[]).forEach((c,i)=>{if(i>0&&c.heading&&c.heading!==lastH){parts.push(c.heading.toUpperCase());lastH=c.heading;}parts.push("“"+c.text+"”"+(c.src?` (${c.src.title} — ${c.src.url})`:""));});
  return parts.join("\n\n");
}
// Feedback lokaal opslaan, zodat we later kunnen zien waar de assistent fout zat.
function logFeedback(r,verdict,btn){
  const wrap=btn.parentNode;wrap.querySelectorAll(".fb-btn").forEach(b=>b.classList.remove("sel-up","sel-down"));
  btn.classList.add(verdict>0?"sel-up":"sel-down");
  try{const k="vk_feedback",arr=JSON.parse(localStorage.getItem(k)||"[]");arr.push({q:r.restated_question||"",verdict,hadAnswer:!!(r.citations&&r.citations.length),ts:Date.now()});localStorage.setItem(k,JSON.stringify(arr.slice(-200)));}catch(e){}
}
// Render de tekst van een passage mét structuur: paginakoppen als subkop, de rest als alinea's.
function citeBodyHTML(c){
  const heads=new Set((((CORPUS[c.srcIdx]||{}).headings)||[]).map(h=>h[1]));
  const lines=(c.text||"").split("\n").map(s=>s.trim()).filter(Boolean);
  let html="";
  for(const ln of lines){html+=heads.has(ln)?`<div class="cite-h">${escapeHtml(ln)}</div>`:`<p class="cite-p">${escapeHtml(ln)}</p>`;}
  return html||`<p class="cite-p">${escapeHtml(c.text||"")}</p>`;
}
const ICON_DOC='<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>';
function renderResult(turn,r){
  const badge=r.demo?'<span class="badge demo">DEMO</span>':'<span class="badge ai">AI</span>';
  const hasCites=r.citations&&r.citations.length;
  let h=`<div class="bubble antwoord">`;
  h+=`<div class="restated-sub"><span class="rs-label">Je vraag:</span> ${escapeHtml(r.restated_question)} ${badge}</div>`;
  const num={};(r.used||[]).forEach((s,i)=>{num[s.url]=i+1;});
  if(hasCites){
    let lastHeading="";
    r.citations.forEach((c,i)=>{
      const n=num[c.src.url]||(i+1);
      const live=textFragmentUrl(c.src&&c.src.url,c.text,((CORPUS[c.srcIdx]||{}).headings));
      // Tussenkopje: alleen tonen als de heading verandert (groepeert opeenvolgende citaten).
      if(i>0&&c.heading&&c.heading!==lastHeading){h+=`<h4 class="passage-heading">${escapeHtml(c.heading)}</h4>`;lastHeading=c.heading;}
      h+=`<div class="passage ${c.verified?'verified':'unverified'}" data-ci="${i}">`
        +`<button class="copy-cite" data-ci="${i}" title="Kopieer dit citaat" aria-label="Kopieer dit citaat">${ICON_COPY}</button>`
        +`<div class="cite-body clickable-cite" data-ci="${i}" title="Klik om dit stuk op de bronpagina te bekijken">${citeBodyHTML(c)}</div>`
        +`<div class="src-card" data-ci="${i}" role="button" tabindex="0" title="Bekijk dit stuk op de bronpagina">`
          +`<span class="src-badge">${n}</span>`
          +`<span class="src-info">${ICON_DOC}<span class="src-title">${escapeHtml(c.src?c.src.title:"Bron")}</span></span>`
          +`<span class="src-go">Bekijk op de pagina</span>`
          +`<a class="src-live" href="${live}" target="_blank" rel="noreferrer" title="Open de live pagina met het citaat gemarkeerd" aria-label="Open live pagina">↗</a>`
        +`</div></div>`;
    });
  }else h+=`<div class="no-answer">Geen antwoord gevonden op de website van NederlandWereldwijd.</div>`;
  if(r.note)h+=`<div class="note">${escapeHtml(r.note)}</div>`;
  const clar=r.clarifications||[];
  if(clar.length){
    h+=`<div class="clarify"><span class="label">Voor een preciezer antwoord — vraag na</span>`;
    clar.forEach((c,i)=>{h+=`<button data-prefill="${escapeHtml(c.prefill||c.question)}">${escapeHtml(c.question)}</button>`;});
    h+=`</div>`;
  }
  // Footer: alleen 'misschien ook relevant', vervolgvragen en acties — de gebruikte bron staat al bij elke passage.
  let f="";
  if(r.related&&r.related.length)f+=`<details class="section"><summary><span class="label">Misschien ook relevant</span></summary>${sourceList(r.related)}</details>`;
  const fups=r.followups||[];
  if(fups.length){
    f+=`<div class="followups"><span class="label">Mogelijke vervolgvragen</span><div class="chips">`;
    fups.forEach(fu=>{f+=`<button data-q="${escapeHtml(fu)}">${escapeHtml(fu)}</button>`;});
    f+=`</div></div>`;
  }
  f+=`<div class="answer-actions">`;
  if(hasCites)f+=`<button class="act-btn copy-answer" title="Kopieer het hele antwoord met bron">${ICON_COPY}<span>Kopieer antwoord</span></button>`;
  f+=`<span class="spacer"></span><span class="feedback">Klopt dit?<button class="fb-btn fb-up" title="Ja, bruikbaar" aria-label="Goed antwoord">👍</button><button class="fb-btn fb-down" title="Nee, niet goed" aria-label="Niet goed">👎</button></span></div>`;
  h+=`<div class="answer-footer">${f}</div></div>`;
  const slot=turn.querySelector(".slot");slot.innerHTML=h;
  slot.querySelectorAll(".followups button").forEach(b=>b.onclick=()=>askText(b.getAttribute("data-q")));
  slot.querySelectorAll(".clarify button").forEach(b=>b.onclick=()=>prefill(b.getAttribute("data-prefill")));
  slot.querySelectorAll(".copy-cite").forEach(b=>b.onclick=e=>{e.stopPropagation();copyText(r.citations[+b.getAttribute("data-ci")].text,b);});
  const openCite=el=>{const c=r.citations[+el.getAttribute("data-ci")];if(c)openViewer(c.srcIdx,c.text,c.src&&c.src.url,c.src&&c.src.title);};
  slot.querySelectorAll(".cite-body.clickable-cite, .src-card").forEach(el=>{
    el.onclick=e=>{if(e.target.closest(".copy-cite")||e.target.closest("a"))return;openCite(el);};
    el.onkeydown=e=>{if((e.key==="Enter"||e.key===" ")&&el.classList.contains("src-card")){e.preventDefault();openCite(el);}};
  });
  const ca=slot.querySelector(".copy-answer");if(ca)ca.onclick=()=>copyText(answerPlainText(r),ca);
  const up=slot.querySelector(".fb-up"),dn=slot.querySelector(".fb-down");
  if(up)up.onclick=()=>logFeedback(r,1,up);
  if(dn)dn.onclick=()=>logFeedback(r,-1,dn);
  turn.scrollIntoView({behavior:"smooth",block:"end"});
}
function escapeHtml(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}

/* ---- Bron-viewer: toont de paginatekst met het citaat gearceerd + link naar de live pagina ---- */
const viewerEl=document.getElementById("viewer"),viewerTitle=document.getElementById("viewer-title"),
  viewerOpen=document.getElementById("viewer-open"),viewerBody=document.getElementById("viewer-body"),
  viewerClose=document.getElementById("viewer-close"),viewerBackdrop=document.getElementById("viewer-backdrop");
let viewerLastFocus=null;
// Maak van een zin een whitespace-tolerant patroon (spatie/nieuwe regel maken niet uit).
function rxPhrase(p){return p.trim().replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/\s+/g,"\\s+");}
// Zoek het citaat-bereik [start,eind) in de paginatekst. Valt terug op begin..eind als de hele passage niet 1-op-1 matcht.
function matchRange(fullText,quote){
  let m=null;const q=(quote||"").trim();
  if(q){
    try{m=new RegExp(rxPhrase(q)).exec(fullText);}catch(e){}
    if(!m){
      const w=q.split(/\s+/);
      if(w.length>=8){try{m=new RegExp(rxPhrase(w.slice(0,4).join(" "))+"[\\s\\S]*?"+rxPhrase(w.slice(-4).join(" "))).exec(fullText);}catch(e){}}
    }
  }
  return m?[m.index,m.index+m[0].length]:[-1,-1];
}
// Render de paginatekst regel voor regel: koppen (uit page.headings) krijgen kop-opmaak, het citaat blijft geel gearceerd.
function buildSourceHTML(fullText,quote,headings){
  const [ms,me]=matchRange(fullText,quote);
  const hmap=new Map();(headings||[]).forEach(([lvl,t])=>{if(t&&!hmap.has(t))hmap.set(t,lvl);});
  const lines=fullText.split("\n");
  let off=0,firstMark=true,out="";
  for(const line of lines){
    const ls=off,le=off+line.length;off=le+1; // +1 voor de \n
    // Citaat-deel binnen deze regel markeren (indien aanwezig).
    let content;
    if(me<0||ms>=le||me<=ls){content=escapeHtml(line);}
    else{
      const a=Math.max(ms,ls)-ls,b=Math.min(me,le)-ls;
      const id=firstMark?' id="hl"':'';firstMark=false;
      content=escapeHtml(line.slice(0,a))+'<mark class="hl"'+id+'>'+escapeHtml(line.slice(a,b))+'</mark>'+escapeHtml(line.slice(b));
    }
    const lvl=hmap.get(line);
    out+=lvl?`<div class="vh vh${lvl}">${content}</div>`:`<div class="vp">${content}</div>`;
  }
  return {html:out,found:ms>=0};
}
// Bouw een URL met text-fragment, zodat de browser op de live pagina naar het citaat springt en het markeert.
// Belangrijk: een text-fragment kan niet over een blok-grens (kop -> paragraaf) heen matchen.
// We strippen daarom eventuele kop-regels uit het citaat en gebruiken alleen woorden uit de lopende tekst.
function textFragmentUrl(url,quote,headings){
  if(!url)return "#";
  let q=(quote||"").trim();if(!q)return url;
  const hset=new Set((headings||[]).map(h=>h[1]));
  const lines=q.split(/\n+/).map(s=>s.trim()).filter(s=>s&&!hset.has(s));
  q=(lines.join(" ").replace(/\s+/g," ")||q.replace(/\s+/g," ")).trim();
  const w=q.split(" ");
  const frag=w.length<=10?encodeURIComponent(q):encodeURIComponent(w.slice(0,6).join(" "))+","+encodeURIComponent(w.slice(-6).join(" "));
  return url+"#:~:text="+frag;
}
function openViewer(srcIdx,quote,url,title){
  const page=Number.isInteger(srcIdx)?CORPUS[srcIdx]:null;
  const text=page?page.text:"";
  const built=buildSourceHTML(text,quote,page&&page.headings);
  viewerTitle.textContent=title||(page&&page.title)||"Bronpagina";
  viewerOpen.href=textFragmentUrl(url||(page&&page.url),quote,page&&page.headings);
  viewerBody.innerHTML=(built.found?"":'<div class="viewer-note">Dit citaat kon niet exact op de pagina worden gemarkeerd; hieronder staat de volledige paginatekst.</div>')+built.html;
  viewerLastFocus=document.activeElement;
  document.body.classList.add("viewer-open");viewerEl.setAttribute("aria-hidden","false");viewerBackdrop.hidden=false;
  requestAnimationFrame(()=>{const hl=viewerBody.querySelector("#hl");if(hl)hl.scrollIntoView({block:"center"});else viewerBody.scrollTop=0;});
  viewerClose.focus();
}
function closeViewer(){document.body.classList.remove("viewer-open");viewerEl.setAttribute("aria-hidden","true");viewerBackdrop.hidden=true;if(viewerLastFocus&&viewerLastFocus.focus)viewerLastFocus.focus();}
viewerClose.addEventListener("click",closeViewer);
viewerBackdrop.addEventListener("click",closeViewer);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&document.body.classList.contains("viewer-open"))closeViewer();});
</script>
