// ---- Ambient luistermodus via lokale Vosk (streaming spraakherkenning in de browser) ----
// De audio blijft VOLLEDIG op het apparaat (Vosk-WASM, geen cloud). Terwijl de voorlichter
// met de klant praat, transcribeert Vosk continu; op basis van de laatste woorden verschijnen
// automatisch de best passende quotes. Wisselt het gesprek van onderwerp, dan wisselen de
// quotes mee. Model + library worden self-hosted (werkt achter een firewall, geen CDN nodig).
const LISTEN=(function initListen(){
  const micBtn=document.getElementById("mic");
  const ret={active:false,stop:()=>{}};
  if(!micBtn)return ret;
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.WebAssembly)){micBtn.hidden=true;return ret;}
  micBtn.hidden=false;
  let model=null,modelPromise=null,recognizer=null,stream=null,audioCtx=null,srcNode=null,proc=null;
  let finals=[],partial="",updTimer=null,lastQuery="",panel=null,transcriptEl=null,quotesEl=null,headEl=null,barEl=null;
  // Laadvoortgang, zodat de gebruiker nooit naar een stilstaand scherm kijkt.
  const warm={phase:"idle",pct:0};   // idle -> downloaden -> uitpakken -> klaar
  const onWarm=[];
  // Leesbare omschrijving van de laadfase (ook gebruikt in het paneel).
  function warmText(w){
    if(w.phase==="downloaden")return "Spraakmodel downloaden… "+w.pct+"%";
    if(w.phase==="uitpakken")return "Spraakmodel gereedmaken… ("+(w.pct||0)+"s — dit gebeurt eenmalig)";
    return "";
  }
  function setWarm(phase,pct){warm.phase=phase;warm.pct=(pct!=null)?pct:(phase==="uitpakken"?0:warm.pct);
    micBtn.title=(phase==="downloaden"||phase==="uitpakken")?("Luistermodus — "+warmText(warm)):"Start luistermodus (spraak → automatisch passende antwoorden)";
    onWarm.forEach(f=>{try{f(warm);}catch(e){}});}

  function ensureLib(){return new Promise((res,rej)=>{if(window.Vosk)return res();const s=document.createElement("script");s.src="vendor/vosk.js";s.onload=()=>res();s.onerror=()=>rej(new Error("kon vendor/vosk.js niet laden"));document.head.appendChild(s);});}
  // Haalt het modelbestand ÉÉN keer op (met voortgang) en geeft het als blob-URL door aan
  // Vosk. Zonder dit haalt de Vosk-worker het bestand nóg een keer op — dat maakte de fase
  // "gereedmaken" onnodig lang.
  async function fetchModelBlobUrl(){
    const r=await fetch("data/vosk-model-nl.tar.gz");
    if(!r.ok)throw new Error("model niet gevonden ("+r.status+")");
    const total=+(r.headers.get("content-length")||0);
    if(!r.body||!total){const b=await r.blob();return URL.createObjectURL(b);}
    const reader=r.body.getReader(),parts=[];let got=0;
    for(;;){const {done,value}=await reader.read();if(done)break;parts.push(value);got+=value.length;
      setWarm("downloaden",Math.min(99,Math.round(got/total*100)));}
    return URL.createObjectURL(new Blob(parts,{type:"application/gzip"}));
  }
  async function loadModel(){
    if(model)return model;
    if(!modelPromise)modelPromise=(async()=>{
      await ensureLib();
      setWarm("downloaden",0);
      const url=await fetchModelBlobUrl();
      setWarm("uitpakken");
      // Tikker, zodat zichtbaar is dat er nog gewerkt wordt (er is geen voortgang beschikbaar).
      const t0=Date.now();const tick=setInterval(()=>{if(warm.phase==="uitpakken")setWarm("uitpakken",Math.round((Date.now()-t0)/1000));},1000);
      try{model=await window.Vosk.createModel(url);}
      finally{clearInterval(tick);URL.revokeObjectURL(url);}
      setWarm("klaar",100);
      return model;
    })();
    return modelPromise;
  }
  // Vooraf laden zodra de pagina rustig is: dan is de luistermodus meteen bruikbaar.
  ret.warm=warm;ret.onWarm=f=>onWarm.push(f);
  const kickoff=()=>{loadModel().catch(()=>{});};
  if("requestIdleCallback" in window)requestIdleCallback(kickoff,{timeout:8000});else setTimeout(kickoff,4000);

  function setActive(on){ret.active=on;micBtn.classList.toggle("rec",on);micBtn.title=on?"Stop luistermodus":"Start luistermodus (spraak → automatisch passende antwoorden)";micBtn.setAttribute("aria-label",on?"Luistermodus stoppen":"Luistermodus starten");}
  // Beste alinea van een pagina t.o.v. de gesproken woorden (voor de getoonde quote).
  // full=true (hoofdantwoord): de VOLLEDIGE alinea; anders een compacte weergave.
  function bestSnippet(idx,qtok,full){
    const max=full?900:320;
    const lines=proseLines(idx);
    if(!lines.length)return (CORPUS[idx].desc||CORPUS[idx].text||"").slice(0,max);
    let best=lines[0],bestSc=-1;
    for(const ln of lines){const t=new Set(tokenize(ln));let sc=0;for(const q of qtok)if(t.has(q))sc++;if(sc>bestSc){bestSc=sc;best=ln;}}
    return best.length>max?best.slice(0,max)+"…":best;
  }
  function recentFinals(){const cut=Date.now()-15000;return finals.filter(f=>f.t>=cut).map(f=>f.text);}   // laatste ~15 s
  function renderTranscript(){
    if(!transcriptEl)return;
    transcriptEl.hidden=!SHOWTXT;
    if(!SHOWTXT){transcriptEl.innerHTML="";return;}
    transcriptEl.innerHTML=`<span class="lt-final">${escapeHtml(recentFinals().slice(-3).join(" "))}</span> <span class="lt-partial">${escapeHtml(partial)}</span>`;
  }
  // ---- Afkortingen herstellen ----
  // Vosk schrijft gespelde afkortingen uit elkaar ("i en de" / "vee ef es"). We voegen zulke
  // letterreeksen weer samen, maar ALLEEN als het resultaat een bekende afkorting is — anders
  // zouden gewone woorden als "en", "er" en "de" gewone zinnen kapotmaken.
  // Lijst afgeleid uit het corpus (hoofdletterwoorden van 2-6 letters op >=3 pagina's).
  const ABBR=new Set("ind vfs brp svb aow rni abp eer hcch duo mvv bsn rdw uwv cak wia cbr wao waz vog anw ww vbn kns sar cdc dbb eva".split(" "));
  const LETTER={a:"a",aa:"a",be:"b",bee:"b",ce:"c",cee:"c",see:"c",de:"d",dee:"d",e:"e",ee:"e",ef:"f",eff:"f",ge:"g",gee:"g",ha:"h",haa:"h",i:"i",ie:"i",j:"j",je:"j",jee:"j",ka:"k",kaa:"k",el:"l",l:"l",em:"m",m:"m",en:"n",n:"n",o:"o",oo:"o",pe:"p",pee:"p",ku:"q",kuu:"q",er:"r",r:"r",es:"s",s:"s",te:"t",tee:"t",u:"u",uu:"u",ve:"v",vee:"v",we:"w",wee:"w",iks:"x",ei:"y",ij:"y",zet:"z",z:"z",b:"b",c:"c",d:"d",f:"f",g:"g",h:"h",k:"k",p:"p",q:"q",t:"t",v:"v",w:"w",x:"x",y:"y"};
  function expandAbbrev(text){
    const w=(text||"").split(/\s+/).filter(Boolean);
    const out=[];let i=0;
    while(i<w.length){
      // hoe lang is de reeks woorden die als losse letters te lezen zijn?
      let run=0;while(i+run<w.length&&LETTER[w[i+run].toLowerCase().replace(/[^a-zà-ÿ]/g,"")])run++;
      let matched=false;
      if(run>=2){
        for(let len=Math.min(run,6);len>=2&&!matched;len--){
          const cand=w.slice(i,i+len).map(x=>LETTER[x.toLowerCase().replace(/[^a-zà-ÿ]/g,"")]).join("");
          if(ABBR.has(cand)){out.push(cand);i+=len;matched=true;}
        }
      }
      if(!matched){out.push(w[i]);i++;}
    }
    return out.join(" ");
  }
  // Zoekopdracht: de LOPENDE zin is leidend — dat is waar het gesprek nú over gaat. Alleen
  // als die nog te weinig inhoud heeft, vullen we aan met de vorige zin(nen). Zo wisselt het
  // onderwerp meteen mee ("…paspoort…" -> "…reisadvies Spanje…") zonder dat oude woorden
  // blijven meewegen.
  function currentQuery(){
    const live=partial.trim();
    let q,cap=14;
    if(MODE==="een"||MODE==="verzoek"){
      // Alles sinds de start / sinds de vorige klik telt mee.
      q=(finalsSince(ctxStart).join(" ")+" "+live).trim();cap=60;
    }else if(MODE==="rustig"){
      // Alleen het venster van de laatste 10 seconden.
      q=(finalsSince(Math.max(ctxStart,Date.now()-WINDOW_MS)).join(" ")+" "+live).trim();cap=30;
    }else{
      // Standaard: de lopende zin is leidend, aangevuld als die te kort is.
      const recent=recentFinals();q=live;
      if(tokenize(q).length<2&&recent.length)q=(recent[recent.length-1]+" "+live).trim();
      if(tokenize(q).length<2&&recent.length>1)q=(recent.slice(-2).join(" ")+" "+live).trim();
    }
    return expandAbbrev((q.match(/\S+/g)||[]).slice(-cap).join(" "));
  }
  // Ranking speciaal voor de luistermodus. Bovenop de gewone hybride fusie (semantisch +
  // trefwoord) twee correcties die het getypte pad al had, maar de live-laag miste:
  //  1) ONDERWERP-BOOST: staat een woord uit de vraag in het URL-pad ("paspoort", "digid"),
  //     dan telt die pagina zwaarder — voorkomt dat een visumpagina bovenaan komt bij een
  //     paspoortvraag.
  //  2) DEMOTIE van situatie-specifieke pagina's ("voor uw kind", "voor het eerst",
  //     "kwijt/gestolen") zolang de vraag daar niet om vraagt.
  // Gemeten op typische spraakvragen: juiste pagina bovenaan 7/9 -> 8/9, in de top 3 8/9 -> 9/9.
  const URLTOK=[];
  function urlTokens(i){if(!URLTOK[i])URLTOK[i]=new Set(tokenize((CORPUS[i].url||"").split("/").slice(3).join(" ")));return URLTOK[i];}
  async function liveRank(q,limit){
    const K=12;
    let sem=[];
    if(SEM&&SEM.ready){try{sem=await semanticRank(q,K);}catch(e){}}
    const kw=rank(q,K);
    if(!sem.length&&!kw.length)return [];
    const qtok=[...new Set(tokenize(q))],score=new Map();
    const add=(l,w)=>l.forEach((idx,r)=>score.set(idx,(score.get(idx)||0)+w/(RRF_K+r)));
    add(sem,W_SEM);add(kw,W_KW);
    const wantsSpecific=SPECIFIC_RX.test(q);
    for(const idx of [...score.keys()]){
      let v=score.get(idx),hits=0;const ut=urlTokens(idx);
      for(const t of qtok)if(ut.has(t))hits++;
      if(hits)v*=1+0.35*hits;
      if(!wantsSpecific&&isSpecificPage(idx))v*=0.5;
      score.set(idx,v);
    }
    const fused=[...score.entries()].sort((a,b)=>b[1]-a[1]).map(e=>e[0]);
    return forceProduct(q,applyScope(q,fused)).slice(0,limit);
  }
  // ---- Antwoordmodus (instelbaar, zodat elke werkwijze los te testen is) ----
  // 1 standaard : verspringt continu mee (oorspronkelijke werking)
  // 2 een       : één antwoord; alle context sinds de start telt mee, 'Nieuwe vraag' reset
  // 3 verzoek   : scherm blijft stil; pas bij 'Geef antwoord' wordt er gezocht
  // 4 rustig    : hoogstens elke 10 s bijwerken, en alleen als het onderwerp echt wijzigt
  const MODES=["standaard","een","verzoek","rustig"];
  let MODE="standaard";
  try{const m=localStorage.getItem("vk_listen_mode");if(MODES.includes(m))MODE=m;}catch(e){}
  const saveMode=()=>{try{localStorage.setItem("vk_listen_mode",MODE);}catch(e){}};
  ret.mode=()=>MODE;
  let ctxStart=0;          // vanaf wanneer context meetelt (modus 2 en 3)
  let locked=false;        // modus 2: antwoord staat vast tot "Nieuwe vraag"
  let shown=null;          // {list,tok,heroSnip,at} — wat er nu op het scherm staat
  let winTimer=null,winTick=null,winAt=0;   // modus 4: venster van 10 s
  let eenTick=null;                         // modus 2: aftellen naar het antwoord
  const WINDOW_MS=10000, EEN_DELAY_MS=15000;
  // Optionele AI: vat de vraag samen uit het gesprek en kiest daar het antwoord bij.
  let AIQ=false;
  try{AIQ=localStorage.getItem("vk_listen_aiq")==="1";}catch(e){}
  const saveAIQ=()=>{try{localStorage.setItem("vk_listen_aiq",AIQ?"1":"0");}catch(e){}};
  // Meelopende gesprekstekst: handig om te zien of de spraakherkenning je goed verstaat,
  // maar ook een bewegend element naast het antwoord. Standaard aan, uit te zetten.
  let SHOWTXT=true;
  try{SHOWTXT=localStorage.getItem("vk_listen_txt")!=="0";}catch(e){}
  const saveTxt=()=>{try{localStorage.setItem("vk_listen_txt",SHOWTXT?"1":"0");}catch(e){}};
  const aiCache=new Map();let aiSeq=0,aiVraag="";
  function resetContext(){ctxStart=Date.now();lastQuery="";}
  function finalsSince(t){return finals.filter(f=>f.t>=t).map(f=>f.text);}

  // Tekent de kaarten. heroSnip: eventueel door AI gekozen passage (anders de heuristiek).
  // ---- Optioneel: AI vat de vraag samen en kiest de passende pagina ----
  // Non-blocking: het lokale antwoord staat er al; de AI werkt het daarna stil bij.
  // Vraagt de AI om de volgorde; geeft de nieuwe lijst terug (of null als er niets te doen is).
  async function aiOrder(q,cands){
    const key=keyInput.value.trim();
    if(!AIQ||key.length<=10||!cands.length)return null;
    let j=aiCache.get(q);
    if(j===undefined){
      const listing=cands.map((idx,n)=>"["+n+"] "+cleanTitle(CORPUS[idx].title)).join("\n");
      try{
        const text=await PROVIDERS[provSel.value].call(key,modelSel.value,LISTEN_Q_SYSTEM,
          "Gespreksfragment:\n"+q+"\n\nKandidaat-pagina's:\n"+listing);
        j=parseModelJSON(text);
        aiCache.set(q,j);if(aiCache.size>60)aiCache.delete(aiCache.keys().next().value);
      }catch(e){console.warn("AI-vraagherkenning:",e);return null;}
    }
    if(!j)return null;
    const pick=(Array.isArray(j.pages)?j.pages:[]).map(n=>cands[n]).filter(i=>Number.isInteger(i));
    const list=pick.length?[...new Set(pick)].concat(cands.filter(i=>!pick.includes(i))).slice(0,3):cands;
    // Dezelfde harde regel als bij het typen: een genoemde vakterm blijft bovenaan staan.
    return {list:forceProduct(q,list),vraag:(j.vraag||"").toString().trim().slice(0,140)};
  }
  // Live-modi (1 en 4): het lokale antwoord staat er al; de AI werkt het daarna stil bij.
  async function aiPick(q,cands){
    const seq=++aiSeq;
    const r=await aiOrder(q,cands);
    if(!r||seq!==aiSeq||!ret.active||!quotesEl)return;
    aiVraag=r.vraag;
    shown={list:r.list,tok:shown?shown.tok:[...new Set(tokenize(q))],at:Date.now(),stable:shown&&shown.stable};
    renderQuotes(r.list,shown.tok);renderModeBar();
  }
  // Modus 2: pas na EEN_DELAY_MS luisteren het (enige) antwoord bepalen en vastzetten.
  async function maybeAnswerEen(){
    if(MODE!=="een"||locked||!ret.active)return renderModeBar();
    if(Date.now()-ctxStart<EEN_DELAY_MS)return renderModeBar();
    const q=currentQuery();
    if(!tokenize(q).length)return renderModeBar();      // nog niets gehoord -> blijf wachten
    const res=await search(q);
    if(!ret.active)return;
    if(!res)return renderModeBar();
    locked=true;                                          // niet nogmaals proberen tijdens het wachten
    const seq=++aiSeq;
    const r=await aiOrder(q,res.list);                    // ook hier: één keer tekenen, geen sprong
    if(seq!==aiSeq||!ret.active||MODE!=="een")return;
    const list=r?r.list:res.list;
    aiVraag=r?r.vraag:"";
    shown={list,tok:res.tok,at:Date.now()};
    renderQuotes(list,res.tok);renderModeBar();
  }
  function renderQuotes(cands,qtok,opts){
    if(!quotesEl)return;
    opts=opts||{};
    const card=(idx,cls,inner)=>`<button class="${cls}" data-idx="${idx}" data-snip="${escapeHtml(inner.snip)}">${inner.html}</button>`;
    const top=cands[0],rest=(MODE==="een")?[]:cands.slice(1);   // modus 2: bewust één antwoord
    const topSnip=opts.heroSnip||bestSnippet(top,qtok,true);
    const label=(MODE==="een"||MODE==="verzoek")?"✓ Antwoord":"✓ Meest waarschijnlijke antwoord";
    let html=card(top,"listen-hero",{snip:topSnip,html:
      `<span class="lh-label">${label}</span>`
      +`<span class="lh-quote">“${escapeHtml(topSnip)}”</span>`
      +`<span class="lh-src">${ICON_DOC}<span>${escapeHtml(cleanTitle(CORPUS[top].title))}</span><span class="lh-go">— lees verder op de pagina →</span></span>`});
    if(rest.length){
      html+=`<div class="listen-alts-label">Andere mogelijke antwoorden</div>`;
      html+=rest.map(idx=>{const snip=bestSnippet(idx,qtok);return card(idx,"listen-card",{snip,html:
        `<span class="lc-quote">“${escapeHtml(snip)}”</span><span class="lc-src">${ICON_DOC}<span>${escapeHtml(cleanTitle(CORPUS[idx].title))}</span></span>`});}).join("");
    }

    quotesEl.querySelectorAll(".listen-hero,.listen-card").forEach(btn=>btn.onclick=()=>{const i=+btn.getAttribute("data-idx");openViewer(i,btn.getAttribute("data-snip"),CORPUS[i].url,cleanTitle(CORPUS[i].title));});
  }
  // Zoekt en toont; retourneert de gevonden lijst (of null).
  async function search(q){
    const qtok=[...new Set(tokenize(q))];
    if(qtok.length<1)return null;
    let cands=[];
    try{cands=await liveRank(q,3);}catch(e){try{cands=applyScope(q,rank(q,12)).slice(0,3);}catch(_){}}
    return cands.length?{list:cands,tok:qtok}:null;
  }
  const hint=t=>{if(quotesEl)quotesEl.innerHTML='<div class="listen-hint">'+escapeHtml(t)+'</div>';};
  async function updateQuotes(settled){
    // Modus 3: het getoonde antwoord blijft ongemoeid staan tot de volgende klik.
    if(MODE==="verzoek"){renderModeBar();return;}
    // Modus 2: de 15-secondenteller bepaalt wanneer het (enige) antwoord komt.
    if(MODE==="een"){renderModeBar();return;}
    // Modus 4: tussentijds NIET verspringen — het 10-secondenvenster bepaalt wanneer.
    // Alleen het allereerste antwoord komt meteen, anders staar je 10 s naar een leeg scherm.
    if(MODE==="rustig"){if(!shown)return windowCheck();renderModeBar();return;}
    const q=currentQuery();
    if(!tokenize(q).length){hint("Luisteren… stel een vraag aan de klant; passende antwoorden verschijnen hier vanzelf.");lastQuery="";renderModeBar();return;}
    const key=[...new Set(tokenize(q))].join(" ");
    if(key===lastQuery){renderModeBar();return;}
    lastQuery=key;
    const res=await search(q);
    if(!ret.active||!quotesEl)return;
    if(!res){hint("Nog geen passende informatie gevonden…");renderModeBar();return;}
    shown={list:res.list,tok:res.tok,at:Date.now()};
    renderQuotes(res.list,res.tok);
    renderModeBar();
    if(settled)aiPick(q,res.list);
  }
  // Modus 4: elke 10 s beoordelen of het onderwerp echt veranderd is.
  // "Ongewijzigd" wordt op twee manieren vastgesteld, zodat het antwoord rustig blijft staan:
  //  a) de INHOUD van het nieuwe venster lijkt sterk op het vorige (woordoverlap), of
  //  b) de nieuwe beste pagina staat al in het getoonde antwoord.
  let lastWinTok=null;
  async function windowCheck(){
    if(!ret.active||MODE!=="rustig")return;
    winAt=Date.now();
    const q=currentQuery(),tok=new Set(tokenize(q));
    if(!tok.size){renderModeBar();return;}                    // niets gezegd -> laten staan
    if(shown&&lastWinTok&&lastWinTok.size){
      let inter=0;for(const t of tok)if(lastWinTok.has(t))inter++;
      const uni=new Set([...tok,...lastWinTok]).size;
      if(uni&&inter/uni>=0.4){shown.stable=true;lastWinTok=tok;renderModeBar();return;}
    }
    const res=await search(q);
    if(!ret.active||!res)return renderModeBar();
    if(shown&&shown.list.includes(res.list[0])){shown.stable=true;lastWinTok=tok;renderModeBar();return;}
    shown={list:res.list,tok:res.tok,at:Date.now(),stable:false};lastWinTok=tok;
    renderQuotes(res.list,res.tok);renderModeBar();aiPick(q,res.list);
  }
  // Modus 3: nu pas zoeken, op basis van alles sinds de vorige klik.
  // Eén klik = één antwoord: staat de AI aan, dan wachten we die eerst af en tekenen we daarna
  // één keer. Anders zag je eerst het lokale antwoord en verspringt het scherm een seconde later.
  async function answerNow(){
    const q=currentQuery();
    if(!tokenize(q).length){hint("Nog niets gehoord om op te zoeken.");renderModeBar();return;}
    const res=await search(q);
    if(!res){hint("Nog geen passende informatie gevonden…");renderModeBar();return;}
    const seq=++aiSeq;
    if(AIQ&&keyInput.value.trim().length>10){hint("Zoekt het beste antwoord…");renderModeBar();}
    const r=await aiOrder(q,res.list);
    if(seq!==aiSeq||!ret.active)return;                   // er is intussen opnieuw geklikt
    const list=r?r.list:res.list;
    aiVraag=r?r.vraag:"";
    shown={list,tok:res.tok,at:Date.now()};
    resetContext();
    renderQuotes(list,res.tok);renderModeBar();
  }
  // ---- Statusbalk per modus ----
  function renderModeBar(){
    if(!barEl)return;
    if(MODE==="standaard"){
      barEl.innerHTML='<span class="pill">⚡ Live</span><span class="lb-info">Het antwoord volgt het gesprek automatisch.</span>';
    }else if(MODE==="een"){
      const n=finalsSince(ctxStart).length,secs=Math.round((Date.now()-ctxStart)/1000);
      const wait=Math.max(0,Math.ceil((EEN_DELAY_MS-(Date.now()-ctxStart))/1000));
      barEl.innerHTML='<span class="pill'+(locked?" groen":"")+'">'+(locked?"🔒 Antwoord vastgezet":("🎧 Luistert… antwoord over "+wait+" s"))+' · '+n+' zin'+(n===1?"":"nen")+'</span>'
        +'<span class="lb-info">'+(locked?"Het antwoord blijft staan. Klik “Nieuwe vraag” voor een volgende vraag.":"Eerst 15 seconden luisteren; alles wat gezegd wordt telt mee in één antwoord.")+'</span>'
        +'<button type="button" class="lb-btn'+(locked?" primary":"")+'" data-act="nieuw">↺ Nieuwe vraag</button>';
    }else if(MODE==="verzoek"){
      const n=finalsSince(ctxStart).length;
      barEl.innerHTML='<span class="pill">👂 '+n+' nieuwe zin'+(n===1?"":"nen")+' sinds vorige antwoord</span>'
        +'<span class="lb-info">Klik voor een antwoord op alles sinds uw vorige klik.</span>'
        +'<button type="button" class="lb-btn primary" data-act="antwoord">Geef antwoord</button>';
    }else{
      const left=Math.max(0,WINDOW_MS-(Date.now()-winAt)),pct=100-Math.round(left/WINDOW_MS*100);
      barEl.innerHTML='<span class="lb-bar"><i style="width:'+pct+'%"></i></span>'
        +'<span class="lb-info">Volgende controle over '+Math.ceil(left/1000)+' s…</span>'
        +((shown&&shown.stable)?'<span class="pill groen">✓ Onderwerp ongewijzigd — antwoord blijft staan</span>':'');
    }
    if(AIQ&&aiVraag)barEl.innerHTML+='<span class="lb-vraag">✨ AI begreep: “'+escapeHtml(aiVraag)+'”</span>';
    barEl.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{
      const a=b.getAttribute("data-act");
      if(a==="nieuw"){resetContext();shown=null;locked=false;aiVraag="";hint("Nieuwe vraag — luisteren…");renderModeBar();}
      if(a==="antwoord")answerNow();
    });
  }
  // Wisselen van modus tijdens het luisteren.
  function setMode(m){
    if(!MODES.includes(m))return;
    MODE=m;saveMode();finals=[];partial="";resetContext();shown=null;locked=false;aiVraag="";renderTranscript();
    if(winTimer){clearInterval(winTimer);winTimer=null;}
    if(winTick){clearInterval(winTick);winTick=null;}
    if(eenTick){clearInterval(eenTick);eenTick=null;}
    if(quotesEl)hint(MODE==="verzoek"?"Luistert mee — klik op “Geef antwoord” wanneer u een antwoord wilt."
      :MODE==="een"?"Luistert 15 seconden mee en geeft daarna één antwoord…":"Luisteren…");
    if(ret.active&&MODE==="rustig"){winAt=Date.now();winTimer=setInterval(windowCheck,WINDOW_MS);winTick=setInterval(renderModeBar,1000);}
    if(ret.active&&MODE==="een")eenTick=setInterval(maybeAnswerEen,1000);
    renderModeBar();
    if(ret.active&&(MODE==="standaard"||MODE==="een"))scheduleUpdate(true);
  }
  ret.setMode=setMode;
  // Throttle i.p.v. debounce: de eerste woorden leveren METEEN resultaat, daarna werken de
  // quotes elke ~600 ms bij terwijl er doorgepraat wordt (een debounce wachtte op stilte).
  let lastRun=0;
  function scheduleUpdate(now){
    const gap=600,since=Date.now()-lastRun;
    if(now||since>=gap){if(updTimer){clearTimeout(updTimer);updTimer=null;}lastRun=Date.now();if(ret.active)updateQuotes(!!now);return;}
    if(updTimer)return;                                  // er staat al een update klaar
    updTimer=setTimeout(()=>{updTimer=null;lastRun=Date.now();if(ret.active)updateQuotes(false);},gap-since);
  }

  function buildPanel(){

    panel=document.createElement("div");panel.className="listen";
    const warmMsg=warmText(warm)||"Spraakmodel laden…";
    const hasKey=keyInput.value.trim().length>10;
    const MODEINFO=[["standaard","1. Standaard","Antwoord verspringt continu mee met het gesprek."],
      ["een","2. Eén antwoord per vraag","Alles wat sinds de start gezegd is telt mee. Met “Nieuwe vraag” begint u opnieuw."],
      ["verzoek","3. Antwoord op verzoek","Luistert mee, maar toont pas een antwoord als u op “Geef antwoord” klikt."],
      ["rustig","4. Rustig (10-seconden vensters)","Werkt automatisch bij, maar hoogstens elke 10 seconden — en alleen als het onderwerp wijzigt."]];
    const radios=MODEINFO.map(([k,t,h])=>`<label class="lai-opt"><input type="radio" name="lmode" value="${k}"${MODE===k?" checked":""}><span><b>${t}</b> <span class="lai-hint">${h}</span></span></label>`).join("");
    panel.innerHTML=`<div class="listen-head"><span class="listen-badge">🎧 Luistermodus</span> <span class="listen-msg">${warm.phase==="klaar"?"Starten…":escapeHtml(warmMsg)}</span><button type="button" class="listen-stop">Stop luistermodus</button></div>
      <details class="listen-ai">
        <summary>⚙︎ Manier van antwoorden</summary>
        <div class="lai-body">${radios}
          <label class="lai-opt lai-ai"><input type="checkbox" id="lai-q"${AIQ?" checked":""}${hasKey?"":" disabled"}><span><b>AI-vraagherkenning</b> <span class="lai-hint">AI vat uit het gesprek samen wat de klant vraagt en kiest daar het passende antwoord bij.${hasKey?"":" (vul eerst een AI-sleutel in)"}</span></span></label>
          <label class="lai-opt"><input type="checkbox" id="lai-txt"${SHOWTXT?" checked":""}><span><b>Gesprekstekst tonen</b> <span class="lai-hint">Laat zien wat er verstaan wordt. Uitzetten geeft rust op het scherm; het luisteren en zoeken gaat gewoon door.</span></span></label>
          <p class="lai-warn">⚠︎ Met AI-vraagherkenning wordt de uitgeschreven gesprekstekst naar de AI-provider gestuurd. Staat hij uit, dan blijft alles op dit apparaat.</p>
        </div>
      </details>
      <div class="listen-bar" id="listen-bar"></div>
      <div class="listen-transcript" aria-live="polite"></div>
      <div class="listen-quotes"><div class="listen-hint">${warm.phase==="klaar"?"Luisteren…":"Het spraakmodel wordt eenmalig geladen (daarna direct beschikbaar)…"}</div></div>`;
    conv.appendChild(panel);
    headEl=panel.querySelector(".listen-msg");transcriptEl=panel.querySelector(".listen-transcript");quotesEl=panel.querySelector(".listen-quotes");barEl=panel.querySelector(".listen-bar");
    panel.querySelector(".listen-stop").onclick=()=>stop(true);
    panel.querySelectorAll('input[name="lmode"]').forEach(r=>r.onchange=()=>{if(r.checked)setMode(r.value);});
    const aiq=panel.querySelector("#lai-q");if(aiq)aiq.onchange=()=>{AIQ=aiq.checked;saveAIQ();aiVraag="";aiCache.clear();renderModeBar();};
    const txt=panel.querySelector("#lai-txt");if(txt)txt.onchange=()=>{SHOWTXT=txt.checked;saveTxt();renderTranscript();};
    renderTranscript();

  }
  function teardownAudio(){try{if(proc)proc.disconnect();if(srcNode)srcNode.disconnect();if(audioCtx)audioCtx.close();}catch(e){}try{if(stream)stream.getTracks().forEach(t=>t.stop());}catch(e){}proc=srcNode=audioCtx=stream=null;}
  function stop(restore){
    if(!ret.active&&!stream)return;
    if(updTimer){clearTimeout(updTimer);updTimer=null;}
    if(winTimer){clearInterval(winTimer);winTimer=null;}
    if(winTick){clearInterval(winTick);winTick=null;}
    if(eenTick){clearInterval(eenTick);eenTick=null;}
    setActive(false);teardownAudio();
    try{if(recognizer)recognizer.remove();}catch(e){}recognizer=null;
    finals=[];partial="";lastQuery="";shown=null;
    if(panel&&panel.parentNode)panel.parentNode.removeChild(panel);panel=null;transcriptEl=quotesEl=headEl=barEl=null;
    if(restore)showWelcome();
  }
  ret.stop=stop;

  micBtn.addEventListener("click",async()=>{
    if(ret.active){stop(true);return;}
    // Microfoontoegang
    // Vosk-modellen zijn op 16 kHz MONO getraind; vraag de microfoon daar expliciet om
    // (met ruisonderdrukking) — anders levert het model wel Nederlandse woorden, maar de
    // verkeerde. Lukt de constraint niet, dan valt de browser terug op de standaardinstelling.
    const micWish={channelCount:1,sampleRate:16000,echoCancellation:true,noiseSuppression:true,autoGainControl:true};
    try{stream=await navigator.mediaDevices.getUserMedia({audio:micWish});}
    catch(e){try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}
      catch(e2){alert("Microfoontoegang geweigerd. Klik op het slotje links van de URL en sta microfoon toe.");return;}}
    setActive(true);buildPanel();
    // Live voortgang tonen zolang het model nog laadt.
    onWarm.push(w=>{if(headEl&&w.phase!=="klaar")headEl.textContent=warmText(w);});
    try{await loadModel();}catch(e){if(headEl)headEl.textContent="Kon het spraakmodel niet laden: "+(e.message||e);teardownAudio();setActive(false);return;}
    if(!ret.active){teardownAudio();return;}   // ondertussen gestopt
    try{
      // AudioContext óók op 16 kHz: dan zijn de buffers die Vosk krijgt exact wat het model
      // verwacht (geen resampling-mismatch, die eerder onzinherkenning veroorzaakte).
      try{audioCtx=new (window.AudioContext||window.webkitAudioContext)({sampleRate:16000});}
      catch(e){audioCtx=new (window.AudioContext||window.webkitAudioContext)();}
      if(audioCtx.state==="suspended")await audioCtx.resume();
      recognizer=new model.KaldiRecognizer(audioCtx.sampleRate);
      recognizer.on("partialresult",m=>{partial=(m.result&&m.result.partial)||"";renderTranscript();scheduleUpdate(false);});
      // Afgeronde zin = natuurlijk moment: meteen bijwerken (niet wachten op de throttle).
      recognizer.on("result",m=>{const t=((m.result&&m.result.text)||"").trim();if(t){finals.push({t:Date.now(),text:t});if(finals.length>12)finals=finals.slice(-12);}partial="";renderTranscript();scheduleUpdate(true);});
      srcNode=audioCtx.createMediaStreamSource(stream);
      proc=audioCtx.createScriptProcessor(4096,1,1);
      const sink=audioCtx.createGain();sink.gain.value=0;
      proc.onaudioprocess=e=>{if(ret.active&&recognizer){try{recognizer.acceptWaveform(e.inputBuffer);}catch(err){}}};
      srcNode.connect(proc);proc.connect(sink);sink.connect(audioCtx.destination);
    }catch(e){if(headEl)headEl.textContent="Kon de microfoon niet openen: "+(e.message||e);teardownAudio();setActive(false);return;}
    if(headEl)headEl.textContent="Praat met de klant — passende antwoorden verschijnen automatisch en volgen het gesprek.";
    resetContext();winAt=Date.now();
    if(MODE==="rustig"){winTimer=setInterval(windowCheck,WINDOW_MS);winTick=setInterval(renderModeBar,1000);}
    if(MODE==="een"){eenTick=setInterval(maybeAnswerEen,1000);hint("Luistert 15 seconden mee en geeft daarna één antwoord…");}
    if(MODE==="verzoek")hint("Luistert mee — klik op “Geef antwoord” wanneer u een antwoord wilt.");
    renderModeBar();
    if(MODE==="standaard")updateQuotes(true);
  });
  return ret;
})();

function srcOf(i){return {title:CORPUS[i].title,url:CORPUS[i].url};}

// LOPENDE TEKST van een pagina, zonder navigatie.
// De crawler neemt ook de links uit de hoofdinhoud mee; op hubpagina's bestaat de "tekst"
// daardoor vrijwel alleen uit menu-items ("Toestemmingsformulier reizen met kinderen
// (Rijksoverheid.nl)"). Dat is geen antwoord, dus tonen we het niet als citaat. We gaan af op
// de linklijst van de pagina zelf: is een regel letterlijk de tekst van een link, dan is het
// navigatie. Blijft er niets over, dan valt de aanroeper terug op de paginabeschrijving.
const PROSE=[];
function proseLines(idx){
  if(PROSE[idx])return PROSE[idx];
  const p=CORPUS[idx]||{};
  const anchors=new Set((p.links||[]).map(l=>(Array.isArray(l)?l[0]:l||"").trim().toLowerCase()));
  const out=(p.text||"").split("\n").map(s=>s.trim())
    .filter(s=>s.length>50&&!anchors.has(s.toLowerCase()));
  return (PROSE[idx]=out);
}

function demoAnswer(q,cands){
  const paras=proseLines(cands[0]);
  const body=paras.slice(0,2).join("\n")||CORPUS[cands[0]].desc||"";
  return {restated_question:q,demo:true,
    citations:[{text:body,verified:true,src:srcOf(cands[0]),srcIdx:cands[0]}],
    note:"DEMO-modus: begin van de best-matchende pagina, niet door AI geselecteerd of geciteerd. Vul een sleutel in voor een echte inleiding + letterlijke citaten.",
    used:[srcOf(cands[0])],related:cands.slice(1).map(srcOf)};
}

async function askAI(q,cands,key){
  // De pagina's staan al op volgorde van relevantie (na AI-herrangschikking).
  const listing=cands.map((idx,n)=>`[${n}] TITEL: ${CORPUS[idx].title}\nURL: ${CORPUS[idx].url}\nTEKST:\n${CORPUS[idx].text}`).join("\n\n---\n\n");
  const user=`Vraag van de voorlichter:\n${q}\n\nPagina's:\n${listing}`;
  const text=await PROVIDERS[provSel.value].call(key,modelSel.value,SYSTEM,user);
  const r=parseModelJSON(text);
  const rawCites=Array.isArray(r.citations)?r.citations:[];
  const citations=[];const usedSet=new Set();let notFound=0;
  for(const c of rawCites){
    const local=c.source_index;const gi=Number.isInteger(local)?cands[local]:null;if(gi===null)continue;
    // Knip het exacte stuk zelf uit de pagina o.b.v. de start/end-verwijzing -> altijd letterlijk.
    let quote=extractQuote(CORPUS[gi].text,c.start,c.end);
    if(!quote){notFound++;continue;}
    quote=expandHeading(CORPUS[gi].text,quote);   // los kopje? vul aan met de inhoud eronder
    if(isWeakQuote(quote)){notFound++;continue;}  // nog steeds te kort/kopje -> overslaan
    if(citations.some(x=>quotesOverlap(x.text,quote)))continue; // dubbel/overlappend -> overslaan
    const bridge=(c.bridge||"").toString().trim().replace(/\s+/g," ").slice(0,180);
    citations.push({text:quote,verified:true,src:srcOf(gi),srcIdx:gi,bridge});usedSet.add(gi);
    if(citations.length>=MAX_CITES)break;
  }
  const used=[...new Set(citations.map(c=>c.srcIdx))].map(srcOf);
  let related=(r.related_indices||[]).map(n=>cands[n]).filter(i=>Number.isInteger(i)&&!usedSet.has(i)).map(srcOf);
  let note=r.note||"";
  let clarifications=(Array.isArray(r.clarifications)?r.clarifications:[]).map(c=>({question:(c.question||"").trim(),prefill:(c.prefill||"").trim()})).filter(c=>c.question);
  let followups=(Array.isArray(r.followups)?r.followups:[]).map(f=>(f||"").trim()).filter(Boolean);
  if(r.__partial&&citations.length)note="Het antwoord was lang en mogelijk niet volledig; de getoonde citaten kloppen wel. Stel de vraag eventueel specifieker.";
  if(!citations.length){
    // Zonder onderbouwend citaat tonen we GEEN vrije AI-tekst (geen note),
    // zodat het model niet alsnog een eigen antwoord verzint.
    if(notFound){
      // Het model wilde wel citeren maar de passage was niet exact terug te vinden:
      // er bestaat waarschijnlijk wél een antwoord -> verwijs naar de bron.
      if(!related.length)related=cands.slice(0,3).map(srcOf);
      note="De passage kon niet exact op de bronpagina worden teruggevonden. Bekijk de bron hieronder.";
    }else{
      // Het model vond niets relevants op de pagina's: alleen 'Geen antwoord gevonden'.
      related=[];clarifications=[];followups=[];note="";
    }
  }
  // Intro: korte herformulering van de informatiebehoefte; alleen tonen als er een citaat is.
  const intro=citations.length?((r.intro||"").toString().trim().replace(/\s+/g," ").slice(0,200)):"";
  return {restated_question:r.restated_question||q,intro,citations,used,related,note,clarifications,followups};
}

}

const ICON_COPY='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>';

// Kopieer tekst naar het klembord, met korte visuele bevestiging op de knop.
function copyText(t,btn){
  const flash=()=>{if(!btn)return;const o=btn.innerHTML,hadLabel=/span/.test(o);btn.classList.add("ok");btn.innerHTML=ICON_OK+(hadLabel?"<span>Gekopieerd</span>":"");setTimeout(()=>{btn.innerHTML=o;btn.classList.remove("ok");},1400);};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(flash).catch(()=>fallbackCopy(t,flash));
  else fallbackCopy(t,flash);
}
function fallbackCopy(t,cb){const ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand("copy");}catch(e){}document.body.removeChild(ta);cb&&cb();}
// Het hele antwoord als platte tekst (inleiding + citaten met bron) — handig om door te geven aan de burger.
function answerPlainText(r){
  const parts=[];
  if(r.intro)parts.push(r.intro);
  (r.citations||[]).forEach(c=>{
    if(c.bridge)parts.push(c.bridge);
    parts.push("“"+c.text+"”"+(c.src?` (${c.src.title} — ${c.src.url})`:""));
  });
  return parts.join("\n\n");
}
// Datum waarop de bron is geraadpleegd (vandaag), in Nederlandse notatie.
function consultDate(){return new Date().toLocaleDateString("nl-NL",{day:"numeric",month:"long",year:"numeric"});}
// Kort, deelbaar bericht voor WhatsApp/e-mail: per citaat het antwoord + bron + DIRECTE
// gemarkeerde link (springt op de bronpagina naar het citaat en arceert het geel).
function shareText(r){
  const out=[];
  (r.citations||[]).forEach((c,i)=>{
    const link=textFragmentUrl(c.src&&c.src.url,c.text,((CORPUS[c.srcIdx]||{}).headings));
    const intro=(i===0&&r.intro)?r.intro+"\n\n":"";
    out.push(intro+"“"+c.text+"”"+(c.src?"\n\nBron: "+c.src.title:"")+"\nHet antwoord kunt u hier terugvinden: "+link);
  });
  return out.join("\n\n———\n\n")+"\n\n(Bron geraadpleegd op "+consultDate()+")";
}
function shareWhatsApp(r){window.open("https://wa.me/?text="+encodeURIComponent(shareText(r)),"_blank","noopener");}
function shareEmail(r){location.href="mailto:?subject="+encodeURIComponent(r.restated_question||"Antwoord van NederlandWereldwijd")+"&body="+encodeURIComponent(shareText(r));}
// Feedback lokaal opslaan, zodat we later kunnen zien waar de assistent fout zat.
function logFeedback(r,verdict,btn){
  const wrap=btn.parentNode;wrap.querySelectorAll(".fb-btn").forEach(b=>b.classList.remove("sel-up","sel-down"));
  btn.classList.add(verdict>0?"sel-up":"sel-down");
  try{const k="vk_feedback",arr=JSON.parse(localStorage.getItem(k)||"[]");arr.push({q:r.restated_question||"",verdict,hadAnswer:!!(r.citations&&r.citations.length),ts:Date.now()});localStorage.setItem(k,JSON.stringify(arr.slice(-200)));}catch(e){}
}
// Vragen zonder (goed) antwoord lokaal bijhouden: voeding voor de eval-set en het zoeklexicon.
function logMiss(q,reason){
  try{const k="vk_misses",arr=JSON.parse(localStorage.getItem(k)||"[]");arr.push({q:(q||"").slice(0,300),reason,ts:Date.now()});localStorage.setItem(k,JSON.stringify(arr.slice(-200)));}catch(e){}
}
// Exporteer feedback + gemiste vragen als CSV (voor analyse en het verbeteren van de eval-set).
function exportFeedback(){
  const esc=s=>'"'+String(s==null?"":s).replace(/"/g,'""')+'"';
  let rows=[["type","vraag","oordeel","reden","tijd"].join(";")];
  try{for(const f of JSON.parse(localStorage.getItem("vk_feedback")||"[]"))rows.push(["feedback",esc(f.q),f.verdict>0?"goed":"niet goed",f.hadAnswer?"antwoord getoond":"geen antwoord",new Date(f.ts).toISOString()].join(";"));}catch(e){}
  try{for(const m of JSON.parse(localStorage.getItem("vk_misses")||"[]"))rows.push(["gemist",esc(m.q),"",esc(m.reason),new Date(m.ts).toISOString()].join(";"));}catch(e){}
  const blob=new Blob(["﻿"+rows.join("\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="leo-feedback.csv";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}
// Render de passage als rustige alinea's (kern-focus, geen ingesloten kop-opmaak).
function citeBodyHTML(c){
  const lines=(c.text||"").split("\n").map(s=>s.trim()).filter(Boolean);
  return lines.map(ln=>`<p class="cite-p">${escapeHtml(ln)}</p>`).join("")||`<p class="cite-p">${escapeHtml(c.text||"")}</p>`;
}

  if(hasCites){
    // Eén doorlopend stuk: AI-tekst en citaat wisselen elkaar af, elk met een streepje en
    // alleen de eerste keer een label (AI / NWW). Zo lees je van boven naar beneden af wie
    // wat zegt, zonder dat het uiteenvalt in losse blokken.
    let eersteAI=true,eersteCit=true;
    // Demo-modus levert geen AI-tekst; toon dan de vraag als context, anders begint het

    };
    r.citations.forEach((c,i)=>{
      let tekst="";
      if(i===0&&r.intro)tekst+=`<p class="intro">${escapeHtml(r.intro)}</p>`;
      if(c.bridge)tekst+=`<p class="${i===0&&r.intro?"brug":"intro"}">${escapeHtml(c.bridge)}</p>`;
      if(tekst)h+=aiRij(tekst);
      const n=num[c.src.url]||(i+1);
      const lab=eersteCit?"NWW":"";eersteCit=false;
      h+=`<div class="passage ${c.verified?'verified':'unverified'}" data-ci="${i}">`
        +`<span class="ans-lab">${lab}</span><div class="cite-col">`

          +`<span class="src-go">Lees verder op de pagina →</span>`
        +`</div></div></div>`;
    });
    // Geen citaat maar wel een intro (kan niet voorkomen, maar dan valt er niets weg).
    if(!r.citations.length&&r.intro)h+=aiRij(`<p class="intro">${escapeHtml(r.intro)}</p>`);
  }else{
    h+=`<div class="restated-sub"><span class="rs-label">Je vraag:</span> ${escapeHtml(r.restated_question)} ${badge}</div>`;

  }

  // Na het kernantwoord: vragen die de voorlichter moet stellen voor een concreter antwoord

  if(hasCites&&clar.length){
    h+=`<div class="clarify"><span class="label">Vraag dit na voor een beter antwoord:</span><ul class="fup-list">`;
    clar.forEach(c=>{h+=`<li><button class="fup-row clar-row" data-prefill="${escapeHtml(c.prefill||c.question)}"><span class="fup-q">${escapeHtml(c.question)}</span><span class="fup-plus">${ICON_ARROW}</span></button></li>`;});
    h+=`</ul></div>`;
  }
  // Footer: vervolgvragen (Perplexity-stijl) en acties.
  let f="";
  const fups=r.followups||[];
  if(fups.length){
    f+=`<div class="followups"><span class="label">Mogelijke vervolgvragen:</span><ul class="fup-list">`;

  slot.querySelectorAll(".cite-body.clickable-cite, .src-card").forEach(el=>{
    el.onclick=e=>{if(e.target.closest(".copy-cite")||e.target.closest("a"))return;openCite(el);};
    el.onkeydown=e=>{if((e.key==="Enter"||e.key===" ")&&el.classList.contains("src-card")){e.preventDefault();openCite(el);}};
  });
  const ca=slot.querySelector(".copy-answer");if(ca)ca.onclick=()=>copyText(answerPlainText(r),ca);
  const wa=slot.querySelector(".share-wa");if(wa)wa.onclick=()=>shareWhatsApp(r);
  const ml=slot.querySelector(".share-mail");if(ml)ml.onclick=()=>shareEmail(r);
  const up=slot.querySelector(".fb-up"),dn=slot.querySelector(".fb-down");
  if(up)up.onclick=()=>logFeedback(r,1,up);
  if(dn)dn.onclick=()=>logFeedback(r,-1,dn);
  turn.scrollIntoView({behavior:"smooth",block:"end"});

function escapeHtml(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}

/* ---- Bron-viewer: toont de paginatekst met het citaat gearceerd + link naar de live pagina ---- */
const viewerEl=document.getElementById("viewer"),viewerTitle=document.getElementById("viewer-title"),
  viewerOpen=document.getElementById("viewer-open"),viewerBody=document.getElementById("viewer-body"),
  viewerClose=document.getElementById("viewer-close"),viewerBackdrop=document.getElementById("viewer-backdrop");
let viewerLastFocus=null;
// Maak van een zin een whitespace-tolerant patroon (spatie/nieuwe regel maken niet uit).
function rxPhrase(p){return p.trim().replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/\s+/g,"\\s+");}
// Zoek het citaat-bereik [start,eind) in de paginatekst. Valt terug op begin..eind als de hele passage niet 1-op-1 matcht.
function matchRange(fullText,quote){
  let m=null;const q=(quote||"").trim();
  if(q){
    try{m=new RegExp(rxPhrase(q)).exec(fullText);}catch(e){}
    if(!m){
      const w=q.split(/\s+/);
      if(w.length>=8){try{m=new RegExp(rxPhrase(w.slice(0,4).join(" "))+"[\\s\\S]*?"+rxPhrase(w.slice(-4).join(" "))).exec(fullText);}catch(e){}}
    }
  }
  return m?[m.index,m.index+m[0].length]:[-1,-1];
}
// Nederlandse functiewoorden: eindigt een regel hierop, dan loopt de zin door (link-fragmentatie samenvoegen).
const VW_FUNC=new Set("in op aan om de het een te voor van met bij uit naar of en dat die dan als tot over per is was zijn wordt worden deze dit door tussen onder boven na vanaf sinds tijdens zonder tegen volgens binnen buiten dan ook niet wel maar want omdat zodat zoals u we ik hij zij ze hun haar onze ons".split(" "));
// Bepaalt of 'cur' een voortzetting is van de vorige regel (dan samenvoegen tot één alinea).
function isContinuation(prev,cur){
  const c=cur.replace(/^\s+/,"");if(!c)return false;
  if(/^[a-zà-öø-ÿ]/.test(c))return true;                       // begint met kleine letter
  if(/^[,;:.?!)\]»’'"+–—\/-]/.test(c))return true;   // begint met leesteken/sluiting
  if(/^\(/.test(c))return true;                                 // begint met haakje openen
  const p=prev.replace(/\s+$/,"");
  if(/[(\[«\/–—-]$/.test(p))return true;             // vorige eindigt op open haakje/streepje
  const m=p.toLowerCase().match(/([a-zà-öø-ÿ]+)$/);
  if(m&&VW_FUNC.has(m[1]))return true;                          // vorige eindigt op een functiewoord
  return false;
}
// Render de paginatekst als een echte pagina: losse regels worden samengevoegd tot alinea's,
// H2-koppen worden uitklapbare secties (de sectie met het citaat staat open) en het citaat blijft geel.
function buildSourceHTML(fullText,quote,headings,links){
  // Maak hrefs absoluut en linkify de (geëscapete) tekst met de echte pagina-links.
  const linkHref=h=>/^https?:|^mailto:|^tel:/i.test(h)?h:(h&&h[0]==="/"?"https://www.nederlandwereldwijd.nl"+h:h);
  const linkList=(links||[]).filter(l=>l&&l[0]&&l[0].length>=5).map(l=>[escapeHtml(l[0]),linkHref(l[1])]).sort((a,b)=>b[0].length-a[0].length);
  function linkify(escd){
    if(!linkList.length)return escd;
    const ms=[];for(const [et,href] of linkList){const i=escd.indexOf(et);if(i>=0)ms.push([i,et.length,href]);}
    ms.sort((a,b)=>a[0]-b[0]);
    let r="",pos=0,end=-1;
    for(const [i,len,href] of ms){if(i<end)continue;r+=escd.slice(pos,i)+`<a class="vlink" href="${escapeHtml(href)}" target="_blank" rel="noreferrer">`+escd.slice(i,i+len)+`</a>`;pos=i+len;end=pos;}
    return r+escd.slice(pos);
  }
  const [ms,me]=matchRange(fullText,quote);
  const openAll=ms<0; // citaat niet gevonden -> alles open tonen
  const hmap=new Map();(headings||[]).forEach(([lvl,t])=>{if(t&&!hmap.has(t))hmap.set(t,lvl);});
  const lines=fullText.split("\n");
  const starts=[];let off=0;for(const l of lines){starts.push(off);off+=l.length+1;}
  // 1) Blokken: kop, of samengevoegde alinea (char-offsets blijven 1:1 omdat \n -> spatie).
  const blocks=[];let i=0;
  while(i<lines.length){
    const line=lines[i],s=starts[i],e=s+line.length,lvl=hmap.get(line);
    if(lvl){blocks.push({h:lvl,s,e});i++;continue;}
    if(!line.trim()){i++;continue;}
    let pe=e,last=line,j=i+1;
    while(j<lines.length){const nl=lines[j];if(hmap.get(nl)||!nl.trim())break;if(!isContinuation(last,nl))break;pe=starts[j]+nl.length;last=nl;j++;}
    blocks.push({h:0,s,e:pe});i=j;
  }
  // 2) Render een tekstbereik met gele markering van het citaat (\n -> spatie).
  let firstMark=true;
  const span=(s,e)=>{
    if(me<0||ms>=e||me<=s)return linkify(escapeHtml(fullText.slice(s,e).replace(/\n/g," ")));   // geen markering: wel links
    // Bevat het citaat: markering behouden, geen links erin (houdt de gele passage schoon).
    const a=Math.max(ms,s)-s,b=Math.min(me,e)-s,str=fullText.slice(s,e);const id=firstMark?' id="hl"':'';firstMark=false;
    return (escapeHtml(str.slice(0,a))+'<mark class="hl"'+id+'>'+escapeHtml(str.slice(a,b))+'</mark>'+escapeHtml(str.slice(b))).replace(/\n/g," ");
  };
  const hits=(s,e)=>me>s&&ms<e;
  // 3) Net als op NederlandWereldwijd: H2 = zichtbare sectiekop, H3 = uitklapper (accordeon).
  //    De uitklapper met het gele citaat staat automatisch open.
  let out="",acc=null;
  const flushAcc=()=>{if(acc){out+=`<details class="vacc"${(acc.hit||openAll)?" open":""}><summary class="vh vh3">${acc.sum}</summary><div class="vacc-body">${acc.body}</div></details>`;acc=null;}};
  for(const b of blocks){
    if(b.h===3){flushAcc();acc={sum:span(b.s,b.e),body:"",hit:hits(b.s,b.e)};}
    else if(b.h===2){flushAcc();out+=`<div class="vh vh2">${span(b.s,b.e)}</div>`;}
    else if(b.h===1){flushAcc();out+=`<div class="vh vh1">${span(b.s,b.e)}</div>`;}
    else{const piece=`<p class="vp">${span(b.s,b.e)}</p>`;if(acc){acc.body+=piece;if(hits(b.s,b.e))acc.hit=true;}else out+=piece;}
  }
  flushAcc();
  return {html:out,found:ms>=0};
}
// Bouw een URL met text-fragment, zodat de browser op de live pagina naar het citaat springt en het markeert.
// Belangrijk: een text-fragment kan niet over een blok-grens (kop -> paragraaf) heen matchen.
// We strippen daarom eventuele kop-regels uit het citaat en gebruiken alleen woorden uit de lopende tekst.
function textFragmentUrl(url,quote,headings){
  if(!url)return "#";
  let q=(quote||"").trim();if(!q)return url;
  const hset=new Set((headings||[]).map(h=>h[1]));
  const lines=q.split(/\n+/).map(s=>s.trim()).filter(s=>s&&!hset.has(s));
  q=(lines.join(" ").replace(/\s+/g," ")||q.replace(/\s+/g," ")).trim();
  const w=q.split(" ");
  const frag=w.length<=10?encodeURIComponent(q):encodeURIComponent(w.slice(0,6).join(" "))+","+encodeURIComponent(w.slice(-6).join(" "));
  return url+"#:~:text="+frag;
}
function openViewer(srcIdx,quote,url,title){
  const page=Number.isInteger(srcIdx)?CORPUS[srcIdx]:null;
  const text=page?page.text:"";
  const built=buildSourceHTML(text,quote,page&&page.headings,page&&page.links);
  viewerTitle.textContent=title||(page&&page.title)||"Bronpagina";
  viewerOpen.href=textFragmentUrl(url||(page&&page.url),quote,page&&page.headings);
  viewerBody.innerHTML=(built.found?"":'<div class="viewer-note">Dit citaat kon niet exact op de pagina worden gemarkeerd; hieronder staat de volledige paginatekst.</div>')+built.html;
  viewerLastFocus=document.activeElement;
  document.body.classList.add("viewer-active");viewerEl.setAttribute("aria-hidden","false");viewerBackdrop.hidden=false;
  // Scroll ALLEEN de viewer-body naar het citaat (niet het hele document — dat veroorzaakte reflow).
  requestAnimationFrame(()=>{const hl=viewerBody.querySelector("#hl");
    if(hl){const hr=hl.getBoundingClientRect(),br=viewerBody.getBoundingClientRect();viewerBody.scrollTop+=(hr.top-br.top)-br.height/2+hr.height/2;}
    else viewerBody.scrollTop=0;});
  viewerClose.focus();
}
function closeViewer(){document.body.classList.remove("viewer-active");viewerEl.setAttribute("aria-hidden","true");viewerBackdrop.hidden=true;if(viewerLastFocus&&viewerLastFocus.focus)viewerLastFocus.focus();}
viewerClose.addEventListener("click",closeViewer);
viewerBackdrop.addEventListener("click",closeViewer);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&document.body.classList.contains("viewer-active"))closeViewer();});
</script>
