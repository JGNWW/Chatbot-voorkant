// ---- Ambient luistermodus via lokale Vosk (streaming spraakherkenning in de browser) ----
// De audio blijft VOLLEDIG op het apparaat (Vosk-WASM, geen cloud). Terwijl de voorlichter
// met de klant praat, transcribeert Vosk continu; op basis van de laatste woorden verschijnen
// automatisch de best passende quotes. Wisselt het gesprek van onderwerp, dan wisselen de
// quotes mee. Model + library worden self-hosted (werkt achter een firewall, geen CDN nodig).
// ===== SPRAAK IN DE INVOERBALK ===============================================================
// Eén werkwijze: de tool luistert mee en doet niets, tot je op "Geef antwoord" klikt. Omdat je
// zelf klikt, mag het een seconde duren — en dus kan de gesproken vraag door DEZELFDE pijplijn
// als een getypte vraag: AI maakt er één nette vraag van, daarna de gewone zoek- en
// antwoordstappen. De vorige losse luistermodus zocht alleen lokaal om snel te kunnen zijn; dat
// verschil in antwoordkwaliteit is hiermee weg.
const LISTEN=(function initSpraak(){
  const micBtn=document.getElementById("mic");
  const ret={active:false,stop:()=>{}};
  if(!micBtn)return ret;
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.WebAssembly)){micBtn.hidden=true;return ret;}
  micBtn.hidden=false;
  const statusEl=document.getElementById("spraak-status"),liveEl=document.getElementById("spraak-live"),
        meterEl=document.getElementById("spraak-meter"),vulEl=document.getElementById("spraak-vul"),
        tijdEl=document.getElementById("spraak-tijd"),antwoordBtn=document.getElementById("spraak-antwoord"),
        stopBtn=document.getElementById("spraak-stop"),tekstCheck=document.getElementById("spraak-tekst");

  let model=null,modelPromise=null,recognizer=null,stream=null,audioCtx=null,srcNode=null,proc=null;
  let finals=[],partial="",ctxStart=0,tikker=null,bezig=false,bezigTekst="Vraag opmaken…";

  // ---- keuze van het spraakmodel ----
  // Vosk draait vanaf onze eigen server en leest woord voor woord mee. Whisper is nauwkeuriger,
  // maar werkt per stuk audio: pas als je op "Geef antwoord" klikt gaat de opname er in één keer
  // doorheen. Dat kan sinds spraak op verzoek werkt; in de oude ambient modus kon het niet.
  // De maten zijn de werkelijke downloadgrootte van de q8-modellen (encoder + decoder).
  const MOTOREN={
    "vosk":{naam:"Vosk NL",mb:40,live:true},
    "whisper-base":{naam:"Whisper base",mb:77,live:false,id:"onnx-community/whisper-base"},
    "whisper-small":{naam:"Whisper small",mb:249,live:false,id:"onnx-community/whisper-small"},
  };
  let MOTOR="vosk";
  try{const m=localStorage.getItem("vk_spraak_motor");if(MOTOREN[m])MOTOR=m;}catch(e){}
  const motor=()=>MOTOREN[MOTOR]||MOTOREN.vosk;
  const liveMogelijk=()=>motor().live;
  const motorSel=document.getElementById("spraak-motor");
  if(motorSel){
    motorSel.value=MOTOR;
    motorSel.onchange=()=>{
      MOTOR=MOTOREN[motorSel.value]?motorSel.value:"vosk";
      try{localStorage.setItem("vk_spraak_motor",MOTOR);}catch(e){}
      if(ret.active||document.body.classList.contains("spraak-laadt"))stop();   // opnieuw starten met het nieuwe model
      tekstVinkje();
    };
  }
  // Zonder live meelezen heeft het vinkje alleen zin ná de omzetting; dat maken we zichtbaar.
  function tekstVinkje(){
    if(!tekstCheck)return;
    tekstCheck.disabled=!liveMogelijk();
    const l=tekstCheck.closest("label");
    if(l)l.title=liveMogelijk()?"Alleen nodig om te controleren of u goed verstaan wordt"
      :"Whisper zet de spraak pas om als u op “Geef antwoord” klikt; meelezen tijdens het spreken kan alleen met Vosk.";
  }

  // ---- Whisper via transformers.js (zelfde bibliotheek als het semantisch zoeken) ----
  let asr=null,asrPromise=null,asrId=null,pcm=[],pcmLen=0;
  const PCM_MAX=16000*45;                       // 45 seconden; ouder dan dat is de vraag niet meer
  async function loadWhisper(){
    const id=motor().id;
    if(asr&&asrId===id)return asr;
    if(!asrPromise||asrId!==id){
      asrId=id;
      asrPromise=(async()=>{
        setWarm("downloaden",0);
        const tf=await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1");
        tf.env.allowLocalModels=false;
        const gezien={};
        asr=await tf.pipeline("automatic-speech-recognition",id,{
          dtype:"q8",
          progress_callback:p=>{
            if(p.status!=="progress"||!p.total)return;
            gezien[p.file]=p.loaded;
            const klaar=Object.values(gezien).reduce((a,b)=>a+b,0);
            setWarm("downloaden",Math.min(99,Math.round(klaar/(motor().mb*1e6)*100)));
          },
        });
        setWarm("klaar",100);
        return asr;
      })().catch(e=>{asrPromise=null;throw e;});
    }
    return asrPromise;
  }
  async function whisperTekst(){
    if(!pcmLen)return "";
    const buf=new Float32Array(pcmLen);let o=0;
    for(const stuk of pcm){buf.set(stuk,o);o+=stuk.length;}
    const uit=await asr(buf,{language:"dutch",task:"transcribe",chunk_length_s:30,stride_length_s:5});
    return ((uit&&uit.text)||"").trim();
  }

  // Gesprekstekst tonen: alleen nodig om te controleren of je goed verstaan wordt, dus standaard
  // uit. De keuze blijft bewaard.
  let TOON=false;
  try{TOON=localStorage.getItem("vk_spraak_tekst")==="1";}catch(e){}
  if(tekstCheck){
    tekstCheck.checked=TOON;
    tekstCheck.onchange=()=>{TOON=tekstCheck.checked;try{localStorage.setItem("vk_spraak_tekst",TOON?"1":"0");}catch(e){}toonToggle();toonBalk();};
  }

  // Het vinkje bepaalt óók of het gesproken origineel onder de vraagbubbel staat: staat de
  // gesprekstekst uit, dan wil je ook in het gesprek geen ruwe spraak zien.
  function toonToggle(){document.body.classList.toggle("spraak-toon",TOON);}
  toonToggle();tekstVinkje();

  // ---- laadvoortgang van het spraakmodel (40 MB, eenmalig) ----
  const warm={phase:"idle",pct:0};
  const onWarm=[];
  function setWarm(phase,pct){
    warm.phase=phase;warm.pct=(pct!=null)?pct:(phase==="uitpakken"?0:warm.pct);
    onWarm.forEach(f=>{try{f(warm);}catch(e){}});
    if(document.body.classList.contains("spraak-laadt"))toonBalk();
  }
  function ensureLib(){return new Promise((res,rej)=>{if(window.Vosk)return res();const s=document.createElement("script");s.src="vendor/vosk.js";s.onload=()=>res();s.onerror=()=>rej(new Error("kon vendor/vosk.js niet laden"));document.head.appendChild(s);});}
  // Haalt het modelbestand ÉÉN keer op (met voortgang) en geeft het als blob-URL door aan Vosk.
  // Zonder dit haalt de Vosk-worker het bestand nóg een keer op.
  async function fetchModelBlobUrl(){
    const r=await fetch("data/vosk-model-nl.tar.gz");
    if(!r.ok)throw new Error("model niet gevonden ("+r.status+")");
    const total=+(r.headers.get("content-length")||0);
    if(!r.body||!total){const b=await r.blob();return URL.createObjectURL(b);}
    const reader=r.body.getReader(),parts=[];let got=0;
    for(;;){const {done,value}=await reader.read();if(done)break;parts.push(value);got+=value.length;
      setWarm("downloaden",Math.min(99,Math.round(got/total*100)));}
    return URL.createObjectURL(new Blob(parts,{type:"application/gzip"}));
  }
  async function loadModel(){
    if(model)return model;
    if(!modelPromise)modelPromise=(async()=>{
      await ensureLib();
      setWarm("downloaden",0);
      const url=await fetchModelBlobUrl();
      setWarm("uitpakken");
      const t0=Date.now();const tick=setInterval(()=>{if(warm.phase==="uitpakken")setWarm("uitpakken",Math.round((Date.now()-t0)/1000));},1000);
      try{model=await window.Vosk.createModel(url);}
      finally{clearInterval(tick);URL.revokeObjectURL(url);}
      setWarm("klaar",100);
      return model;
    })();
    return modelPromise;
  }
  // Vooraf laden zodra de pagina rustig is: dan is de eerste klik meteen bruikbaar.
  ret.warm=warm;ret.onWarm=f=>onWarm.push(f);
  const kickoff=()=>{if(MOTOR==="vosk")loadModel().catch(()=>{});};   // niet 40 MB halen voor een model dat niet gekozen is
  if("requestIdleCallback" in window)requestIdleCallback(kickoff,{timeout:8000});else setTimeout(kickoff,4000);

  // ---- afkortingen herstellen ----
  // Vosk schrijft gespelde afkortingen uit elkaar ("i en de" / "vee ef es"). We voegen zulke
  // letterreeksen weer samen, maar ALLEEN als het resultaat een bekende afkorting is — anders
  // zouden gewone woorden als "en", "er" en "de" gewone zinnen kapotmaken.
  const ABBR=new Set("ind vfs brp svb aow rni abp eer hcch duo mvv bsn rdw uwv cak wia cbr wao waz vog anw ww vbn kns sar cdc dbb eva".split(" "));
  const LETTER={a:"a",aa:"a",be:"b",bee:"b",ce:"c",cee:"c",see:"c",de:"d",dee:"d",e:"e",ee:"e",ef:"f",eff:"f",ge:"g",gee:"g",ha:"h",haa:"h",i:"i",ie:"i",j:"j",je:"j",jee:"j",ka:"k",kaa:"k",el:"l",l:"l",em:"m",m:"m",en:"n",n:"n",o:"o",oo:"o",pe:"p",pee:"p",ku:"q",kuu:"q",er:"r",r:"r",es:"s",s:"s",te:"t",tee:"t",u:"u",uu:"u",ve:"v",vee:"v",we:"w",wee:"w",iks:"x",ei:"y",ij:"y",zet:"z",z:"z",b:"b",c:"c",d:"d",f:"f",g:"g",h:"h",k:"k",p:"p",q:"q",t:"t",v:"v",w:"w",x:"x",y:"y"};
  function expandAbbrev(text){
    const w=(text||"").split(/\s+/).filter(Boolean);
    const out=[];let i=0;
    while(i<w.length){
      let run=0;while(i+run<w.length&&LETTER[w[i+run].toLowerCase().replace(/[^a-zà-ÿ]/g,"")])run++;
      let matched=false;
      if(run>=2){
        for(let len=Math.min(run,6);len>=2&&!matched;len--){
          const cand=w.slice(i,i+len).map(x=>LETTER[x.toLowerCase().replace(/[^a-zà-ÿ]/g,"")]).join("");
          if(ABBR.has(cand)){out.push(cand);i+=len;matched=true;}
        }
      }
      if(!matched){out.push(w[i]);i++;}
    }
    return out.join(" ");
  }

  // ---- de balk ----
  const zichtbaar=(el,aan)=>{if(el)el.hidden=!aan;};
  function toonBalk(){
    const laadt=document.body.classList.contains("spraak-laadt");
    const aan=document.body.classList.contains("spraak-aan");
    const live=TOON&&liveMogelijk();
    zichtbaar(statusEl,laadt||bezig||(aan&&!live));
    zichtbaar(liveEl,aan&&live&&!bezig);
    zichtbaar(meterEl,laadt&&warm.phase==="downloaden");
    zichtbaar(vulEl,laadt||bezig||(aan&&!live));
    zichtbaar(tijdEl,aan&&!bezig);
    zichtbaar(antwoordBtn,aan&&!bezig);
    zichtbaar(stopBtn,aan||laadt);
    if(statusEl){
      statusEl.textContent=bezig?bezigTekst
        :laadt?(warm.phase==="uitpakken"?("Spraakmodel gereedmaken… ("+(warm.pct||0)+"s, eenmalig)")
                                        :(motor().naam+" laden… "+(warm.pct||0)+"% van "+motor().mb+" MB"))
        :"Luistert mee…";
    }
    if(meterEl)meterEl.firstElementChild.style.width=(warm.pct||0)+"%";
    if(liveEl)tekenLive();
    if(tijdEl&&aan)tijdEl.textContent=klok();
  }
  function klok(){
    const s=Math.max(0,Math.round((Date.now()-ctxStart)/1000));
    return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
  }
  function tekenLive(){
    if(!liveEl||liveEl.hidden)return;
    // Toon precies het venster dat straks ook doorzoekt wordt, zodat wat je leest klopt met
    // wat er gebeurt.
    const nu=partial.trim();
    const heel=gehoord();
    const oud=nu&&heel.endsWith(nu)?heel.slice(0,heel.length-nu.length).trim():heel;
    liveEl.innerHTML='<span>'+escapeHtml(oud)+(oud&&nu?" ":"")+'<span class="nieuw">'+escapeHtml(nu)+"</span></span>";
  }
  const finalsSinds=()=>finals.filter(f=>f.t>=ctxStart).map(f=>f.text);
  // Alleen de LAATSTE 60 woorden sinds de vorige klik gaan naar de vraag — precies zoals de
  // oude "antwoord op verzoek". Neem je alles mee, dan verdrinkt de eigenlijke vraag in het
  // voorafgaande gesprek en wordt het antwoord slechter, ook al is de herkenning hetzelfde.
  const VENSTER_WOORDEN=60;
  function gehoord(){
    const t=[...finalsSinds(),partial.trim()].join(" ").trim();
    return (t.match(/\S+/g)||[]).slice(-VENSTER_WOORDEN).join(" ");
  }
  function resetContext(){ctxStart=Date.now();finals=finals.filter(f=>f.t>=ctxStart);partial="";pcm=[];pcmLen=0;}

  // ---- van gesproken tekst naar een nette vraag ----
  // Zonder AI-sleutel poetsen we lokaal de ergste ruis weg; met sleutel maakt het model er één
  // zelfstandige vraag van. Dat is precies het verschil tussen "ja precies en mevrouw vraagt
  // zich af wat het kost" en "Wat kost een paspoort?".
  const VULWOORD=/^(ja|nee|eh+|uh+|nou|dus|oké|okee|precies|goed|kijk|nja|hmm+)$/i;
  function lokaalOpschonen(t){
    const w=(t||"").split(/\s+/).filter(Boolean);
    while(w.length&&VULWOORD.test(w[0]))w.shift();
    return w.join(" ").replace(/\s+/g," ").trim();
  }
  // De prompt vraagt het al, maar één misser is er één te veel: een vraag die een INVALSHOEK
  // toevoegt die niet is uitgesproken ("kost" terwijl er niet over geld ging) leidt naar een
  // heel ander antwoord. Per invalshoek een handjevol woorden; zit er in de vraag een woord uit
  // een groep terwijl de gesproken tekst er geen enkel woord uit heeft, dan is die invalshoek
  // verzonnen en gebruiken we de opgeschoonde spraaktekst.
  const INVALSHOEKEN=[
    "kost kosten prijs prijzen bedrag bedragen euro euros betalen betaling tarief tarieven duur duurder gratis",
    "duurt duur lang langer termijn termijnen wachttijd wachten snel sneller doorlooptijd weken dagen maanden",
    "waar locatie locaties loket loketten adres balie balies dichtstbijzijnde",
    "geldig geldigheid verloopt verlopen vervalt houdbaar",
  ].map(g=>new Set(g.split(" ")));
  function vraagIsTrouw(ruw,vraag){
    // Losse woorden, NIET via tokenize: die filtert stopwoorden weg, en juist "waar", "wat" en
    // "hoe" zijn hier betekenisdragend.
    const woorden=t=>new Set((t||"").toLowerCase().match(/[a-zà-ÿ]+/g)||[]);
    const r=woorden(ruw),v=woorden(vraag);
    for(const groep of INVALSHOEKEN){
      const inVraag=[...v].some(w=>groep.has(w));
      if(!inVraag)continue;
      const inSpraak=[...r].some(w=>groep.has(w));
      if(!inSpraak)return false;
    }
    return true;
  }
  // Een vraag die aan de BURGER gericht is ("Is het voor uw kind of voor uzelf?") is geen
  // zoekvraag. Dat gebeurt als het fragment op zichzelf geen vraag is; dan hoort het bij de
  // vorige vraag te worden gezet in plaats van er een keuzevraag van te maken.
  const AAN_DE_BELLER=/^(is|gaat|betreft|wilt|wil|heeft|had)\s+(het|dit|dat|u|je|de aanvraag)\b.*\bof\b|^voor wie\b/i;
  const vorigeVraag=()=>(history.length?history[history.length-1].q:"").trim();
  // Zonder AI (of als de AI iets onbruikbaars teruggeeft): plak de aanvulling achter de vorige
  // vraag. Dat is precies wat een voorlichter zelf zou typen.
  function bijVorigeVraag(fragment){
    const v=vorigeVraag();
    if(!v)return fragment;
    return v.replace(/\?+\s*$/,"")+" — "+fragment;
  }
  async function netteVraag(ruw){
    const key=keyInput.value.trim();
    const schoon=lokaalOpschonen(ruw);
    if(!aiKlaar())return schoon;
    // Het lopende gesprek gaat mee, net als bij een getypte vervolgvraag. Zonder dat moet het
    // model van "het is voor mijn kind" in zijn eentje een vraag maken, en dat gaat mis.
    const ctx=history.length
      ? "Gesprek tot nu toe:\n"+history.slice(-6).map(h=>`Vraag: ${h.q}\nAntwoord (kort): ${h.summary}`).join("\n\n")+"\n\n"
      : "";
    try{
      const text=await PROVIDERS[provSel.value].call(key,modelSel.value,SPRAAK_SYSTEM,ctx+"Zojuist gezegd:\n"+ruw);
      const q=(parseModelJSON(text).vraag||"").toString().trim();
      if(!q)return schoon;
      if(AAN_DE_BELLER.test(q)){console.warn("vraag was aan de beller gericht:",q);return bijVorigeVraag(schoon);}
      if(!vraagIsTrouw(ruw,q)){console.warn("vraag voegde een invalshoek toe die niet gezegd is:",q);return schoon;}
      return q;
    }catch(e){console.warn("vraag opmaken:",e);return schoon;}
  }

  function nietsGehoord(){
    if(!statusEl)return;
    const o=statusEl.textContent;statusEl.textContent="Nog niets gehoord…";
    setTimeout(()=>{if(statusEl)statusEl.textContent=o;},1600);
  }
  async function geefAntwoord(){
    if(!ret.active||bezig)return;
    let ruw;
    if(liveMogelijk()){
      ruw=gehoord();
    }else{
      // Whisper zet de opname nu pas om; dat duurt een seconde of wat en dat moet je zien.
      if(!pcmLen)return nietsGehoord();
      bezig=true;bezigTekst="Spraak omzetten…";toonBalk();
      try{ruw=await whisperTekst();}
      catch(e){console.warn("omzetten mislukt:",e);bezig=false;toonBalk();alert("Kon de spraak niet omzetten: "+(e.message||e));return;}
      ruw=(ruw.match(/\S+/g)||[]).slice(-VENSTER_WOORDEN).join(" ");
    }
    ruw=expandAbbrev(ruw||"");
    if(!ruw||!tokenize(ruw).length){bezig=false;toonBalk();return nietsGehoord();}
    bezig=true;bezigTekst="Vraag opmaken…";toonBalk();
    const vraag=await netteVraag(ruw);
    bezig=false;resetContext();toonBalk();
    if(!ret.active)return;
    runQuestion(vraag,ruw);
  }

  function setActive(on){
    ret.active=on;
    micBtn.classList.toggle("rec",on);
    micBtn.title=on?"Stop met luisteren":"Meeluisteren en op verzoek een antwoord geven";
    micBtn.setAttribute("aria-label",on?"Stop met luisteren":"Start meeluisteren");
    document.body.classList.toggle("spraak-aan",on);
    refreshComposer();
    if(on){if(!tikker)tikker=setInterval(()=>{if(tijdEl&&!tijdEl.hidden)tijdEl.textContent=klok();},1000);}
    else{if(tikker){clearInterval(tikker);tikker=null;}}
    toonBalk();
  }
  function teardownAudio(){try{if(proc)proc.disconnect();if(srcNode)srcNode.disconnect();if(audioCtx)audioCtx.close();}catch(e){}try{if(stream)stream.getTracks().forEach(t=>t.stop());}catch(e){}proc=srcNode=audioCtx=stream=null;}
  function stop(){
    document.body.classList.remove("spraak-laadt");
    if(!ret.active&&!stream){toonBalk();return;}
    setActive(false);teardownAudio();
    try{if(recognizer)recognizer.remove();}catch(e){}recognizer=null;
    finals=[];partial="";bezig=false;pcm=[];pcmLen=0;
    toonBalk();refreshComposer();
  }
  ret.stop=stop;
  ret.nieuweContext=()=>{if(ret.active){resetContext();toonBalk();}};

  async function start(){
    // Vosk-modellen zijn op 16 kHz MONO getraind; vraag de microfoon daar expliciet om — anders
    // levert het model wel Nederlandse woorden, maar de verkeerde.
    const micWish={channelCount:1,sampleRate:16000,echoCancellation:true,noiseSuppression:true,autoGainControl:true};
    try{stream=await navigator.mediaDevices.getUserMedia({audio:micWish});}
    catch(e){try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}
      catch(e2){alert("Microfoontoegang geweigerd. Klik op het slotje links van de URL en sta microfoon toe.");return;}}
    document.body.classList.add("spraak-laadt");toonBalk();
    try{await (liveMogelijk()?loadModel():loadWhisper());}
    catch(e){document.body.classList.remove("spraak-laadt");teardownAudio();alert("Kon "+motor().naam+" niet laden: "+(e.message||e));toonBalk();return;}
    if(!stream){document.body.classList.remove("spraak-laadt");return;}   // ondertussen gestopt
    try{
      // AudioContext óók op 16 kHz: dan krijgt Vosk exact wat het model verwacht.
      try{audioCtx=new (window.AudioContext||window.webkitAudioContext)({sampleRate:16000});}
      catch(e){audioCtx=new (window.AudioContext||window.webkitAudioContext)();}
      if(audioCtx.state==="suspended")await audioCtx.resume();
      if(liveMogelijk()){
        recognizer=new model.KaldiRecognizer(audioCtx.sampleRate);
        recognizer.on("partialresult",m=>{partial=(m.result&&m.result.partial)||"";tekenLive();});
        recognizer.on("result",m=>{const t=((m.result&&m.result.text)||"").trim();if(t){finals.push({t:Date.now(),text:t});if(finals.length>40)finals=finals.slice(-40);}partial="";tekenLive();});
      }
      // Actief zetten VOORDAT de keten hangt: onaudioprocess negeert buffers zolang ret.active
      // nog false is, en één buffer is hier 4096 samples = ruim een kwart seconde spraak.
      resetContext();setActive(true);
      srcNode=audioCtx.createMediaStreamSource(stream);
      proc=audioCtx.createScriptProcessor(4096,1,1);
      const sink=audioCtx.createGain();sink.gain.value=0;
      proc.onaudioprocess=e=>{
        if(!ret.active)return;
        if(recognizer){try{recognizer.acceptWaveform(e.inputBuffer);}catch(err){}return;}
        // Whisper krijgt de audio pas bij de klik; tot dan bewaren we een rollend venster.
        const kanaal=e.inputBuffer.getChannelData(0);
        pcm.push(new Float32Array(kanaal));pcmLen+=kanaal.length;
        while(pcmLen>PCM_MAX&&pcm.length>1){pcmLen-=pcm[0].length;pcm.shift();}
      };
      srcNode.connect(proc);proc.connect(sink);sink.connect(audioCtx.destination);
    }catch(e){document.body.classList.remove("spraak-laadt");setActive(false);teardownAudio();alert("Kon de microfoon niet openen: "+(e.message||e));toonBalk();return;}
    document.body.classList.remove("spraak-laadt");
    toonBalk();
  }

  // Testhaakje: de standen zijn zonder microfoon niet te bereiken, en juist die willen we
  // geautomatiseerd kunnen nalopen (zie de browsertest bij deze wijziging).
  ret.__test={
    luisterAan:()=>{resetContext();setActive(true);},
    trouw:vraagIsTrouw,
    netteVraag,
    aanDeBeller:q=>AAN_DE_BELLER.test(q),
    bijVorige:bijVorigeVraag,
    hoor:t=>{finals.push({t:Date.now(),text:t});tekenLive();toonBalk();},
    antwoord:geefAntwoord,
    toonTekst:v=>{TOON=v;if(tekstCheck)tekstCheck.checked=v;toonToggle();toonBalk();},
  };
  micBtn.addEventListener("click",()=>{if(ret.active||document.body.classList.contains("spraak-laadt"))stop();else start();});
  if(stopBtn)stopBtn.onclick=stop;
  if(antwoordBtn)antwoordBtn.onclick=geefAntwoord;
  return ret;
})();

function srcOf(i){return {title:CORPUS[i].title,url:CORPUS[i].url};}

// De twee soorten tekst in een antwoord, expliciet uit elkaar gehouden:
//   type "bridge" = door de AI geschreven verbindende tekst (herformulering + overbrugging)
//   type "source" = LETTERLIJKE tekst van de website, onveranderlijk
// Zowel de weergave als het kopieren/delen loopt hierover, zodat er maar één plek is waar
// vastligt wat AI-tekst is en wat bron. Wie hier een blok toevoegt, moet zich uitspreken.
function answerBlocks(r){
  const blokken=[];
  // Volledig generatief: één blok met door de AI geschreven alinea's; de nummertjes verwijzen
  // naar dezelfde passages die anders letterlijk getoond zouden worden.
  if(r.generatief&&r.generatief.length){
    blokken.push({type:"generated",alineas:r.generatief,
                  text:r.generatief.map(a=>a.tekst).join("\n\n")});
    (r.citations||[]).forEach((c,i)=>blokken.push({type:"source",text:c.text,
      sourceUrl:c.src?c.src.url:"",sourceTitle:c.src?c.src.title:"",
      verified:!!c.verified,srcIdx:c.srcIdx,ci:i,alleenBron:true}));
    return blokken;
  }
  (r.citations||[]).forEach((c,i)=>{
    const tekst=[];
    if(i===0&&r.intro)tekst.push(r.intro);
    if(c.bridge)tekst.push(c.bridge);
    if(tekst.length)blokken.push({type:"bridge",text:tekst.join("\n"),alineas:tekst});
    blokken.push({type:"source",text:c.text,sourceUrl:c.src?c.src.url:"",sourceTitle:c.src?c.src.title:"",
                  verified:!!c.verified,srcIdx:c.srcIdx,ci:i});
  });
  if(!blokken.length&&r.intro)blokken.push({type:"bridge",text:r.intro,alineas:[r.intro]});
  return blokken;
}

// LOPENDE TEKST van een pagina, zonder navigatie.
// De crawler neemt ook de links uit de hoofdinhoud mee; op hubpagina's bestaat de "tekst"
// daardoor vrijwel alleen uit menu-items ("Toestemmingsformulier reizen met kinderen
// (Rijksoverheid.nl)"). Dat is geen antwoord, dus tonen we het niet als citaat. We gaan af op
// de linklijst van de pagina zelf: is een regel letterlijk de tekst van een link, dan is het
// navigatie. Blijft er niets over, dan valt de aanroeper terug op de paginabeschrijving.
const PROSE=[];
function proseLines(idx){
  if(PROSE[idx])return PROSE[idx];
  const p=CORPUS[idx]||{};
  const anchors=new Set((p.links||[]).map(l=>(Array.isArray(l)?l[0]:l||"").trim().toLowerCase()));
  const out=(p.text||"").split("\n").map(s=>s.trim())
    .filter(s=>s.length>50&&!anchors.has(s.toLowerCase()));
  return (PROSE[idx]=out);
}

function demoAnswer(q,cands){
  const paras=proseLines(cands[0]);
  const body=paras.slice(0,2).join("\n")||CORPUS[cands[0]].desc||"";
  return {restated_question:q,demo:true,
    citations:[{text:body,verified:true,src:srcOf(cands[0]),srcIdx:cands[0]}],
    note:"DEMO-modus: begin van de best-matchende pagina, niet door AI geselecteerd of geciteerd. Vul een sleutel in voor een echte inleiding + letterlijke citaten.",
    used:[srcOf(cands[0])],related:cands.slice(1).map(srcOf)};
}

// ---- Vervolgvragen die nergens heen leiden eruit filteren -----------------------------------
// Het model verzint 2 tot 4 vervolgvragen zonder ooit te kijken of NederlandWereldwijd ze kán
// beantwoorden. Een voorlichter die er een aanklikt en niets krijgt, is slechter af dan zonder.
// De zoeklaag kost 13 ms per vraag, dus vier extra zoekopdrachten zijn gratis.
//
// SIGNAAL: welk deel van de onderscheidende woorden uit de vervolgvraag komt terug in de
// gevonden pagina's? Vraagt de vervolgvraag naar "spoedprocedure" en kent geen enkele
// toppagina dat woord, dan levert doorklikken niets op.
//
// WAAROM DEZE DREMPEL EN NIET STRENGER: gemeten over de 126 vragen uit eval_set.json haalt de
// slechtste 50% dekking en de mediaan 100%. Op 60% valt één van de 126 echte vragen af (0,8%).
// Strenger afstellen kost meteen goede vragen: op 70% sneuvelen er zes. Dit is dus een filter
// tegen duidelijke missers, GEEN kwaliteitsoordeel — een plausibele maar nutteloze
// vervolgvraag glipt er nog steeds doorheen.
const VERVOLG_DEKKING=0.6;
// Komt term t voor op pagina i? In turbomodus staat dat niet in een Map per pagina maar in de
// postings van de term; die staan op oplopend paginanummer, dus we kunnen vroeg stoppen.
function paginaHeeftTerm(i,t){
  if(!TIDX)return PTOKENS[i]?PTOKENS[i].has(t):false;
  const id=TIDX.id.get(t);if(id===undefined)return false;
  for(let k=TIDX.ptr[id],e=TIDX.ptr[id+1];k<e;k++){
    const d=TIDX.postDoc[k];
    if(d===i)return true;
    if(d>i)return false;
  }
  return false;
}
function vraagDekking(v){
  const qt=[...new Set(tokenize(v))];
  if(!qt.length)return 0;
  const top=rank(v,6);
  if(!top.length)return 0;
  const gezien=new Set();
  for(const i of top)for(const t of qt)if(paginaHeeftTerm(i,t))gezien.add(t);
  return gezien.size/qt.length;
}
function bruikbareVervolgvragen(lijst){
  if(!lijst.length||!CORPUS.length)return lijst;
  const uit=[];
  for(const v of lijst){
    const d=vraagDekking(v);
    if(d>=VERVOLG_DEKKING)uit.push(v);
    else console.warn("vervolgvraag levert niets op ("+Math.round(d*100)+"% dekking), valt af:",v);
  }
  return uit;
}
// ---- Dekking bij een samengestelde vraag ----------------------------------------------------
// "Wat kost het en hoe lang duurt het" wordt opgesplitst in deelvragen, en per deelvraag worden
// pagina's opgehaald. Daarna controleert niets meer of de GEKOZEN citaten elk deel ook raken:
// je kunt dus twee citaten over kosten terugkrijgen en niets over de doorlooptijd.
//
// De toets is bewust grof: strenger kan niet zonder een tweede modelaanroep, en dit gebeurt
// juist in het geval dat toch al het traagst is.
//
// Wel WEGEN we op zeldzaamheid. Zonder dat telde "wat kost een rijbewijs" als beantwoord door
// een citaat over paspoortkosten, puur omdat ze het woord "kost" delen. Een zeldzaam woord
// ("rijbewijs") zegt veel meer over waar een deelvraag om draait dan een woord dat overal staat.
function ongedekteDelen(subs,citations){
  if(!DF)buildDF();
  const inBron=new Set(tokenize(citations.map(c=>c.text||"").join(" ")));
  const open=[];
  for(const sq of subs){
    const qt=[...new Set(tokenize(sq))];
    if(qt.length<2)continue;                      // te weinig houvast om iets over te zeggen
    const totaal=qt.reduce((a,t)=>a+bm25idf(t),0);
    if(totaal<=0)continue;
    const raak=qt.filter(t=>inBron.has(t)).reduce((a,t)=>a+bm25idf(t),0);
    if(raak/totaal<0.5)open.push(sq);
  }
  // Alles onbeantwoord betekent meestal dat de OPSPLITSING niet deugde, niet dat het antwoord
  // faalde. Dan liever niets zeggen dan de voorlichter op een dwaalspoor zetten.
  return open.length>=subs.length?[]:open;
}
// Van modelantwoord naar wat er op het scherm komt. Losgemaakt uit askAI omdat een HALF
// binnengekomen antwoord (bij streamen) door precies dezelfde molen moet als een heel antwoord:
// dezelfde offset-gebaseerde knip uit de bron, dezelfde vangrails. Zo kan er tijdens het
// streamen niets op het scherm komen dat de eindcontrole niet zou hebben doorstaan.
//
// voorlopig=true betekent: dit is een tussenstand. Dan geen "geen informatie"-meldingen en geen
// waarschuwing over een afgekapt antwoord — die horen pas bij de eindstand. Is er nog geen enkel
// citaat, dan geeft de functie null terug en valt er dus nog niets te tonen.
function bouwAntwoord(r,q,bronnen,cands,subs,voorlopig){
  const rawCites=Array.isArray(r.citations)?r.citations:[];
  const citations=[];const usedSet=new Set();let notFound=0;
  for(const c of rawCites){
    const local=c.source_index;const gi=Number.isInteger(local)?bronnen[local]:null;if(gi===null||gi===undefined)continue;
    // Knip het exacte stuk zelf uit de pagina o.b.v. de start/end-verwijzing -> altijd letterlijk.
    // Het model wijst de passage aan (letterlijk, of met begin/eind-woorden); de app bepaalt de
    // definitieve grenzen op hele zinnen en knipt het stuk uit de PAGINA. De getoonde tekst is
    // daarmee altijd letterlijk, aaneengesloten en compleet.
    const pag=CORPUS[gi],ptxt=pag.text||"";
    const heads=headingSet(gi),anchors=anchorSet(gi);
    const span=locateSpan(ptxt,c.quote)||spanFromAnchors(ptxt,c.start,c.end);
    const cit=citationFor(gi,span);
    if(!cit){notFound++;continue;}
    const quote=cit.text;
    if(isWeakQuote(quote)){notFound++;continue;}
    if(citations.some(x=>quotesOverlap(x.text,quote)))continue; // dubbel/overlappend -> overslaan
    let bridge=(c.bridge||"").toString().trim().replace(/\s+/g," ").slice(0,180);
    if(!bridgeIsSafe(bridge,quote))bridge="";     // brug voegt eigen feiten toe -> weglaten
    citations.push({text:quote,verified:true,src:srcOf(gi),srcIdx:gi,bridge});usedSet.add(gi);
    if(citations.length>=MAX_CITES)break;
  }
  const used=[...new Set(citations.map(c=>c.srcIdx))].map(srcOf);
  let related=(r.related_indices||[]).map(n=>bronnen[n]).filter(i=>Number.isInteger(i)&&!usedSet.has(i)).map(srcOf);
  let note=r.note||"";
  let clarifications=(Array.isArray(r.clarifications)?r.clarifications:[])
    .map(c=>maakVerduidelijking(c.question,c.prefill)).filter(Boolean).slice(0,3);
  let followups=(Array.isArray(r.followups)?r.followups:[]).map(f=>(f||"").trim()).filter(Boolean);
  // Eerst de vragen eruit die aan de BELLER gericht zijn: die horen bij de uitvraag, met een
  // prefill, en niet bij de vragen die aan de zoeker gesteld worden.
  const rest=[];
  for(const fu of followups){
    const u=alsUitvraag(fu);
    if(u===null)rest.push(fu);                                  // gewone, zoekbare vervolgvraag
    else if(u!=="weg"&&clarifications.length<3&&!clarifications.some(c=>c.question===u.question))
      clarifications.push(u);
  }
  followups=bruikbareVervolgvragen(rest);
  if(r.__partial&&citations.length&&!voorlopig)note="Het antwoord was lang en mogelijk niet volledig; de getoonde citaten kloppen wel. Stel de vraag eventueel specifieker.";
  if(!citations.length&&!voorlopig){
    // Zonder onderbouwend citaat tonen we GEEN vrije AI-tekst (geen note),
    // zodat het model niet alsnog een eigen antwoord verzint.
    if(notFound){
      // Het model wilde wel citeren maar de passage was niet exact terug te vinden:
      // er bestaat waarschijnlijk wél een antwoord -> verwijs naar de bron.
      if(!related.length)related=cands.slice(0,3).map(srcOf);
      note="De passage kon niet exact op de bronpagina worden teruggevonden. Bekijk de bron hieronder.";
    }else{
      // Het model vond niets relevants op de pagina's: alleen 'Geen antwoord gevonden'.
      related=[];clarifications=[];followups=[];note=GEEN_INFO;
    }
  }
  // Intro: korte herformulering van de informatiebehoefte; alleen tonen als er een citaat is.
  const intro=citations.length?((r.intro||"").toString().trim().replace(/\s+/g," ").slice(0,200)):"";
  // Samengestelde vraag: dekken de citaten ALLE delen? Zo niet, zeg dat en bied het ontbrekende
  // deel aan als eerste vervolgvraag.
  if(citations.length&&subs&&subs.length>=2){
    const open=ongedekteDelen(subs,citations);
    if(open.length){
      followups=[...open,...followups.filter(f=>!open.includes(f))].slice(0,4);
      const staart=open.length===1?"één onderdeel":open.length+" onderdelen";
      note=(note?note+" ":"")+"Let op: van deze samengestelde vraag is "+staart+" niet beantwoord — zie de vervolgvragen.";
    }
  }
  if(voorlopig&&!citations.length)return null;
  return {restated_question:r.restated_question||q,intro,citations,used,related,note,clarifications,followups};
}
async function askAI(q,cands,key,subs,opGeneratief){
  // Hoeveel paginatekst er mee mag. Een lokaal model heeft een venster van 4096 tokens; zes
  // volledige pagina's zijn gemiddeld al ~4.900 tokens en zouden er dus niet in passen. Voor
  // een lokaal model korten we elke pagina in tot het deel waar het antwoord in zit.
  const lokaal=!!(PROVIDERS[provSel.value]||{}).geenSleutel;
  const lim=lokLimiet();
  const perPagina=lokaal?lim.perPagina:Infinity;
  const knip=t=>{
    if(!lokaal||t.length<=perPagina)return t;
    // Afkappen op een alineagrens, zodat er geen halve zin in de prompt belandt.
    const kort=t.slice(0,perPagina);
    const n=kort.lastIndexOf("\n");
    return (n>perPagina*0.5?kort.slice(0,n):kort).trim();
  };
  // De pagina's staan al op volgorde van relevantie (na AI-herrangschikking).
  const bronnen=lokaal?cands.slice(0,lim.bronnen):cands;
  const listing=bronnen.map((idx,n)=>`[${n}] TITEL: ${CORPUS[idx].title}\nURL: ${CORPUS[idx].url}\nTEKST:\n${knip(CORPUS[idx].text)}`).join("\n\n---\n\n");
  const user=`Vraag van de voorlichter:\n${q}\n\nPagina's:\n${listing}`;
  // Het HOOFDantwoord komt in één keer op het scherm. Het stukje bij beetje opbouwen van de
  // citaatblokken is geprobeerd en weer weggehaald: elk nieuw citaat duwde de rest omlaag, en
  // dat leest als een springend scherm in plaats van als een sneller antwoord.
  const text=await PROVIDERS[provSel.value].call(key,modelSel.value,lokaal?SYSTEM_LOKAAL:SYSTEM,user);
  const r=parseModelJSON(text);
  const uit=bouwAntwoord(r,q,bronnen,cands,subs,false);
  // WEL streamen: het volledig generatieve antwoord. Dat is één lopend verhaal dat van boven
  // naar beneden groeit, dus er springt niets — precies waar streamen wél voor deugt.
  if(GENERATIEF&&uit.citations.length){
    const live=(STREAM&&kanStreamen()&&opGeneratief)?(alineas)=>opGeneratief(uit,alineas):null;
    uit.generatief=await schrijfAntwoord(q,uit.citations,key,live);
  }
  return uit;
}

// ---- Volledig generatief antwoord (staat standaard uit) ----------------------------------
// De AI schrijft zelf, op basis van dezelfde passages die anders letterlijk getoond zouden
// worden. Twee vangrails, want een vloeiend antwoord leest alsof het klopt:
//   1. elke alinea moet aan minstens één passage hangen; hangt er niets aan, dan valt hij af;
//   2. elk getal, bedrag of jaartal in een alinea moet ook in de aangehaalde passage staan.
// Sneuvelt een alinea, dan valt ALLEEN die alinea af en blijft de rest staan. Een niet-gedekte
// bewering weghalen maakt het antwoord juist veiliger, en één slordige alinea hoort vier goede
// niet mee te slepen. Twee uitzonderingen waarbij we alsnog volledig terugvallen op de
// letterlijke weergave: als er niets overblijft, en als de MEERDERHEID sneuvelt — dan volgde het
// model de opdracht kennelijk niet, en is wat er wel doorkomt ook niet te vertrouwen.
// Liever een saai antwoord dan een vloeiend antwoord dat niet klopt.
function getallenIn(t){return (String(t).match(/\d[\d.,]*/g)||[]).map(x=>x.replace(/[.,]$/,""));}
function alineaKlopt(tekst,passages){
  const bron=passages.join(" ").toLowerCase();
  for(const g of getallenIn(tekst))if(!bron.includes(g.toLowerCase()))return false;
  if(/€|euro/i.test(tekst)&&!/€|euro/i.test(bron))return false;
  return true;
}
async function schrijfAntwoord(q,citations,key,onAlineas){
  const lijst=citations.map((c,i)=>"["+(i+1)+"] "+c.text).join("\n\n");
  let j;
  try{
    // Tijdens het schrijven tonen we de alinea's zoals ze binnenkomen. Er wordt NIETS
    // gecontroleerd op dat moment; de vangrails draaien pas over het complete antwoord, en een
    // alinea die daar sneuvelt verdwijnt dus weer. Dat is bewust: half gecontroleerde tekst
    // laten staan zou de garantie ondermijnen waar de hele app op rust.
    let onDelta=null;
    if(onAlineas){
      let vorig="";
      onDelta=(heel)=>{
        const half=tryRepairJSON(heel);
        const rij=(half&&Array.isArray(half.alineas)?half.alineas:[])
          .map(a=>((a&&a.tekst)||"").toString().trim()).filter(Boolean);
        const nu=rij.join("\u0000");
        if(nu===vorig)return;
        vorig=nu;onAlineas(rij);
      };
    }
    const text=await PROVIDERS[provSel.value].call(key,modelSel.value,GENERATIEF_SYSTEM,
      "Vraag:\n"+q+"\n\nPassages:\n"+lijst,onDelta);
    j=parseModelJSON(text);
  }catch(e){console.warn("generatief antwoord:",e);return null;}
  const ruw=Array.isArray(j&&j.alineas)?j.alineas:[];
  const alineas=[];const afgevallen=[];
  for(const a of ruw){
    const tekst=((a&&a.tekst)||"").toString().trim().replace(/\s+/g," ");
    if(!tekst)continue;
    const bronnen=[...new Set((Array.isArray(a.bronnen)?a.bronnen:[])
      .map(n=>parseInt(n,10)).filter(n=>n>=1&&n<=citations.length))];
    // "Wij hebben geen informatie" is het ENIGE wat zonder bron mag: dat is nu juist een uitspraak
    // over het ONTBREKEN van een bron. Zonder deze uitzondering gooit de vangrail hem weg en
    // valt de app terug op de letterlijke citaten die het model net onvoldoende vond.
    if(tekst===GEEN_INFO)return [{tekst,bronnen:[]}];
    if(!bronnen.length){
      afgevallen.push({reden:"geen bron",tekst});
      console.warn("alinea zonder bron, valt af:",tekst.slice(0,60));continue;
    }
    if(!alineaKlopt(tekst,bronnen.map(n=>citations[n-1].text))){
      afgevallen.push({reden:"getal niet in de bron",tekst});
      console.warn("alinea noemt een getal dat niet in de bron staat:",tekst.slice(0,80));continue;
    }
    alineas.push({tekst,bronnen});
  }
  if(!alineas.length){
    if(afgevallen.length)console.warn("generatief antwoord volledig afgekeurd ("+afgevallen.length+" alinea's)");
    return null;
  }
  // Meer dan de helft weggevallen: het model hield zich niet aan de opdracht. Dan is de rest
  // ook verdacht, en bovendien blijft er tekst over die naar weggehaalde alinea's verwijst.
  if(afgevallen.length>alineas.length){
    console.warn("generatief antwoord afgekeurd: "+afgevallen.length+" van de "+(afgevallen.length+alineas.length)+" alinea's sneuvelden");
    return null;
  }
  // Wat er afviel blijft beschikbaar, zodat het later ook te tonen is.
  alineas.afgevallen=afgevallen;
  return alineas;
}

    const rec={q:r.restated_question||"",verdict,hadAnswer:!!(r.citations&&r.citations.length),
               toelichting:(toelichting||"").slice(0,500),ts:Date.now()};

    else {arr.push(rec);r.__fbIdx=arr.length-1;}
    const kort=arr.slice(-200);
    r.__fbIdx-=(arr.length-kort.length);

  }catch(e){}
}

const ICON_DOC='<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>';
// Laat na een lokaal antwoord zien waar de tijd heen ging. Niet als opsmuk: zonder deze regel is
// "hij is traag" niet te onderscheiden van "de prompt is te groot", en dat zijn twee heel
// verschillende problemen. "Doorrekenen" is de prefill, "schrijven" het genereren zelf.
function toonMeting(turn){
  const mo=lokaleMotor();if(!mo)return;
  const m=mo.meetKlaar();if(!m||!turn)return;
  const bubble=turn.querySelector(".bubble.antwoord");if(!bubble)return;
  const el=document.createElement("div");el.className="meting";
  const deel=[`${m.totSec}s`,`${m.n} aanroep${m.n===1?"":"en"}`];
  if(m.kernen)deel.push(`${m.kernen} kern${m.kernen===1?"":"en"}`);
  if(m.inSec)deel.push(`doorrekenen ${m.inTok} tokens in ${m.inSec}s (${m.inTps}/s)`);
  else deel.push(`prompt ${m.inTok} tokens`+(m.gecacht?` (${m.gecacht} uit de cache)`:""));
  deel.push(`schrijven ${m.uitTok} tokens (${m.uitTps}/s)`);
  el.textContent=deel.join(" · ");
  bubble.appendChild(el);
}
// ---- Wachten met uitleg, en meten waar de tijd blijft --------------------------------------
// Eén statische regel "Bezig met opzoeken…" voor drie modelaanroepen plus een download van
// 118 MB is geen wachttijd maar een zwart gat. Deze twee functies maken er een stappenlijst van
// die meegroeit, en klokken meteen hoe lang elke stap duurde.
let STAPPEN=null;
function stapStart(){STAPPEN={t0:performance.now(),vorig:performance.now(),lijst:[]};}
function stap(turn,tekst){
  if(STAPPEN){
    const nu=performance.now();
    if(STAPPEN.lijst.length)STAPPEN.lijst[STAPPEN.lijst.length-1].ms=Math.round(nu-STAPPEN.vorig);
    STAPPEN.vorig=nu;STAPPEN.lijst.push({naam:tekst,ms:0});
  }
  const el=turn&&turn.querySelector(".shimmer");
  if(el)el.textContent=tekst+"…";
}
// Het model kan nog binnenkomen terwijl we wachten; laat dat percentage meelopen.
function stapModel(turn){
  if(!SEM.ready&&SEM.pct>0&&SEM.pct<100){
    const el=turn&&turn.querySelector(".shimmer");
    if(el)el.textContent="Zoekmodel binnenhalen… "+SEM.pct+"%";
  }
}
function stapKlaar(turn){
  if(!STAPPEN)return null;
  const nu=performance.now();
  if(STAPPEN.lijst.length)STAPPEN.lijst[STAPPEN.lijst.length-1].ms=Math.round(nu-STAPPEN.vorig);
  const uit={totaal:Math.round(nu-STAPPEN.t0),lijst:STAPPEN.lijst.filter(x=>x.ms>=50)};
  STAPPEN=null;return uit;
}
// Onder het antwoord: waar ging de tijd heen? Voor lokale modellen stond dit er al; nu ook voor
// de cloudproviders, want zonder die regel is "traag" niet toe te wijzen aan een stap.
function toonStappen(turn,m){
  if(!m||!turn||!m.lijst.length)return;
  const bubble=turn.querySelector(".bubble.antwoord");if(!bubble)return;
  const el=document.createElement("div");el.className="meting";
  const sec=x=>(x/1000).toFixed(1)+"s";
  el.textContent=sec(m.totaal)+" · "+m.lijst.map(x=>x.naam.toLowerCase()+" "+sec(x.ms)).join(" · ");
  bubble.appendChild(el);
}
// ---- Het generatieve antwoord zien ontstaan --------------------------------------------------
// Eén keer het hele blok neerzetten (mét de citaten eronder), daarna alleen nog de alinea's in
// .ans-gen bijwerken. Niet opnieuw renderen: dan springt alles wat eronder staat elke keer mee.
function schrijfLive(turn,uit,alineas){
  let vak=turn.querySelector(".ans-gen");
  if(!vak){
    // Eerste keer: zet het antwoord neer met een leeg generatief blok, zodat er een plek is om
    // in te schrijven. De rest van het antwoord staat er dan al en beweegt daarna niet meer.
    renderResult(turn,Object.assign({},uit,{generatief:[{tekst:"",bronnen:[]}]}),true);
    vak=turn.querySelector(".ans-gen");
    if(!vak)return;
  }
  const oud=vak.querySelectorAll(".gen-p");
  // Bestaande alinea's bijwerken, nieuwe erbij. Zo blijft de tekst staan waar hij staat.
  alineas.forEach((t,i)=>{
    if(oud[i]){if(oud[i].textContent!==t)oud[i].textContent=t;return;}
    const p=document.createElement("p");p.className="gen-p";p.textContent=t;vak.appendChild(p);
  });
  for(let i=alineas.length;i<oud.length;i++)oud[i].remove();
}
function renderResult(turn,r,voorlopig){
  const badge=r.demo?'<span class="badge demo">DEMO</span>':'<span class="badge ai">AI</span>';
  const hasCites=r.citations&&r.citations.length;
  let h=`<div class="bubble antwoord">`;
  // De intro herformuleert de vraag al; toon dan GEEN losse 'Je vraag:'-regel meer.
  // Zonder intro (demo-modus of geen antwoord) tonen we de vraag wél als context.
  const clar=r.clarifications||[];
  const num={};(r.used||[]).forEach((s,i)=>{num[s.url]=i+1;});
  if(hasCites){
    // Eén doorlopend stuk: AI-tekst en citaat wisselen elkaar af, elk met een streepje en
    // alleen de eerste keer een label (AI / NWW). Zo lees je van boven naar beneden af wie
    // wat zegt, zonder dat het uiteenvalt in losse blokken.
    let eersteAI=true,eersteCit=true;
    // Demo-modus levert geen AI-tekst; toon dan de vraag als context, anders begint het
    // antwoord zonder aanloop.
    if(!r.intro&&!r.citations.some(c=>c.bridge))h+=`<div class="restated-sub"><span class="rs-label">Je vraag:</span> ${escapeHtml(r.restated_question)} ${badge}</div>`;
    for(const blok of answerBlocks(r)){
      if(blok.type==="generated"){
        const lab=eersteAI?"AI":"";eersteAI=false;
        const alineas=blok.alineas.map(a=>{
          const chips=a.bronnen.map(n=>`<button type="button" class="cite-chip" data-ci="${n-1}" title="Bekijk de passage op de bronpagina">${n}</button>`).join("");
          return `<p class="gen-p">${escapeHtml(a.tekst)} ${chips}</p>`;
        }).join("");
        h+=`<div class="ans-row"><span class="ans-lab">${lab}</span><div class="ans-gen">`
          +`<span class="gen-label">door AI geschreven op basis van de bronnen hieronder</span>${alineas}</div></div>`;
        continue;
      }
      if(blok.type==="bridge"){
        const lab=eersteAI?"AI":"";eersteAI=false;
        const alineas=blok.alineas.map((t,n)=>`<p class="${n===0?"intro":"brug"}">${escapeHtml(t)}</p>`).join("");
        h+=`<div class="ans-row"><span class="ans-lab">${lab}</span><div class="ans-ai">${alineas}</div></div>`;
        continue;
      }
      const i=blok.ci,n=num[blok.sourceUrl]||(i+1);
      const lab=eersteCit?"NWW":"";eersteCit=false;
      if(blok.alleenBron){
        // Generatieve modus: alleen de bronkaart, genummerd zoals in de tekst.
        h+=`<div class="passage bron-only" data-ci="${i}"><span class="ans-lab"></span><div class="cite-col">`
          +`<div class="src-card" data-ci="${i}" role="button" tabindex="0" title="Bekijk dit stuk op de bronpagina">`
            +`<span class="src-badge">${i+1}</span>`
            +`<span class="src-info">${ICON_DOC}<span class="src-title">${escapeHtml(blok.sourceTitle||"Bron")}</span></span>`
            +`<span class="src-go">Lees verder op de pagina →</span>`
          +`</div></div></div>`;
        continue;
      }
      h+=`<div class="passage ${blok.verified?'verified':'unverified'}" data-ci="${i}">`
        +`<span class="ans-lab">${lab}</span><div class="cite-col">`
        +`<button class="copy-cite" data-ci="${i}" title="Kopieer dit citaat" aria-label="Kopieer dit citaat">${ICON_COPY}</button>`
        +`<div class="cite-body clickable-cite" data-ci="${i}" title="Klik om dit stuk op de bronpagina te bekijken">${citeBodyHTML(r.citations[i])}</div>`
        +`<div class="src-card" data-ci="${i}" role="button" tabindex="0" title="Bekijk dit stuk op de bronpagina">`
          +`<span class="src-badge">${n}</span>`
          +`<span class="src-info">${ICON_DOC}<span class="src-title">${escapeHtml(blok.sourceTitle||"Bron")}</span></span>`
          +`<span class="src-go">Lees verder op de pagina →</span>`
        +`</div></div></div>`;
    }
  }else{
    h+=`<div class="restated-sub"><span class="rs-label">Je vraag:</span> ${escapeHtml(r.restated_question)} ${badge}</div>`;
    // Zonder citaat is de melding HET antwoord, dus die staat hier — niet ook nog eens in een
    // oranje regel eronder. Dat was dubbelop: "Geen antwoord gevonden" plus dezelfde mededeling
    // in andere woorden.
    h+=`<div class="no-answer">${escapeHtml(r.note||GEEN_INFO)}</div>`;
  }
  // De losse melding blijft alleen bestaan naast een echt antwoord (bv. "dit antwoord was
  // mogelijk niet volledig" of een onbeantwoord deel van een samengestelde vraag).
  if(hasCites&&r.note)h+=`<div class="note">${escapeHtml(r.note)}</div>`;
  // Footer: vervolgvragen (Perplexity-stijl) en acties.
  let f="";
  // Eén lijst met alles wat de voorlichter nu kan doen. Bovenaan de vragen die hij aan de
  // burger stelt om een preciezer antwoord te krijgen — die staan voorop omdat ze het antwoord
  // écht beter maken, en zijn herkenbaar aan een geel streepje en een potlood.
  const fups=r.followups||[];
  const uitvraag=hasCites?clar:[];
  if(uitvraag.length||fups.length){
    f+=`<div class="followups"><span class="label">Vervolgvragen</span><ul class="fup-list">`;
    uitvraag.forEach(c=>{f+=`<li><button class="fup-row clar-row" data-prefill="${escapeHtml(c.prefill||c.question)}" title="Zet deze vraag in het invoerveld om aan te vullen"><span class="fup-q">${escapeHtml(c.question)}</span><span class="fup-plus">${ICON_PENCIL}</span></button></li>`;});
    fups.forEach(fu=>{f+=`<li><button class="fup-row" data-q="${escapeHtml(fu)}"><span class="fup-q">${escapeHtml(fu)}</span><span class="fup-plus">${ICON_ARROW}</span></button></li>`;});
    f+=`</ul></div>`;
  }
  if(!hasCites&&r.related&&r.related.length)f+=`<details class="section"><summary><span class="label">Misschien ook relevant</span></summary>${sourceList(r.related)}</details>`;
  if(hasCites)f+=`<div class="consulted">Bron geraadpleegd op ${consultDate()}</div>`;
  // Bij een tussenstand nog geen kopieerknop en geen duimpjes: het antwoord is niet af, dus
  // kopiëren levert een half citaat op en een oordeel slaat nergens op. In plaats daarvan een
  // regel die zegt dat er nog iets komt.
  if(voorlopig){
    f+=`<div class="answer-actions"><span class="nog-bezig">Nog bezig met schrijven…</span></div>`;
  }else{
    f+=`<div class="answer-actions">`;
    if(hasCites)f+=`<button class="act-btn copy-answer" title="Zet het antwoord, het citaat en de bronlink op het klembord">${ICON_COPY}<span>Kopieer antwoord</span></button>`;
    f+=`<span class="spacer"></span><span class="feedback">Klopt dit?<button class="fb-btn fb-up" title="Ja, bruikbaar" aria-label="Goed antwoord">👍</button><button class="fb-btn fb-down" title="Nee, niet goed" aria-label="Niet goed">👎</button></span></div>`;
  }
  h+=`<div class="answer-footer">${f}</div></div>`;
  const slot=turn.querySelector(".slot");slot.innerHTML=h;
  slot.querySelectorAll(".followups button").forEach(b=>{
    const pre=b.getAttribute("data-prefill");
    b.onclick=pre?(()=>prefill(pre)):(()=>askText(b.getAttribute("data-q")));
  });
  slot.querySelectorAll(".copy-cite").forEach(b=>b.onclick=e=>{e.stopPropagation();copyText(r.citations[+b.getAttribute("data-ci")].text,b);});
  const openCite=el=>{const c=r.citations[+el.getAttribute("data-ci")];if(c)openViewer(c.srcIdx,c.text,c.src&&c.src.url,c.src&&c.src.title);};
  slot.querySelectorAll(".cite-chip").forEach(el=>el.onclick=e=>{e.stopPropagation();openCite(el);});
  slot.querySelectorAll(".cite-body.clickable-cite, .src-card").forEach(el=>{
    el.onclick=e=>{if(e.target.closest(".copy-cite")||e.target.closest("a"))return;openCite(el);};
    el.onkeydown=e=>{if((e.key==="Enter"||e.key===" ")&&el.classList.contains("src-card")){e.preventDefault();openCite(el);}};
  });
  const ca=slot.querySelector(".copy-answer");if(ca)ca.onclick=()=>copyText(answerPlainText(r),ca);
  const up=slot.querySelector(".fb-up"),dn=slot.querySelector(".fb-down");
  if(up)up.onclick=()=>logFeedback(r,1,up);
  if(dn)dn.onclick=()=>logFeedback(r,-1,dn);
  turn.scrollIntoView({behavior:"smooth",block:"end"});
}
function escapeHtml(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}

/* ---- Bron-viewer: toont de paginatekst met het citaat gearceerd + link naar de live pagina ---- */
const viewerEl=document.getElementById("viewer"),viewerTitle=document.getElementById("viewer-title"),
  viewerOpen=document.getElementById("viewer-open"),viewerBody=document.getElementById("viewer-body"),
  viewerClose=document.getElementById("viewer-close"),viewerBackdrop=document.getElementById("viewer-backdrop");
let viewerLastFocus=null;
// Maak van een zin een whitespace-tolerant patroon (spatie/nieuwe regel maken niet uit).
function rxPhrase(p){return p.trim().replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/\s+/g,"\\s+");}
// Zoek het citaat-bereik [start,eind) in de paginatekst. Valt terug op begin..eind als de hele passage niet 1-op-1 matcht.
function matchRange(fullText,quote){
  let m=null;const q=(quote||"").trim();
  if(q){
    try{m=new RegExp(rxPhrase(q)).exec(fullText);}catch(e){}
    if(!m){
      const w=q.split(/\s+/);
      if(w.length>=8){try{m=new RegExp(rxPhrase(w.slice(0,4).join(" "))+"[\\s\\S]*?"+rxPhrase(w.slice(-4).join(" "))).exec(fullText);}catch(e){}}
    }
  }
  return m?[m.index,m.index+m[0].length]:[-1,-1];
}
// Nederlandse functiewoorden: eindigt een regel hierop, dan loopt de zin door (link-fragmentatie samenvoegen).
const VW_FUNC=new Set("in op aan om de het een te voor van met bij uit naar of en dat die dan als tot over per is was zijn wordt worden deze dit door tussen onder boven na vanaf sinds tijdens zonder tegen volgens binnen buiten dan ook niet wel maar want omdat zodat zoals u we ik hij zij ze hun haar onze ons".split(" "));
// Bepaalt of 'cur' een voortzetting is van de vorige regel (dan samenvoegen tot één alinea).
function isContinuation(prev,cur){
  const c=cur.replace(/^\s+/,"");if(!c)return false;
  if(/^[a-zà-öø-ÿ]/.test(c))return true;                       // begint met kleine letter
  if(/^[,;:.?!)\]»’'"+–—\/-]/.test(c))return true;   // begint met leesteken/sluiting
  if(/^\(/.test(c))return true;                                 // begint met haakje openen
  const p=prev.replace(/\s+$/,"");
  if(/[(\[«\/–—-]$/.test(p))return true;             // vorige eindigt op open haakje/streepje
  const m=p.toLowerCase().match(/([a-zà-öø-ÿ]+)$/);
  if(m&&VW_FUNC.has(m[1]))return true;                          // vorige eindigt op een functiewoord
  return false;
}
// Render de paginatekst als een echte pagina: losse regels worden samengevoegd tot alinea's,
// H2-koppen worden uitklapbare secties (de sectie met het citaat staat open) en het citaat blijft geel.
function buildSourceHTML(fullText,quote,headings,links){
  // Maak hrefs absoluut en linkify de (geëscapete) tekst met de echte pagina-links.
  const linkHref=h=>/^https?:|^mailto:|^tel:/i.test(h)?h:(h&&h[0]==="/"?"https://www.nederlandwereldwijd.nl"+h:h);
  const linkList=(links||[]).filter(l=>l&&l[0]&&l[0].length>=5).map(l=>[escapeHtml(l[0]),linkHref(l[1])]).sort((a,b)=>b[0].length-a[0].length);
  function linkify(escd){
    if(!linkList.length)return escd;
    const ms=[];for(const [et,href] of linkList){const i=escd.indexOf(et);if(i>=0)ms.push([i,et.length,href]);}
    ms.sort((a,b)=>a[0]-b[0]);
    let r="",pos=0,end=-1;
    for(const [i,len,href] of ms){if(i<end)continue;r+=escd.slice(pos,i)+`<a class="vlink" href="${escapeHtml(href)}" target="_blank" rel="noreferrer">`+escd.slice(i,i+len)+`</a>`;pos=i+len;end=pos;}
    return r+escd.slice(pos);
  }
  const [ms,me]=matchRange(fullText,quote);
  const openAll=ms<0; // citaat niet gevonden -> alles open tonen
  const hmap=new Map();(headings||[]).forEach(([lvl,t])=>{if(t&&!hmap.has(t))hmap.set(t,lvl);});
  const lines=fullText.split("\n");
  const starts=[];let off=0;for(const l of lines){starts.push(off);off+=l.length+1;}
  // 1) Blokken: kop, of samengevoegde alinea (char-offsets blijven 1:1 omdat \n -> spatie).
  const blocks=[];let i=0;
  while(i<lines.length){
    const line=lines[i],s=starts[i],e=s+line.length,lvl=hmap.get(line);
    if(lvl){blocks.push({h:lvl,s,e});i++;continue;}
    if(!line.trim()){i++;continue;}
    let pe=e,last=line,j=i+1;
    while(j<lines.length){const nl=lines[j];if(hmap.get(nl)||!nl.trim())break;if(!isContinuation(last,nl))break;pe=starts[j]+nl.length;last=nl;j++;}
    blocks.push({h:0,s,e:pe});i=j;
  }
  // 2) Render een tekstbereik met gele markering van het citaat (\n -> spatie).
  let firstMark=true;
  const span=(s,e)=>{
    if(me<0||ms>=e||me<=s)return linkify(escapeHtml(fullText.slice(s,e).replace(/\n/g," ")));   // geen markering: wel links
    // Bevat het citaat: markering behouden, geen links erin (houdt de gele passage schoon).
    const a=Math.max(ms,s)-s,b=Math.min(me,e)-s,str=fullText.slice(s,e);const id=firstMark?' id="hl"':'';firstMark=false;
    return (escapeHtml(str.slice(0,a))+'<mark class="hl"'+id+'>'+escapeHtml(str.slice(a,b))+'</mark>'+escapeHtml(str.slice(b))).replace(/\n/g," ");
  };
  const hits=(s,e)=>me>s&&ms<e;
  // 3) Net als op NederlandWereldwijd: H2 = zichtbare sectiekop, H3 = uitklapper (accordeon).
  //    De uitklapper met het gele citaat staat automatisch open.
  let out="",acc=null;
  const flushAcc=()=>{if(acc){out+=`<details class="vacc"${(acc.hit||openAll)?" open":""}><summary class="vh vh3">${acc.sum}</summary><div class="vacc-body">${acc.body}</div></details>`;acc=null;}};
  for(const b of blocks){
    if(b.h===3){flushAcc();acc={sum:span(b.s,b.e),body:"",hit:hits(b.s,b.e)};}
    else if(b.h===2){flushAcc();out+=`<div class="vh vh2">${span(b.s,b.e)}</div>`;}
    else if(b.h===1){flushAcc();out+=`<div class="vh vh1">${span(b.s,b.e)}</div>`;}
    else{const piece=`<p class="vp">${span(b.s,b.e)}</p>`;if(acc){acc.body+=piece;if(hits(b.s,b.e))acc.hit=true;}else out+=piece;}
  }
  flushAcc();
  return {html:out,found:ms>=0};
}
// Bouw een URL met text-fragment, zodat de browser op de live pagina naar het citaat springt en het markeert.
// Belangrijk: een text-fragment kan niet over een blok-grens (kop -> paragraaf) heen matchen.
// We strippen daarom eventuele kop-regels uit het citaat en gebruiken alleen woorden uit de lopende tekst.
function textFragmentUrl(url,quote,headings){
  if(!url)return "#";
  let q=(quote||"").trim();if(!q)return url;
  const hset=new Set((headings||[]).map(h=>h[1]));
  const lines=q.split(/\n+/).map(s=>s.trim()).filter(s=>s&&!hset.has(s));
  q=(lines.join(" ").replace(/\s+/g," ")||q.replace(/\s+/g," ")).trim();
  const w=q.split(" ");
  const frag=w.length<=10?encodeURIComponent(q):encodeURIComponent(w.slice(0,6).join(" "))+","+encodeURIComponent(w.slice(-6).join(" "));
  return url+"#:~:text="+frag;
}
function openViewer(srcIdx,quote,url,title){
  const page=Number.isInteger(srcIdx)?CORPUS[srcIdx]:null;
  const text=page?page.text:"";
  const built=buildSourceHTML(text,quote,page&&page.headings,page&&page.links);
  viewerTitle.textContent=title||(page&&page.title)||"Bronpagina";
  viewerOpen.href=textFragmentUrl(url||(page&&page.url),quote,page&&page.headings);
  viewerBody.innerHTML=(built.found?"":'<div class="viewer-note">Dit citaat kon niet exact op de pagina worden gemarkeerd; hieronder staat de volledige paginatekst.</div>')+built.html;
  viewerLastFocus=document.activeElement;
  document.body.classList.add("viewer-active");viewerEl.setAttribute("aria-hidden","false");viewerBackdrop.hidden=false;
  // Scroll ALLEEN de viewer-body naar het citaat (niet het hele document — dat veroorzaakte reflow).
  requestAnimationFrame(()=>{const hl=viewerBody.querySelector("#hl");
    if(hl){const hr=hl.getBoundingClientRect(),br=viewerBody.getBoundingClientRect();viewerBody.scrollTop+=(hr.top-br.top)-br.height/2+hr.height/2;}
    else viewerBody.scrollTop=0;});
  viewerClose.focus();
}
function closeViewer(){document.body.classList.remove("viewer-active");viewerEl.setAttribute("aria-hidden","true");viewerBackdrop.hidden=true;if(viewerLastFocus&&viewerLastFocus.focus)viewerLastFocus.focus();}
viewerClose.addEventListener("click",closeViewer);
viewerBackdrop.addEventListener("click",closeViewer);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&document.body.classList.contains("viewer-active"))closeViewer();});
</script>
