<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Leo (voorlichter assistent) — NederlandWereldwijd (testomgeving)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
<style>
:root{
  /* Rijksoverheid-palet, in lijn met het avatar-icoon (blauwe pet, navy contouren, gele hond) */
  --rijk-blauw:#154273;   /* ro-darker  – header, koppen */
  --rijk-licht:#007bc7;   /* ro-blue    – links, accenten */
  --rijk-donker:#01689b;  /* ro-dark    – hover */
  --cap-blauw:#007bc7;    /* pet-blauw  – bronverwijzingen */
  --geel:#ffb612;         /* ro-yellow  – icoon-accent */
  --oranje:#e17000;       /* ro-orange */
  --groen:#39870c;        /* ro-green */
  --rood:#d52b1e;         /* ro-red */
  --vraag-bg:#d9ebf7;     /* ro-lighter – vraagbubbel */
  --vraag-tekst:#154273;
  --blauw-bg:#e6f0f7;     /* ro-bg      – lichte blauwe vlakken */
  --blauw-licht:#b3d7ee;  /* ro-light   – zachte blauwe randen */
  --grijs:#f3f3f3;        /* bg-alt */
  --rand:#e5e5e5;         /* line-light */
  --rand-sterk:#c9c9c9;   /* line */
  --ink:#333333;
  --ink-licht:#696969;
}
*{box-sizing:border-box;}
body{margin:0;font-family:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.6;background:#eef1f5;color:var(--ink);-webkit-font-smoothing:antialiased;}
html,body{height:100%;overflow:hidden;}
.layout{display:flex;height:100vh;width:100%;overflow:hidden;background:#fff;}
/* Bovenbalk: merk links, zoekgebied + tandwiel rechts. De zijbalk is vervallen — die droeg
   alleen de naam en de instellingenknop, en beide passen hier. */
.brand-logo{width:32px;height:32px;border-radius:50%;flex:0 0 32px;object-fit:cover;border:1px solid var(--rand);background:#fff;}
.brand-text{min-width:0;display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;}
.brand-text h1{margin:0;font-size:1rem;font-weight:700;color:var(--rijk-blauw);line-height:1.2;white-space:nowrap;}
.brand-sub{font-weight:400;font-size:.82em;color:var(--ink-licht);}
.brand-text p{margin:0;font-size:.74rem;color:var(--ink-licht);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.settings-btn{display:inline-flex;align-items:center;gap:7px;background:transparent;color:var(--ink-licht);border:1px solid transparent;border-radius:9px;padding:6px 9px;font-size:.85rem;font-family:inherit;cursor:pointer;transition:background .12s,color .12s,border-color .12s;}
.settings-btn:hover{background:var(--blauw-bg);color:var(--rijk-blauw);}
.settings-btn[aria-expanded="true"]{background:var(--blauw-bg);color:var(--rijk-blauw);border-color:var(--blauw-licht);}
/* Chat-kolom */
.chat{flex:1;display:flex;flex-direction:column;min-width:0;background:#fff;}
.chat-topbar{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--rand);background:#fff;}
.topbar-spacer{flex:1;}
.keybar.hidden{display:none;}
.keybar{background:var(--grijs);color:var(--ink);padding:14px 20px;font-size:.82rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--rand);}
.keybar select,.keybar input{padding:8px 10px;border:1px solid var(--rand);border-radius:8px;font-size:.85rem;background:#fff;color:var(--ink);font-family:inherit;}
.keybar input{flex:1;min-width:180px;}
/* Zoekgebied staat in de bovenbalk: je moet kunnen zien dat een filter aanstaat. */
.filterbar{display:flex;gap:7px;align-items:center;font-size:.82rem;}
.filterbar-label{color:var(--ink-licht);font-weight:600;}
.filterbar select{padding:5px 8px;border:1px solid var(--rand);border-radius:8px;font-size:.8rem;background:#fff;color:var(--ink);font-family:inherit;max-width:150px;}
.filterbar select:not([data-all]){border-color:var(--rijk-licht);color:var(--rijk-blauw);font-weight:600;}
.filter-clear{background:none;border:none;color:var(--ink-licht);cursor:pointer;font-family:inherit;font-size:.78rem;text-decoration:underline;}
.filter-clear:hover{color:var(--rood);}
.keybar a{color:var(--rijk-licht);font-size:.78rem;white-space:nowrap;font-weight:600;}
.keybar .status{font-size:.78rem;width:100%;color:var(--ink-licht);}
.keybar .status.build{width:auto;opacity:.55;font-size:.72rem;}
.fb-export{background:none;border:none;padding:0;font-family:inherit;font-size:.72rem;color:var(--ink-licht);cursor:pointer;text-decoration:underline;}
.fb-export:hover{color:var(--rijk-licht);}
.conversation{flex:1;padding:32px 28px;overflow-y:auto;}
/* Welkomststaat: begroeting + composer samen verticaal gecentreerd (zoals ChatGPT) */
body.is-welcome .conversation{flex:0 0 auto;margin-top:auto;overflow:visible;padding-bottom:8px;}
body.is-welcome .composer{margin-bottom:auto;}
body.is-welcome .welcome{margin-top:0;}
body.is-welcome .empty{margin-top:0;}
.empty{color:var(--ink-licht);font-style:italic;text-align:center;margin-top:8vh;}
.samples{margin-top:18px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:680px;margin-left:auto;margin-right:auto;}
.samples button{background:#fff;border:1px solid var(--rand);border-radius:14px;padding:10px 16px;font-size:.88rem;cursor:pointer;color:var(--rijk-blauw);font-family:inherit;transition:background .12s,border-color .12s,transform .08s;}
.samples button:hover{background:var(--blauw-bg);border-color:var(--blauw-licht);transform:translateY(-1px);}
.label{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-licht);margin-bottom:4px;}
.turn{max-width:860px;margin:0 auto 22px;}
.row{display:flex;margin-bottom:14px;gap:12px;align-items:flex-start;animation:msg-in .28s ease both;}
.row.user{justify-content:flex-end;}
@keyframes msg-in{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.bubble{position:relative;max-width:80%;padding:12px 16px;border-radius:18px;line-height:1.55;}
.bubble.vraag{background:var(--vraag-bg);color:var(--vraag-tekst);font-weight:600;border-bottom-right-radius:6px;}
.avatar{width:38px;height:38px;border-radius:50%;flex:0 0 38px;background:#fff;border:1px solid var(--rand);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:20px;margin-top:2px;}
.avatar img{width:100%;height:100%;object-fit:cover;transform:scale(1.18);}
.bubble.antwoord{background:#fff;border:1px solid var(--rand);border-radius:18px;border-top-left-radius:6px;max-width:88%;padding:16px 18px;box-shadow:0 1px 2px rgba(20,40,70,.04);}
.restated-sub{font-size:.86rem;color:var(--ink-licht);margin:0 0 12px;line-height:1.45;}
.restated-sub .rs-label{font-weight:600;}
/* DOORLOPEND ANTWOORD.
   Het antwoord is één lopend stuk: eerst wat de AI van de vraag maakt en een zin die naar het
   citaat toe leidt, dan het letterlijke citaat. Links een smalle kolom met AI / NWW, daarnaast
   een streepje. Grijs = door de AI geformuleerd, blauw = letterlijk van de site. Het label staat
   er alleen de EERSTE keer per soort; daarna doen het streepje en het lichte vlak het werk. */
.ans-row{display:grid;grid-template-columns:34px 1fr;}
.ans-lab{font-size:.62rem;font-weight:700;letter-spacing:.06em;text-align:right;padding:4px 9px 0 0;line-height:1.6;user-select:none;color:#6c7681;}
.ans-ai{border-left:3px solid #b3bac2;padding:3px 0 3px 15px;min-width:0;}
.ans-row + .ans-row .ans-ai{padding-top:0;}
.intro{font-size:.95rem;color:var(--ink);margin:0;line-height:1.55;}
.brug{font-size:.95rem;color:var(--ink);margin:9px 0 0;line-height:1.55;}
/* Passage = één citaat als nette, gestructureerde tekst met een bron-kaartje eronder */
.passage{display:grid;grid-template-columns:34px 1fr;margin:0;}
.passage .ans-lab{color:#2a6f9e;padding-top:12px;}
.cite-col{position:relative;min-width:0;padding-top:9px;}
.ans-row + .passage .cite-col{padding-top:8px;}
.cite-body{border-left:3px solid #7fb4d8;background:#f6fafd;border-radius:0 6px 6px 0;padding:9px 40px 9px 15px;}
.passage.unverified .cite-body{border-left-color:var(--oranje);background:#fff8f0;}
.cite-body.clickable-cite{cursor:pointer;transition:background .12s;}
.cite-body.clickable-cite:hover{background:var(--blauw-bg);}
.cite-h{font-weight:700;color:var(--rijk-blauw);font-size:1.04rem;margin:0 0 5px;line-height:1.3;}
.cite-h:not(:first-child){margin-top:12px;}
.cite-p{margin:0 0 7px;line-height:1.6;}
.cite-p:last-child{margin-bottom:0;}
/* Bron-kaartje direct onder de passage (bron dicht bij de bewering) */
.src-card{display:inline-flex;align-items:center;gap:8px;margin:9px 0 2px 15px;padding:6px 10px 6px 7px;border:1px solid var(--rand);border-radius:12px;background:#fff;cursor:pointer;max-width:100%;transition:background .12s,border-color .12s;}
.src-card:hover{background:var(--blauw-bg);border-color:var(--blauw-licht);}
.src-badge{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:var(--rijk-licht);color:#fff;font-size:.72rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center;}
.passage.unverified .src-badge{background:var(--oranje);}
.src-info{display:inline-flex;align-items:center;gap:5px;min-width:0;color:var(--rijk-blauw);}
.src-title{font-weight:600;font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px;}
.src-go{font-size:.78rem;color:var(--ink-licht);white-space:nowrap;}
.src-live{flex:0 0 auto;margin-left:2px;color:var(--ink-licht);text-decoration:none;font-size:.95rem;padding:0 3px;border-radius:6px;}
.src-live:hover{color:var(--rijk-licht);}
ol.srclist{margin:4px 0 0;padding-left:20px;}
ol.srclist li{margin:2px 0;}
.note{font-size:.85rem;color:var(--oranje);margin:10px 0;}
.no-answer{color:#666;margin-bottom:12px;}
.section{margin-top:16px;font-size:.9rem;}
.section ul{margin:4px 0 0;padding-left:18px;}
.section .label{margin-bottom:6px;}
/* Verduidelijkingen: zelfde rij-stijl als vervolgvragen, maar met blauwe tint = nog uit te vragen */
.clarify{margin:18px 0 4px;padding:10px 14px 4px;background:var(--blauw-bg);border:1px solid var(--blauw-licht);border-radius:12px;}
.clarify .label{color:var(--rijk-blauw);}
.clarify .fup-list{border-top-color:var(--blauw-licht);}
.clarify .fup-row{border-bottom-color:var(--blauw-licht);color:var(--rijk-blauw);}
.clarify .fup-row:last-child{border-bottom:none;}
.clarify .fup-row:hover{color:var(--rijk-blauw);}
.clarify .fup-row:hover .fup-plus{background:#fff;}
/* Vervolgvragen als Perplexity-achtige lijst: volle breedte, scheidingslijntjes, plus-icoon rechts */
.followups{margin-top:18px;}
.fup-list{list-style:none;margin:8px 0 0;padding:0;border-top:1px solid var(--rand);}
.fup-list li{margin:0;}
.fup-row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--rand);padding:13px 2px;cursor:pointer;font-family:inherit;font-size:.95rem;color:var(--ink);transition:color .12s;}
.fup-row:hover{color:var(--rijk-licht);}
.fup-q{flex:1;line-height:1.4;}
.fup-plus{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;color:var(--rijk-licht);transition:background .12s;}
.fup-row:hover .fup-plus{background:var(--blauw-bg);}
a{color:var(--rijk-licht);}
.loading{margin-top:12px;color:#555;font-style:italic;}
.error{margin-top:12px;color:var(--rood);}
.composer{padding:12px 24px 20px;background:linear-gradient(to top,#fff 70%,rgba(255,255,255,0));position:sticky;bottom:0;}
.suggest{max-width:860px;margin:0 auto 8px;background:#fff;border:1px solid var(--rand);border-radius:14px;box-shadow:0 4px 16px rgba(20,40,70,.1);overflow:hidden;}
.suggest-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--rand);padding:10px 14px;font-family:inherit;font-size:.9rem;color:var(--ink);cursor:pointer;}
.suggest-item:last-child{border-bottom:none;}
.suggest-item:hover{background:var(--blauw-bg);color:var(--rijk-blauw);}
.suggest-ic{opacity:.55;font-size:.85rem;}
.composer-pill{display:flex;align-items:center;gap:8px;max-width:860px;margin:0 auto;background:#fff;border:1.5px solid var(--rand);border-radius:26px;padding:5px 6px 5px 18px;box-shadow:0 2px 12px rgba(20,40,70,.07);transition:border-color .15s,box-shadow .15s;}
.composer-pill:focus-within{border-color:var(--rijk-licht);box-shadow:0 3px 16px rgba(0,123,199,.15);}
.composer input{flex:1;padding:10px 0;border:none;outline:none;font-size:1rem;background:transparent;font-family:inherit;color:var(--ink);}
.send-btn{flex:0 0 auto;height:40px;padding:0 16px;border-radius:20px;gap:7px;background:var(--rijk-licht);color:#fff;border:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font:inherit;font-size:.9rem;font-weight:600;transition:background .12s,transform .08s;}
/* "Nieuw gesprek" staat naast Verstuur: daar neem je de beslissing om de context los te laten. */
.pill-btn{flex:0 0 auto;height:40px;padding:0 14px;border-radius:20px;gap:7px;background:#fff;color:var(--ink);border:1.5px solid var(--rand-sterk);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font:inherit;font-size:.9rem;font-weight:600;transition:border-color .12s,color .12s,background .12s;}
.pill-btn:hover{border-color:var(--rijk-licht);color:var(--rijk-blauw);background:var(--blauw-bg);}
.pill-btn[hidden]{display:none;}
.mic-btn{flex:0 0 auto;width:40px;height:40px;border-radius:50%;background:#f0f3f7;color:var(--ink-licht);border:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background .12s,color .12s;}
.mic-btn:hover{background:var(--blauw-bg);color:var(--rijk-blauw);}
.mic-btn.rec{background:#fde7e7;color:#c62828;animation:micpulse 1.4s infinite;}
@keyframes micpulse{0%{box-shadow:0 0 0 0 rgba(198,40,40,.55);}70%{box-shadow:0 0 0 10px rgba(198,40,40,0);}100%{box-shadow:0 0 0 0 rgba(198,40,40,0);}}
.mic-status{max-width:860px;margin:0 auto 8px;padding:8px 14px;border-radius:10px;font-size:.85rem;background:var(--blauw-bg);color:var(--rijk-blauw);border:1px solid var(--blauw-licht);}
.mic-status.mic-rec{background:#fff5f5;color:#c62828;border-color:#f6c8c8;}
.mic-status.mic-warn{background:#fff8e6;color:#7a5a00;border-color:#f0dfa0;}
.mic-status.mic-error{background:#fde7e7;color:#a01818;border-color:#f0b8b8;}
.mic-status[hidden]{display:none;}
/* Ambient luistermodus */
.listen{max-width:860px;margin:0 auto;}
.listen-head{position:sticky;top:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;padding:12px 2px;border-bottom:1px solid var(--rand);margin-bottom:14px;z-index:2;}
.listen-badge{display:inline-flex;align-items:center;gap:6px;background:#fde7e7;color:#c62828;font-weight:700;font-size:.82rem;padding:4px 10px;border-radius:14px;animation:micpulse 1.6s infinite;}
.listen-msg{flex:1;min-width:160px;color:var(--ink-licht);font-size:.86rem;line-height:1.4;}
.listen-stop{flex:0 0 auto;background:#fff;border:1px solid var(--rand);border-radius:16px;padding:6px 14px;font-family:inherit;font-size:.82rem;color:var(--rijk-blauw);cursor:pointer;}
.listen-stop:hover{background:var(--blauw-bg);border-color:var(--blauw-licht);}
.listen-transcript{min-height:26px;margin:0 0 16px;font-size:1rem;line-height:1.5;color:var(--ink);}
.listen-transcript .lt-final{color:var(--ink);}
.listen-transcript .lt-partial{color:var(--ink-licht);}
.listen-hint{color:var(--ink-licht);font-style:italic;padding:6px 0;}
.listen-quotes{display:flex;flex-direction:column;gap:12px;}
/* Hoofdantwoord: gekleurd accentvlak met badge, volledige alinea */
.listen-hero{text-align:left;background:var(--blauw-bg);border:1px solid var(--blauw-licht);border-left:5px solid var(--rijk-licht);border-radius:12px;padding:18px 20px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;gap:12px;transition:background .12s,border-color .12s;}
.listen-hero:hover{background:#e0eefa;border-color:var(--rijk-licht);}
.listen-hero .lh-label{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;background:var(--rijk-licht);color:#fff;font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:4px 11px;border-radius:12px;}
.listen-hero .lh-quote{font-size:1.1rem;line-height:1.62;color:var(--ink);}
.listen-hero .lh-src{display:inline-flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:.86rem;font-weight:600;color:var(--rijk-blauw);}
.listen-hero .lh-go{font-weight:400;color:var(--ink-licht);font-size:.8rem;}
.listen-alts-label{font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-licht);margin:6px 0 -2px;}
.listen-hero .lh-ai{background:#fff;color:var(--rijk-licht);border:1px solid var(--blauw-licht);border-radius:10px;padding:1px 7px;font-size:.66rem;margin-left:6px;}
/* Instellingen van de luistermodus */
.listen-ai{margin:0 0 14px;border:1px solid var(--rand);border-radius:10px;background:var(--grijs);}
.listen-ai>summary{cursor:pointer;padding:9px 14px;font-size:.85rem;font-weight:600;color:var(--rijk-blauw);list-style:none;}
.listen-ai>summary::-webkit-details-marker{display:none;}
.listen-ai>summary em{font-weight:400;color:var(--ink-licht);font-style:normal;font-size:.8rem;}
.lai-body{padding:2px 14px 12px;}
.lai-opt{display:flex;align-items:flex-start;gap:9px;padding:6px 0;font-size:.88rem;cursor:pointer;}
.lai-opt input{margin-top:4px;flex:0 0 auto;}
.lai-opt input:disabled+span{opacity:.5;}
.lai-hint{color:var(--ink-licht);font-size:.82rem;}
/* Statusbalk van de gekozen modus */
.listen-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--grijs);border:1px solid var(--rand);border-radius:10px;padding:9px 14px;margin:0 0 14px;font-size:.86rem;}
.listen-bar:empty{display:none;}
.listen-bar .lb-info{flex:1;min-width:170px;color:var(--ink-licht);}
.listen-bar .pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--rand);border-radius:12px;padding:3px 10px;font-size:.78rem;color:var(--ink-licht);}
.listen-bar .pill.groen{color:var(--groen);border-color:#bfe3cb;background:#eaf7ee;}
.listen-bar .lb-btn{background:#fff;border:1px solid var(--rand);border-radius:18px;padding:7px 15px;font-family:inherit;font-size:.85rem;color:var(--rijk-blauw);cursor:pointer;}
.listen-bar .lb-btn:hover{background:var(--blauw-bg);border-color:var(--blauw-licht);}
.listen-bar .lb-btn.primary{background:var(--rijk-licht);color:#fff;border-color:var(--rijk-licht);font-weight:600;}
.listen-bar .lb-btn.primary:hover{background:var(--rijk-donker);}
.listen-bar .lb-bar{flex:0 0 130px;height:6px;background:var(--rand);border-radius:3px;overflow:hidden;}
.listen-bar .lb-bar i{display:block;height:100%;background:var(--rijk-licht);transition:width .9s linear;}
.listen-bar .lb-vraag{flex-basis:100%;color:var(--rijk-blauw);font-size:.84rem;font-style:italic;}
.lai-ai{border-top:1px solid var(--rand);margin-top:8px;padding-top:10px;}
.listen-card{text-align:left;background:#fff;border:1px solid var(--rand);border-left:3px solid var(--rijk-licht);border-radius:10px;padding:12px 14px;cursor:pointer;font-family:inherit;transition:background .12s,border-color .12s;display:flex;flex-direction:column;gap:8px;}
.listen-card:hover{background:var(--blauw-bg);border-color:var(--blauw-licht);}
.listen-card .lc-quote{font-size:.98rem;line-height:1.55;color:var(--ink);}
.listen-card .lc-src{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:600;color:var(--rijk-blauw);}
.send-btn:hover:not(:disabled){background:var(--rijk-donker);}
.send-btn:active:not(:disabled){transform:scale(.93);}
.send-btn:disabled{background:var(--rand-sterk);cursor:default;}
.badge{display:inline-block;font-size:.7rem;padding:2px 8px;border-radius:10px;margin-left:8px;vertical-align:middle;}
.badge.ai{background:var(--blauw-bg);color:var(--rijk-blauw);}
.badge.demo{background:#fdecec;color:var(--rood);}
/* Welkomststaat (lege conversatie) */
.welcome{font-style:normal;color:#3a4a5c;line-height:1.6;text-align:center;max-width:600px;margin:7vh auto 0;font-size:1.12rem;}
.welcome-logo{display:block;width:84px;height:84px;border-radius:50%;object-fit:cover;margin:0 auto 18px;border:1px solid var(--rand);box-shadow:0 4px 16px rgba(20,40,70,.1);}
.welcome strong{color:var(--rijk-blauw);font-size:1.32rem;display:block;margin-bottom:6px;font-weight:700;}
.welcome .hint{display:block;margin-top:14px;color:var(--ink-licht);font-style:normal;font-size:.92rem;}
/* Typing-indicator: shimmer over de tekst (modern, zoals Claude) */
.shimmer{font-weight:600;background:linear-gradient(90deg,#aab6c4 20%,var(--rijk-blauw) 50%,#aab6c4 80%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:shimmer 1.5s linear infinite;}
@keyframes shimmer{to{background-position:-200% 0;}}
@media (prefers-reduced-motion:reduce){.shimmer{animation:none;color:var(--ink-licht);-webkit-text-fill-color:currentColor;}}
/* Kopieer-knop per citaat */
.copy-cite{position:absolute;top:9px;right:0;background:rgba(255,255,255,.9);border:1px solid var(--rand);border-radius:8px;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:#5a6b7b;opacity:0;transition:opacity .12s;z-index:2;}
.passage:hover .copy-cite,.copy-cite:focus-visible{opacity:1;}
.copy-cite:hover{background:#fff;color:var(--rijk-blauw);}
.copy-cite.ok{opacity:1;color:var(--groen);border-color:var(--groen);}
/* Inklapbare bron-secties */
details.section>summary{cursor:pointer;list-style:none;}
details.section>summary::-webkit-details-marker{display:none;}
details.section>summary .label{display:inline-block;margin-bottom:0;}
details.section>summary::before{content:"\25B8";color:#9aa6b2;margin-right:6px;font-size:.7rem;}
details.section[open]>summary::before{content:"\25BE";}
details.section>summary:hover .label{color:var(--rijk-blauw);}
/* Antwoord-footer: bronnen/acties visueel scheiden van het antwoord zelf */
.answer-footer{margin-top:18px;padding-top:14px;border-top:1px solid var(--rand);}
.answer-footer>:first-child{margin-top:0;}
.answer-actions{display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap;}
.answer-actions .spacer{flex:1;}
.act-btn{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--rand);border-radius:16px;padding:5px 11px;font-size:.78rem;cursor:pointer;color:#33485c;}
.act-btn:hover{background:#f0f5fa;border-color:var(--rijk-licht);}
.act-btn.ok{border-color:var(--groen);color:var(--groen);}
.act-btn.share-wa{color:#1c7c3a;}.act-btn.share-wa:hover{background:#eaf7ee;border-color:#1c7c3a;}
.consulted{font-size:.74rem;color:var(--ink-licht);margin-top:14px;}
/* Feedback (klopt dit antwoord?) */
.feedback{display:inline-flex;gap:6px;align-items:center;font-size:.78rem;color:var(--ink-licht);}
.fb-btn{background:#fff;border:1px solid var(--rand);border-radius:50%;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:.9rem;line-height:1;}
.fb-btn:hover{background:#f0f5fa;}
.fb-btn.sel-up{background:#e9f6e3;border-color:var(--groen);}
.fb-btn.sel-down{background:#fdecec;border-color:var(--rood);}
/* Toegankelijkheid: zichtbare focus voor toetsenbordnavigatie */
:focus-visible{outline:2px solid var(--rijk-licht);outline-offset:2px;}
/* Citaat klikbaar -> bronpagina-paneel */
.clickable-cite{cursor:pointer;}
/* Bron-viewer: overlay-paneel rechts dat OVER de chat schuift (geen reflow van het antwoord). */
.viewer{position:fixed;top:0;right:0;height:100%;width:0;overflow:hidden;background:#fff;border-left:1px solid var(--rand);box-shadow:-6px 0 28px rgba(20,40,70,.16);transition:width .22s ease;z-index:60;}
body.viewer-active .viewer{width:min(560px,94vw);}
.viewer-inner{width:min(560px,94vw);height:100%;display:flex;flex-direction:column;}
.viewer-head{display:flex;align-items:center;gap:10px;padding:14px 16px;background:rgba(255,255,255,.9);backdrop-filter:saturate(1.6) blur(8px);color:var(--rijk-blauw);border-bottom:1px solid var(--rand);flex:0 0 auto;}
.viewer-title{flex:1 1 auto;min-width:0;font-size:.92rem;font-weight:700;line-height:1.3;color:var(--rijk-blauw);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.viewer-open{flex:0 0 auto;color:var(--rijk-licht);background:#fff;font-size:.76rem;font-weight:600;white-space:nowrap;text-decoration:none;border:1px solid var(--rand);border-radius:14px;padding:5px 12px;transition:background .12s,border-color .12s;}
.viewer-open:hover{background:var(--blauw-bg);border-color:var(--blauw-licht);}
.viewer-close{background:#fff;color:var(--ink-licht);border:1px solid var(--rand);border-radius:50%;width:34px;height:34px;cursor:pointer;flex:0 0 auto;font-size:.85rem;line-height:1;transition:background .12s,color .12s;}
.viewer-close:hover{background:var(--grijs);color:var(--rijk-blauw);}
.viewer-body{padding:20px 22px;overflow-x:hidden;overflow-y:auto;line-height:1.65;font-size:.95rem;color:var(--ink);white-space:normal;overflow-wrap:anywhere;}
.viewer-body .vp{margin:0 0 11px;line-height:1.62;white-space:normal;}
.viewer-body .vh{font-weight:700;color:var(--rijk-blauw);line-height:1.3;}
.viewer-body .vh1{font-size:1.22rem;margin:0 0 8px;}
.viewer-body .vh3{font-size:1rem;color:#33495f;margin:14px 0 5px;}
/* H2 = zichtbare sectiekop (zoals op de site); H3 = uitklapper (accordeon) met chevron */
.viewer-body .vh2{font-size:1.12rem;margin:22px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--blauw-licht);}
.viewer-body details.vacc{border-bottom:1px solid var(--rand);}
.viewer-body summary.vh3{font-size:1rem;cursor:pointer;list-style:none;position:relative;padding:12px 0 12px 26px;margin:0;user-select:none;color:var(--rijk-blauw);}
.viewer-body summary.vh3::-webkit-details-marker{display:none;}
.viewer-body summary.vh3::before{content:"›";position:absolute;left:7px;top:10px;font-size:1.25rem;line-height:1;color:var(--rijk-licht);transition:transform .15s;}
.viewer-body details[open]>summary.vh3::before{transform:rotate(90deg);}
.viewer-body summary.vh3:hover{color:var(--rijk-licht);}
.viewer-body .vacc-body{padding:0 0 14px 26px;}
.viewer-body mark.hl{background:#ffec70;padding:1px 1px;border-radius:2px;box-shadow:0 0 0 3px #ffec70;}
.viewer-body a.vlink{color:var(--rijk-licht);text-decoration:underline;text-underline-offset:2px;}
.viewer-body a.vlink:hover{color:var(--rijk-blauw);}
.viewer-note{color:var(--oranje);font-size:.85rem;margin-bottom:12px;font-style:italic;}
.viewer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:55;border:0;}
.viewer-backdrop[hidden]{display:none;}
/* Mobiel: zijbalk wordt off-canvas met hamburger */
@media (max-width:760px){
  /* Smal scherm: de bovenbalk breekt af, het zoekgebied krijgt zijn eigen regel. */
  .chat-topbar{flex-wrap:wrap;padding:8px 12px;}
  .brand-text{flex:1;min-width:0;}
  .brand-text p,.brand-sub{display:none;}
  .topbar-spacer{display:none;}
  #mode-badge{order:2;}
  .filterbar{order:3;width:100%;padding-top:2px;}
  .filterbar select{flex:1;min-width:0;max-width:none;}
  .settings-btn .btn-label{display:inline;}
  .conversation{padding:20px 16px;}
  .composer{padding:10px 12px 16px;}
  .btn-label{display:none;}
  .send-btn,.pill-btn{padding:0;width:40px;}
  .bubble{max-width:90%;}
  .bubble.antwoord{max-width:96%;}
  .welcome{font-size:1.04rem;}
  .answer-actions{gap:8px;}
}
</style>

<div class="viewer-backdrop" id="viewer-backdrop" hidden></div>
<script>
const SYSTEM=`Je helpt een voorlichter van het klantcontactcentrum van NederlandWereldwijd. Je krijgt de vraag van de burger en enkele genummerde pagina's van NederlandWereldwijd.nl met hun LETTERLIJKE tekst.

Stel een antwoord samen dat bestaat uit:
1. "citations": de relevante passages die samen de vraag beantwoorden. Geef NIET de volledige tekst, maar per passage alleen een VERWIJZING: "source_index" (paginanummer), "start" (de eerste 4 tot 8 woorden van de passage, EXACT overgenomen uit de paginatekst) en "end" (de laatste 4 tot 8 woorden van de passage, EXACT overgenomen). De app knipt zelf het stuk tussen start en end uit de pagina. Begin en eindig op een natuurlijke zinsgrens; de passage moet aaneengesloten in de tekst staan. Kopieer "start" en "end" exact (zelfde woorden, leestekens en hoofdletters) zodat ze letterlijk terug te vinden zijn. Je mag passages uit verschillende pagina's combineren. REGELS voor goede citaten:
   - Citeer alleen VOLLEDIGE, op zichzelf staande zinnen of alinea's met inhoud. Citeer NOOIT een los kopje, sectietitel, knoptekst of navigatielabel (korte regels zonder werkwoord, zoals "Buitenland", "Let op:" of "Tijdelijke aanvraaglocaties").
   - AANTAL: begin met ÉÉN kort kerncitaat (1 tot 4 zinnen) dat de vraag het meest direct beantwoordt. Voeg alleen een tweede of derde citaat toe als de vraag ECHT uit meerdere onderdelen bestaat (bv. "wat kost het én hoe lang duurt het", of een vraag die per situatie of per land anders wordt beantwoord). Elk extra citaat moet een ANDER onderdeel van de vraag beantwoorden — herhaal niet in andere woorden wat er al staat, en vul niet aan met wat de burger niet gevraagd heeft. Maximaal 3. Beantwoordt één citaat de hele vraag, geef er dan ook maar één; de voorlichter leest de rest van de pagina door op het citaat te klikken. Houd elk citaat kernachtig en op zichzelf staand; geen lange of samengestelde citaten.
   - RELEVANTIE & GEEN AANNAMES: kies citaten die de vraag DIRECT en ALGEMEEN beantwoorden. Neem NOOIT een situatie aan die de burger niet zelf heeft genoemd. Bij een algemene vraag als "Hoe vraag ik een ID-kaart of paspoort aan?" mag je er dus NIET van uitgaan dat het een EERSTE aanvraag is, een aanvraag VOOR EEN KIND, of een vervanging na verlies/diefstal. Citeer dan een passage die voor IEDEREEN geldt (de algemene aanvraag- of overzichtspagina). Het EERSTE citaat (kernantwoord) mag NOOIT openen met een situatie-aanname zoals "Heeft u of uw kind…", "Voor het eerst…" of "Bent u uw paspoort verloren…". Staan er zowel een algemene als een situatie-specifieke pagina ("Voor het eerst…", "voor uw kind", "verloren of gestolen", of een specifiek land) tussen de pagina's, kies dan ALTIJD de algemene — tenzij de vraag duidelijk over die specifieke situatie gaat. UITZONDERING: noemt de burger een SPECIFIEK PRODUCT of vakterm (bv. "inreisvisum", "MVV", "nooddocument", "apostille"), citeer dan van de pagina die over JUIST dat product gaat en NIET van de algemene rubriekspagina — ook niet als de vraag maar uit één woord bestaat.
   - BEKNOPT: houd elk citaat KORT en gefocust — kies één samenhangende alinea (liefst 2 tot 5 zinnen) die precies het betreffende punt beantwoordt. Citeer NOOIT een hele paginasectie met meerdere tussenkopjes, opsommingen van links, "Bekijk…"- of "Lees…"-knopteksten, of losse "Let op:"-blokken. Stopt de relevante alinea waar een nieuw kopje of navigatietekst begint, zet "end" dan vóór dat kopje.
   - VOLGORDE: zet de citaten in de volgorde waarin je ze zou uitleggen — eerst het kernantwoord, dan waar of hoe aanvragen, daarna voorwaarden, kosten en termijnen, en uitzonderingen als laatste. De samenhang breng je aan met de "bridge"-zin vóór elk citaat, niet met tussenkopjes.
2. "clarifications": als het juiste antwoord AFHANGT van de situatie van de burger, neem dan geen aanname maar zet hier de vraag/vragen die de voorlichter moet stellen. Veel antwoorden hangen af van: het LAND waar de aanvrager woont, of het een EERSTE aanvraag of een VERVANGING/VERLENGING is, en of het voor een VOLWASSENE of voor een KIND is. Geef per verduidelijking een "question" (wat de voorlichter uitvraagt) en een "prefill" (begin van een vervolgvraag dat de voorlichter aanvult, bv. "ID-kaart aanvragen vanuit "). Geef bij een situatie-afhankelijke vraag ALTIJD minstens één verduidelijking, zodat de voorlichter de juiste situatie kan uitvragen in plaats van dat jij iets aanneemt. Laat leeg als er echt niets te verduidelijken valt.
3. "bridge" (per citaat): ÉÉN korte overbruggende zin (max 16 woorden) die de lezer naar dat citaat toe leidt, bv. "Volg de volgende stappen om een BSN aan te vragen:" of "Over de kosten staat op de website:". Strikte regels, net als bij "intro": noem GEEN feiten, bedragen, termijnen, voorwaarden of conclusies — de zin kondigt alleen aan wat er komt, de inhoud staat in het citaat zelf. Gebruik dezelfde vakterm als de vraag. Schrijf de zin PAS NADAT je het citaat hebt gekozen. Bij het EERSTE citaat volgt de brug direct op "intro", dus die twee moeten op elkaar aansluiten en elkaar niet herhalen.
4. "followups": 2 tot 4 logische vervolgvragen die de burger waarschijnlijk ook heeft (volledige, op zichzelf staande vragen).
5. "intro": EÉN korte zin (max 18 woorden; gebruik dezelfde vakterm als de vraag — herinterpreteer die niet) in de aanspreekvorm "u" die de INFORMATIEBEHOEFTE van de burger herformuleert, grammaticaal naadloos overloopt in het eerste citaat, en de voorlichter helpt de vraag goed te kaderen. VARIEER de opening — gebruik bv. "Als ik het goed begrijp, wilt u weten…", "U vraagt waarschijnlijk naar…", "U zoekt informatie over…", "Begrijp ik goed dat u wilt weten…" of een vergelijkbare natuurlijke variant. Schrijf de zin PAS NADAT je het eerste citaat hebt gekozen, zodat hij precies daarop aansluit. Strikte regels: noem GEEN feiten, bedragen, termijnen of conclusies — herformuleer ALLEEN de VRAAG. Geef GEEN aanname over de situatie (bv. niet "voor uw kind" tenzij de burger dat zelf zei). Eindig NIET op een dubbele punt als het citaat met een vraag begint. Laat "intro" LEEG als er geen citaat is.

Antwoord UITSLUITEND met JSON (geen tekst eromheen, geen codeblok):
{"restated_question":"<de vraag kort en helder geherformuleerd>","intro":"<korte zin die de vraag herformuleert en op het citaat aansluit, of leeg>","citations":[{"source_index":<paginanummer>,"bridge":"<korte overbruggende zin naar dit citaat>","start":"<eerste woorden van de passage>","end":"<laatste woorden van de passage>"}],"clarifications":[{"question":"<wat uit te vragen>","prefill":"<begin vervolgvraag>"}],"followups":["<vervolgvraag>"],"related_indices":[<max 3 andere relevante paginanummers>],"note":"<korte toelichting of leeg>"}

Als geen van de pagina's de vraag beantwoordt: laat "citations" leeg en leg dat uit in "note".`;

// Herschrijft een (mogelijk elliptische) vervolgvraag tot een zelfstandige vraag, met gesprekscontext.
const CONDENSE_SYSTEM=`Je krijgt de samenvatting van een lopend gesprek tussen een voorlichter en een AI over overheidsvragen, plus een nieuwe vraag. Herschrijf de NIEUWE vraag tot één zelfstandige, op zichzelf staande vraag die ook zonder de context te begrijpen is (vul ontbrekend onderwerp aan uit de context). Betreft de nieuwe vraag duidelijk een nieuw onderwerp, geef hem dan vrijwel ongewijzigd terug. Antwoord UITSLUITEND met JSON: {"standalone_question":"<de zelfstandige vraag>"}`;
// Stap 1: maak de vraag zelfstandig én genereer zoektermen (spreektaal -> ambtelijke/officiële termen) voor betere recall.
const PREPARE_SYSTEM=`Je helpt bij het zoeken op NederlandWereldwijd.nl (Nederlandse overheid, consulaire zaken voor Nederlanders in het buitenland). Je krijgt de vraag van een burger en eventueel gesprekscontext. Bepaal de ONDERLIGGENDE INFORMATIEBEHOEFTE en interpreteer Nederlandse spreektaal/idiomen, en herschrijf de vraag tot een heldere, zelfstandige informatiebehoefte. LET OP: neem VAKTERMEN LETTERLIJK over en vervang ze NOOIT door een andere of bredere term. NederlandWereldwijd kent veel op elkaar lijkende producten die iets ANDERS zijn — bijvoorbeeld "inreisvisum" (bij een verlopen of verloren verblijfsvergunning) is iets anders dan "Schengenvisum kort verblijf", en "MVV" iets anders dan "verblijfsvergunning". Noemt de burger zo'n term, houd die dan exact aan. Dit geldt voor ELK onderwerp (o.a. paspoort/ID-kaart, visum, DigiD, rijbewijs, geboorte- of overlijdensaangifte, trouwen, legaliseren, uitschrijven/BRP, AOW/uitkering, reisadvies, hulp bij nood) — niet alleen reisdocumenten.
Geef UITSLUITEND JSON: {"standalone_question":"<de herschreven informatiebehoefte; vul ontbrekend onderwerp aan uit de context>","search_terms":["<term>", ...]}. "search_terms" zijn 5 tot 12 losse Nederlandse zoekwoorden die helpen de juiste overheidspagina te vinden: vertaal spreektaal naar de OFFICIËLE/ambtelijke term en voeg synoniemen toe. Voorbeelden uit verschillende onderwerpen:
- "waar blijft mijn paspoort" -> standalone_question "Hoe lang duurt het voordat ik mijn aangevraagde paspoort ontvang of kan ophalen?", search_terms ["doorlooptijd","levertijd","hoelang","ophalen","wachttijd","klaar"]
- "ik kom niet in DigiD" -> "Hoe los ik een inlogprobleem met DigiD op vanuit het buitenland?", ["digid","inloggen","activeren","herstellen","app","sms"]
- "er is iemand overleden op vakantie" -> "Wat moet ik regelen als een naaste in het buitenland is overleden?", ["overlijden","buitenland","repatriering","ambassade","stoffelijk overschot"]
- "ik ben bestolen" -> "Wat moet ik doen als ik in het buitenland bestolen ben?", ["diefstal","beroofd","aangifte","slachtoffer","politie"]
Geef alleen losse woorden in search_terms, geen zinnen.
Geef daarnaast: "alt_queries" = 1 tot 2 ANDERE formuleringen van dezelfde informatiebehoefte (voor bredere dekking); "hyde" = een kort, plausibel antwoord van 2 tot 3 zinnen zoals het op NederlandWereldwijd.nl zou kunnen staan (verzin GEEN concrete bedragen, termijnen of feiten — dit helpt alleen om de juiste pagina te vinden); "category" = het hoofdonderwerp in één woord of slug (bv. "paspoort", "visum", "rijbewijs", "digid", "trouwen", "overlijden", "legaliseren", "geboorte") of leeg.
Geef ook "in_scope": true of false. NederlandWereldwijd gaat over Nederlandse overheidszaken voor burgers in of naar het buitenland (reisdocumenten, visa, consulaire hulp, verklaringen, legalisatie, DigiD/BSN/BRP, uitkeringen en toeslagen buiten Nederland, trouwen/geboorte/overlijden in het buitenland, reisadvies, stemmen, rijbewijs, inburgering, nationaliteit). Valt de vraag daar duidelijk BUITEN (bv. recepten, sport, weer, ov-tijden, algemene kennis), zet "in_scope" op false. Twijfel je, zet hem op true.
Geef tot slot "sub_questions": ALLEEN als de vraag duidelijk uit MEERDERE losse informatiebehoeften bestaat (bv. "wat moet ik regelen met mijn paspoort én mijn zorgverzekering als ik verhuis"), splits hem dan in 2 tot 3 zelfstandige deelvragen; anders een lege lijst.
Volledige JSON-vorm: {"standalone_question":"...","search_terms":["..."],"alt_queries":["..."],"hyde":"...","category":"...","in_scope":true,"sub_questions":["..."]}.`;

const LISTEN_Q_SYSTEM=`Je luistert mee met een telefoongesprek tussen een voorlichter van NederlandWereldwijd en een klant. Je krijgt een RUWE spraaktranscriptie (verhaspeld, met stopwoorden en halve zinnen) en een genummerde lijst kandidaat-pagina's.

2. "pages": kies uit de kandidaten de nummers die die vraag het best beantwoorden, beste eerst (maximaal 3). Let op de BEDOELING, niet op losse woorden. Kies GEEN situatie-specifieke pagina ("voor uw kind", "voor het eerst", "verloren/gestolen") tenzij de klant daar zelf om vraagt. Past er niets, geef dan een lege lijst.

Antwoord UITSLUITEND met JSON: {"vraag":"...","pages":[...]}`;
const RERANK_SYSTEM=`Je krijgt de vraag van een burger en een genummerde lijst kandidaat-pagina's van NederlandWereldwijd.nl (titel + een tekstfragment), over uiteenlopende onderwerpen (paspoort, visum, DigiD, rijbewijs, geboorte/overlijden, trouwen, legaliseren, BRP, uitkeringen, reisadvies, enz.). Kies de pagina's die de SPECIFIEKE informatiebehoefte/INTENTIE van de burger het best dekken — let op de bedoeling en op het fragment, niet op losse overeenkomende woorden. Regels (voor elk onderwerp): heeft de vraag een duidelijke DEELBEHOEFTE (bv. hoe lang het duurt, kosten, ophalen, verlengen, verloren/gestolen, voorwaarden, een specifiek land), kies dan de pagina over JUIST die deelbehoefte — NIET de algemene overzichtspagina. Kies de overzichtspagina alleen bij een echt brede, oriënterende vraag (bv. "hoe vraag ik een paspoort aan"). NOEMT de burger een SPECIFIEK PRODUCT of vakterm (bv. "inreisvisum", "MVV", "nooddocument", "apostille", "attestatie de vita", "laissez-passer"), kies dan ALTIJD de pagina die over JUIST dat product gaat — ook als de vraag uit één woord bestaat. Een losse vakterm is een SPECIFIEKE vraag, geen brede vraag; kies dan dus NIET de algemene overzichtspagina van de rubriek. Voorbeelden: "hoe lang duurt het voor ik mijn paspoort krijg" -> de doorlooptijd-pagina; "mijn rijbewijs is verlopen" -> de pagina over rijbewijs verlengen/vernieuwen. Bestaat de vraag uit MEERDERE behoeften (bv. paspoort én zorgverzekering), kies dan pagina's die SAMEN alle aspecten dekken — minstens één pagina per aspect. Past GEEN ENKELE pagina echt bij de vraag, geef dan {"pages":[]} (dan weet de voorlichter dat er geen duidelijk antwoord is). Antwoord UITSLUITEND met JSON: {"pages":[<nummers van de gekozen pagina's, beste eerst, maximaal 6>]}.`;

  const r=await fetch(endpoint,{method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+key},body:JSON.stringify({model,temperature:0,max_tokens:3000,response_format:{type:"json_object"},messages:[{role:"system",content:system},{role:"user",content:user}]})});
  if(!r.ok)throw new Error(name+" "+r.status+": "+(await r.text()).slice(0,200));
  const d=await r.json();return d.choices?.[0]?.message?.content||"";
}

const STOP=new Set("de het een en van in op te voor met aan is ik je u hoe wat waar wanneer kan moet mijn uw ben wil naar om dat die er ook als of bij dan zijn heb heeft wordt worden the a to of".split(" "));
const SAMPLES=["Hoe vraag ik een ID-kaart aan vanuit het buitenland?","Wat kost een paspoort vanuit het buitenland?","Wat is een BSN?","Mijn rijbewijs is gestolen in het buitenland, wat nu?","Ik ben mijn DigiD-wachtwoord vergeten","Wat is een apostille?"];
const TOPK=6; // aantal kandidaat-pagina's dat naar het AI-model gaat
// Hoeveel citaten een antwoord hoogstens telt. Eén citaat blijft de regel; meer alleen als de
// vraag echt uit meerdere onderdelen bestaat (kosten én doorlooptijd, of per situatie anders).
const MAX_CITES=3;
// Fusie- en veldgewichten, afgesteld met scripts/tune.mjs (660 varianten) op 1000 uit het corpus
// afgeleide vragen (scripts/eval_set_auto.json), met als HARDE EIS dat de 126 handgemaakte
// vragen (scripts/eval_set.json) er niet op achteruit gaan — anders koop je winst op
// gegenereerde vragen af met verlies op echte.
const RRF_K=14, W_SEM=1.0, W_KW=0.75;
const FW_TITLE=4, FW_DESC=1, FW_URL=3, FW_TEXT=1;
let CORPUS=[],PTOKENS=[],DF=null,NDOCS=0;

// Lichte Nederlandse stemmer: haalt veelvoorkomende uitgangen weg zodat varianten
// op elkaar matchen ('verkracht'/'verkrachting', 'document'/'documenten').
function stem(w){
  if(w.length<5)return w;
  for(const suf of ["ingen","ing","heden","heid","en","s"]){
    if(w.length-suf.length>=4&&w.endsWith(suf))return w.slice(0,-suf.length);
  }
  return w;
}
function tokenize(t){return t.toLowerCase().split(/[^a-z0-9à-ÿ]+/).filter(w=>w.length>2&&!STOP.has(w)).map(stem);}
// Trefwoord-index per pagina = term-frequenties over VOLLEDIGE tekst, met veldweging
// (titel telt zwaarder dan lopende tekst). Nodig voor BM25.
function tokensOf(p){
  const m=new Map();
  const add=(text,w)=>{for(const t of tokenize(text||""))m.set(t,(m.get(t)||0)+w);};
  add(p.title,FW_TITLE);add(p.summary||p.desc,FW_DESC);add(p.url,FW_URL);add(p.text,FW_TEXT);
  return m;
}
// Document-frequenties + lengtes voor BM25.
let DLEN=[],AVGDL=1;
function buildDF(){
  DF=new Map();NDOCS=PTOKENS.length;DLEN=new Array(NDOCS);let tot=0;
  for(let i=0;i<NDOCS;i++){const m=PTOKENS[i];let len=0;for(const [t,c] of m){DF.set(t,(DF.get(t)||0)+1);len+=c;}DLEN[i]=len;tot+=len;}
  AVGDL=tot/Math.max(1,NDOCS);
}
function bm25idf(t){const df=(DF&&DF.get(t))||0;return df?Math.log(1+(NDOCS-df+0.5)/(df+0.5)):0;}
// Spellingscorrectie: corrigeer een query-woord dat NIET in het corpus voorkomt naar het
// dichtstbijzijnde corpus-woord (edit-afstand 1, of 2 bij langere woorden; hoogste df wint).
let VOCAB=null;
function buildVocab(){VOCAB=new Map();for(const [t,df] of DF){if(df<3||t.length<5)continue;const L=t.length;let a=VOCAB.get(L);if(!a){a=[];VOCAB.set(L,a);}a.push(t);}}
function editLE(a,b,max){ // Levenshtein-afstand <= max? (banded DP)
  const la=a.length,lb=b.length;if(Math.abs(la-lb)>max)return false;
  let prev=new Array(lb+1),cur=new Array(lb+1);
  for(let j=0;j<=lb;j++)prev[j]=j;
  for(let i=1;i<=la;i++){cur[0]=i;let rowMin=cur[0];
    for(let j=1;j<=lb;j++){cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));if(cur[j]<rowMin)rowMin=cur[j];}
    if(rowMin>max)return false;[prev,cur]=[cur,prev];}
  return prev[lb]<=max;
}
function fuzzyFix(t){
  if(t.length<5||(DF.get(t)||0)>0)return t;
  if(!VOCAB)buildVocab();
  const max=t.length>=8?2:1;let best=null,bestDf=0;
  for(let L=t.length-max;L<=t.length+max;L++){
    const arr=VOCAB.get(L);if(!arr)continue;
    for(const c of arr){if(c[0]!==t[0]&&max<2)continue;if(editLE(t,c,max)){const df=DF.get(c);if(df>bestDf){best=c;bestDf=df;}}}
  }
  return best||t;
}
// Trefwoord-ranking met BM25 (term-frequentie + lengtenormalisatie + IDF). Zeldzame, vaak
// voorkomende termen in korte/relevante pagina's scoren hoog. Onbekende woorden worden
// eerst gecorrigeerd op spelling (fuzzyFix).
function rank(q,limit){
  if(!DF)buildDF();
  const qt=[...new Set(tokenize(q).map(fuzzyFix))];if(!qt.length)return [];
  const k1=1.5,b=0.75,s=[];
  for(let i=0;i<NDOCS;i++){
    const m=PTOKENS[i];let sc=0;
    for(const t of qt){const tf=m.get(t);if(!tf)continue;sc+=bm25idf(t)*(tf*(k1+1))/(tf+k1*(1-b+b*DLEN[i]/AVGDL));}
    if(sc>0)s.push([sc,i]);
  }
  s.sort((a,b)=>b[0]-a[0]);return s.slice(0,limit||TOPK).map(x=>x[1]);
}
function normalize(s){return s.replace(/\s+/g," ").trim().toLowerCase();}

// ---- Landherkenning (afgeleid uit de corpus-URL-structuur) ----
// Een laatste URL-segment dat onder >=7 verschillende rubrieken voorkomt is vrijwel zeker een land
// (bv. /trouwen/frankrijk, /verklaring/.../frankrijk, /paspoort-id-kaart/buitenland/...-frankrijk).
let COUNTRY=null,PCOUNTRY=null;
function fold(s){return (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");}
function buildCountries(){
  const parents=new Map();
  for(const p of CORPUS){const parts=(p.url||"").replace(/\/+$/,"").split("/");if(parts.length<5)continue;const last=parts.pop();let s=parents.get(last);if(!s){s=new Set();parents.set(last,s);}s.add(parts.join("/"));}
  const BLOCK=new Set(["buitenland","aanvragen","algemeen","overzicht","contact"]);
  COUNTRY=new Set();for(const [seg,ps] of parents)if(ps.size>=7&&!BLOCK.has(seg))COUNTRY.add(seg);
  PCOUNTRY=new Array(CORPUS.length).fill(null);
  for(let i=0;i<CORPUS.length;i++){const last=(CORPUS[i].url||"").replace(/\/+$/,"").split("/").pop().toLowerCase();
    if(COUNTRY.has(last)){PCOUNTRY[i]=last;continue;}
    for(const c of COUNTRY)if(last.endsWith("-"+c)){PCOUNTRY[i]=c;break;}}

function detectCountries(text){if(!COUNTRY)buildCountries();const f=" "+fold(text).replace(/[^a-z0-9]+/g," ")+" ";const out=new Set();for(const c of COUNTRY)if(f.includes(" "+c.replace(/-/g," ")+" "))out.add(c);return out;}
// Actieve handmatige filters (zoekgebied): land en onderwerp (eerste URL-segment).
const FILTER={country:"",topic:""};
function firstSeg(idx){return (CORPUS[idx].url||"").replace(/^https?:\/\/[^/]+\//,"").split("/")[0]||"";}
// Beperk + herorden kandidaten op het zoekgebied: onderwerp-filter (met terugval als het te
// streng is) en land (handmatig filter overschrijft autodetectie). Genoemd/gekozen land eerst,
// dan algemene pagina's, andere landen achteraan.
function applyScope(text,order){
  if(!PCOUNTRY)buildCountries();
  let o=order;
  if(FILTER.topic){const m=o.filter(i=>firstSeg(i)===FILTER.topic);if(m.length>=2)o=m;}
  const det=FILTER.country?new Set([FILTER.country]):detectCountries(text);
  const g1=[],g2=[],g3=[];
  for(const idx of o){const pc=PCOUNTRY[idx];if(pc&&det.has(pc))g1.push(idx);else if(pc)g3.push(idx);else g2.push(idx);}
  return [...g1,...g2,...g3];
}
// Leesbare zoekwoorden van actieve filters (voor betere recall in de trefwoordzoeker).
function scopeTerms(){const t=[];if(FILTER.country)t.push(FILTER.country.replace(/-/g," "));if(FILTER.topic)t.push(FILTER.topic.replace(/-/g," "));return t;}
// Vul de land- en onderwerp-filters (afgeleid uit het corpus) en bedraad ze.
function prettyTopic(seg){return seg.replace(/-(buiten-nederland|buitenland|nederland)$/,"").replace(/-/g," ").replace(/^./,c=>c.toUpperCase());}
function initFilters(){
  if(!COUNTRY)buildCountries();
  const cSel=document.getElementById("filter-country"),tSel=document.getElementById("filter-topic"),clr=document.getElementById("filter-clear");
  [...COUNTRY].map(c=>[c,c.replace(/-/g," ").replace(/^./,x=>x.toUpperCase())]).sort((a,b)=>a[1].localeCompare(b[1],"nl")).forEach(([v,l])=>{const o=document.createElement("option");o.value=v;o.textContent=l;cSel.appendChild(o);});
  const cnt=new Map();for(let i=0;i<CORPUS.length;i++){const s=firstSeg(i);if(!s||COUNTRY.has(s))continue;cnt.set(s,(cnt.get(s)||0)+1);}
  [...cnt.entries()].filter(([,n])=>n>=5).sort((a,b)=>b[1]-a[1]).forEach(([s])=>{const o=document.createElement("option");o.value=s;o.textContent=prettyTopic(s);tSel.appendChild(o);});
  const upd=()=>{FILTER.country=cSel.value;FILTER.topic=tSel.value;cSel.toggleAttribute("data-all",!cSel.value);tSel.toggleAttribute("data-all",!tSel.value);clr.hidden=!(cSel.value||tSel.value);};
  cSel.setAttribute("data-all","");tSel.setAttribute("data-all","");
  cSel.addEventListener("change",upd);tSel.addEventListener("change",upd);
  clr.addEventListener("click",()=>{cSel.value="";tSel.value="";upd();});
}

// ---- Semantisch zoeken (embeddings in de browser, zelfde model als de vooraf berekende vectoren) ----
const SEM={ready:false,meta:null,vecs:null,extractor:null,modelPromise:null};
function setSearchStatus(t){const el=document.getElementById("semstatus");if(el)el.textContent=t;}
async function initSemantic(){
  try{
    const [mR,bR]=await Promise.all([fetch("data/embeddings.json"),fetch("data/embeddings.bin")]);
    if(!mR.ok||!bR.ok)throw new Error("geen embeddings");
    SEM.meta=await mR.json();
    SEM.vecs=new Int8Array(await bR.arrayBuffer());
    // owner[v] = paginaindex (meerdere chunks per pagina). Oud formaat: 1 vector per pagina.
    SEM.owner=Array.isArray(SEM.meta.owner)?Int32Array.from(SEM.meta.owner):null;
    const nvec=SEM.owner?SEM.owner.length:SEM.meta.count;
    if(SEM.vecs.length!==nvec*SEM.meta.dim)throw new Error("embeddings passen niet bij corpus");
    // Vangnet: hoort de index wel bij DIT corpus? Zo niet (bv. corpus vernieuwd maar embeddings
    // nog niet), val netjes terug op trefwoord-zoeken i.p.v. naar verkeerde pagina's te wijzen.
    const pages=SEM.meta.pages||SEM.meta.count;
    if(pages&&pages!==CORPUS.length)throw new Error("embeddings horen bij een andere corpusversie");
    setSearchStatus("semantisch model laden…");
    SEM.modelPromise=(async()=>{
      const tf=await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1");
      tf.env.allowLocalModels=false;
      SEM.extractor=await tf.pipeline("feature-extraction",SEM.meta.model);
      SEM.ready=true;setSearchStatus("semantisch zoeken ✓");
    })().catch(e=>{SEM.ready=false;setSearchStatus("trefwoord-zoeken (semantisch niet geladen)");});
  }catch(e){SEM.ready=false;setSearchStatus("trefwoord-zoeken");}
}
async function semanticRank(q,limit){
  await SEM.modelPromise;
  if(!SEM.ready)return rank(q,limit);
  const out=await SEM.extractor([SEM.meta.query_prefix+q],{pooling:"mean",normalize:true});
  const qv=out.data,dim=SEM.meta.dim,v=SEM.vecs,owner=SEM.owner;
  let scored;
  if(owner){
    // Meerdere chunks per pagina: bewaar de hoogste chunk-score per pagina.
    const best=new Map();
    for(let k=0,nv=owner.length;k<nv;k++){let dot=0;const off=k*dim;for(let d=0;d<dim;d++)dot+=qv[d]*v[off+d];const pg=owner[k],c=best.get(pg);if(c===undefined||dot>c)best.set(pg,dot);}
    scored=[...best.entries()].map(([pg,sc])=>[sc,pg]);
  }else{
    const n=SEM.meta.count;scored=new Array(n);
    for(let i=0;i<n;i++){let dot=0;const off=i*dim;for(let d=0;d<dim;d++)dot+=qv[d]*v[off+d];scored[i]=[dot,i];}
  }
  scored.sort((a,b)=>b[0]-a[0]);
  return scored.slice(0,limit||TOPK).map(x=>x[1]);
}
// URL -> index, voor het opzoeken van bovenliggende (algemenere) pagina's.
let URL2IDX=null;
function urlIndex(){if(!URL2IDX){URL2IDX=new Map();CORPUS.forEach((p,i)=>URL2IDX.set((p.url||"").replace(/\/+$/,""),i));}return URL2IDX;}
// Bovenliggende pagina's (hub/overzicht) van een URL die ook echt in het corpus staan — niet de domeinroot.
function ancestorsOf(url){
  const m=urlIndex(),out=[];let u=(url||"").replace(/\/+$/,"");
  const root=u.match(/^https?:\/\/[^/]+/);if(!root)return out;const base=root[0];
  while(u.length>base.length){const cut=u.lastIndexOf("/");if(cut<base.length)break;u=u.slice(0,cut);if(u.length>base.length&&m.has(u))out.push(m.get(u));}
  return out;
}
// ---- Productpagina's: harde regel voor genoemde vaktermen ----
// Uit de site-structuur afgeleid: een pagina die zelf subpagina's heeft én waarvan het
// URL-segment in de eigen titel voorkomt, is een PRODUCT (inreisvisum, nooddocument,
// schengenvisum, ...). Noemt de burger zo'n term letterlijk, dan hoort die pagina bovenaan —
// dat laten we niet aan het taalmodel over, want dat koos soms de algemene rubriekspagina.
let PRODUCT=null;
function buildProducts(){
  PRODUCT=new Map();
  const m=urlIndex(),kids=new Map();
  for(const p of CORPUS){const u=(p.url||"").replace(/\/+$/,""),par=u.slice(0,u.lastIndexOf("/"));if(m.has(par))kids.set(par,(kids.get(par)||0)+1);}
  const BLOCK=new Set(["buitenland","aanvragen","contact","thema","nederland","overzicht","landen"]);
  const cand=[];
  for(const [u,n] of kids){
    const seg=u.slice(u.lastIndexOf("/")+1).toLowerCase();
    // Alleen echte PRODUCTFAMILIES (veel subpagina's). Zonder deze drempel zouden gewone
    // woorden als "pensioen" of "crisis" onterecht een pagina forceren.
    if(n<50||BLOCK.has(seg)||seg.length<4||seg.includes("-"))continue;
    const i=m.get(u);if(i===undefined)continue;
    if(!(CORPUS[i].title||"").toLowerCase().replace(/-/g,"").includes(seg))continue;
    cand.push([u,seg,i]);
  }
  // Ouderpagina's van andere productpagina's overslaan (bv. /verklaring boven
  // /verklaring/woonplaats), anders verdringen ze hun eigen, specifiekere subpagina's.
  const urls=new Set(cand.map(c=>c[0]));
  for(const [u,seg,i] of cand){
    if([...urls].some(o=>o!==u&&o.startsWith(u+"/")))continue;
    PRODUCT.set(stem(seg),i);
  }
}
// Geeft de paginaindex van de meest SPECIFIEKE genoemde vakterm (langste match), of -1.
function productMatch(text){
  if(!PRODUCT)buildProducts();
  let best=-1,len=0;
  for(const t of new Set(tokenize(text||""))){const i=PRODUCT.get(t);if(i!==undefined&&t.length>len){best=i;len=t.length;}}
  return best;
}
// Zet de productpagina vooraan; verandert verder niets aan de volgorde.
function forceProduct(text,list){
  const i=productMatch(text);
  if(i<0||!Array.isArray(list)||list[0]===i)return list;
  return [i,...list.filter(x=>x!==i)];
}
// Pagina die een specifieke situatie aanneemt (eerste aanvraag, kind, verlies/diefstal).
const SPECIFIC_RX=/voor het eerst|eerste keer|voor (mijn|uw|je|een) kind|verloren|gestolen|kwijt|vermist/i;
const isSpecificPage=idx=>SPECIFIC_RX.test(CORPUS[idx].title||"");
// Hybride kandidaten: Reciprocal Rank Fusion van semantisch (synoniemen/parafrase) en
// trefwoord (exacte/zeldzame termen + zoektermen). Geen hub-logica; geeft top `limit`.
async function hybrid(q,terms,limit){
  const K=Math.max(limit,12);
  let sem=[];
  if(SEM.meta){try{sem=await semanticRank(q,K);}catch(e){/* val terug op trefwoord */}}
  const kw=rank([q,...(terms||[]),...scopeTerms()].join(" "),K);
  if(!sem.length&&!kw.length)return [];
  const score=new Map();
  // Gemeten weging (126 testvragen): semantiek x1,5 en k=10 gaf de beste uitkomst
  // (recall@6 94% -> 95%, MRR 0,854 -> 0,860).
  const add=(list,w)=>list.forEach((idx,r)=>score.set(idx,(score.get(idx)||0)+w/(RRF_K+r)));
  add(sem,W_SEM);add(kw,W_KW);
  const fused=[...score.entries()].sort((a,b)=>b[1]-a[1]).map(e=>e[0]);
  // Zoekgebied (filters) + landherkenning toepassen.
  return applyScope([q,...(terms||[])].join(" "),fused).slice(0,limit);
}
// Voeg de algemene/hub-pagina van de beste treffer toe (en zet die vooraan als de beste
// treffer situatie-specifiek is), zodat een algemene vraag altijd een algemene passage heeft.
function withHub(cands){
  if(!cands.length)return cands;
  const top=cands[0],rest=cands.slice(1);
  const anc=ancestorsOf(CORPUS[top].url).filter(i=>!cands.includes(i)).slice(0,2);
  if(anc.length&&isSpecificPage(top))return [anc[0],top,...anc.slice(1),...rest];
  if(anc.length)return [top,...anc,...rest];
  return cands;
}
// Voeg bovenliggende hub-pagina's toe aan de kandidatenlijst (alleen voor recall, geen herordening),
// zodat de AI-herrangschikking ook een algemene pagina kan kiezen als dat past.
function hubCandidates(cands,text){
  const extra=[];
  for(const i of cands)for(const a of ancestorsOf(CORPUS[i].url))if(!cands.includes(a)&&!extra.includes(a))extra.push(a);
  if(!extra.length)return cands;
  // Zoekgebied opnieuw toepassen, zodat een toegevoegde ALGEMENE pagina (bv.
  // /visum-nederland/inreisvisum) boven de vele land-specifieke varianten uitkomt
  // wanneer er geen land genoemd is.
  return applyScope(text||"",[...cands,...extra]);
}
// Eenvoudige retrieval (gebruikt in demo/zonder-sleutel pad).
async function rankFor(q){return forceProduct(q,withHub(await hybrid(q,[],TOPK)));}

// Repareer afgekapte JSON: knip terug tot na de laatst afgesloten haak en sluit
// de nog openstaande haken. Afgemaakte citaten blijven zo behouden.
function tryRepairJSON(raw){
  const a=raw.indexOf("{");if(a<0)return null;
  const s=raw.slice(a);
  let inStr=false,esc=false;const stack=[];let cut=-1,cutStack=null;
  for(let i=0;i<s.length;i++){
    const ch=s[i];
    if(inStr){if(esc)esc=false;else if(ch==="\\")esc=true;else if(ch==='"')inStr=false;continue;}
    if(ch==='"'){inStr=true;continue;}
    if(ch==='{')stack.push('}');
    else if(ch==='[')stack.push(']');
    else if(ch==='}'||ch===']'){stack.pop();cut=i+1;cutStack=stack.slice();}
  }
  if(cut<0)return null;
  let fixed=s.slice(0,cut).replace(/,\s*$/,"");
  for(let k=cutStack.length-1;k>=0;k--)fixed+=cutStack[k];
  try{return JSON.parse(fixed);}catch(e){return null;}
}
// Tolerant JSON uitlezen: fences eraf, normaal parsen, anders repareren, anders nette melding.
function parseModelJSON(text){
  let t=(text||"").trim();
  const fence=t.match(/```(?:json)?\s*([\s\S]*?)```/i);
  if(fence)t=fence[1].trim();
  const a=t.indexOf("{");
  if(a<0)throw new Error("Geen JSON in modelantwoord. Ruwe output: "+(text||"").slice(0,150));
  const m=t.slice(a).match(/\{[\s\S]*\}/);
  if(m){try{return JSON.parse(m[0]);}catch(e){/* val door naar reparatie */}}
  const rep=tryRepairJSON(t);
  if(rep){rep.__partial=true;return rep;}
  throw new Error("Het antwoord werd afgebroken (te lang). Probeer de vraag opnieuw te stellen.");
}
// Zoek een (kort) exact fragment in de tekst; bij geen exacte match een witruimte-tolerante poging.
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");}
function findFrom(text,phrase,from){
  if(!phrase)return null;from=from||0;
  let i=text.indexOf(phrase,from);
  if(i>=0)return {i,len:phrase.length};
  const words=phrase.trim().split(/\s+/).map(escRe);
  if(!words.length)return null;
  const m=new RegExp(words.join("\\s+"),"i").exec(text.slice(from));
  return m?{i:from+m.index,len:m[0].length}:null;
}
// Knip op basis van start/end-verwijzing het exacte, aaneengesloten stuk uit de paginatekst.
function extractQuote(text,start,end){
  const s=findFrom(text,(start||"").trim(),0);
  if(!s)return null;
  const ep=(end||"").trim();
  if(ep){const e=findFrom(text,ep,s.i);if(e&&e.i+e.len>s.i){let q=text.slice(s.i,e.i+e.len);return q.length>2000?q.slice(0,2000):q;}}
  const nl=text.indexOf("\n",s.i);
  return text.slice(s.i, nl>s.i?nl:Math.min(text.length,s.i+600)).trim();
}
// Een regel is een kopje/label als hij kort is en niet op een zin-einde eindigt.
function looksLikeHeading(line){
  const t=(line||"").trim();const w=t.split(/\s+/);
  return t.length>0 && w.length<=6 && !/[.!?]$/.test(t);
}
// Te zwak om als citaat te tonen: vrijwel leeg, of een kort kopje/label zonder echte zin.
function isWeakQuote(q){
  const t=(q||"").trim();
  if(t.length<12)return true;        // vrijwel niets
  if(t.includes("\n"))return false;  // meerregelig = inhoud
  return looksLikeHeading(t);        // korte regel zonder zin-einde = kopje/label
}
// Begint het citaat met een los kopje? Voeg dan de eerstvolgende inhoudsregel toe.
function expandHeading(text,quote){
  const t=(quote||"").trim();
  if(t.includes("\n")||!looksLikeHeading(t))return quote;
  // Het kopje moet als HELE regel voorkomen (niet als deel van een woord, bv. "Buitenlandse Zaken").
  const lines=text.split("\n");const li=lines.findIndex(l=>l.trim()===t);
  if(li<0)return quote;
  for(let j=li+1;j<lines.length;j++){
    const c=lines[j].trim();
    if(c.length>=25||/[.!?]$/.test(c)){       // eerste echte inhoudsregel
      let take=c.slice(0,500);const m=take.match(/[.!?](\s|$)/);if(m)take=take.slice(0,m.index+1);
      return t+" "+take.trim();               // letterlijk: kopje gevolgd door de eerste inhoudszin
    }
  }
  return quote;
}
// Sterke overlap tussen twee citaten (de één bevat (vrijwel) de ander).
function quotesOverlap(a,b){
  const x=a.toLowerCase().trim(),y=b.toLowerCase().trim();
  if(x.includes(y)||y.includes(x))return true;
  const sh=x.length<y.length?x:y,lo=x.length<y.length?y:x;
  return sh.length>=40 && lo.includes(sh.slice(0,Math.floor(sh.length*0.8)));
}

// Combineer meerdere semantische zoekteksten (vraag + alternatieve formuleringen + HyDE)
// met trefwoord (BM25), via RRF; categorie-boost en landherkenning erbovenop.
async function fuseRetrieval(semTexts,kwText,category,limit){
  const lists=[];
  for(const t of semTexts){if(t&&SEM.meta){try{lists.push(await semanticRank(t,Math.max(limit,12)));}catch(e){}}}
  lists.push(rank([kwText,...scopeTerms()].join(" "),Math.max(limit,12)));
  const score=new Map();
  lists.forEach((list,li)=>list.forEach((idx,r)=>score.set(idx,(score.get(idx)||0)+(li<lists.length-1?W_SEM:W_KW)/(RRF_K+r))));
  if(category){const cat=fold(category);if(cat.length>=3)for(const idx of score.keys())if(fold(CORPUS[idx].url).includes(cat))score.set(idx,score.get(idx)+0.02);}
  const fused=[...score.entries()].sort((a,b)=>b[1]-a[1]).map(e=>e[0]);
  return applyScope(kwText,fused).slice(0,limit);
}
// Stap 2 (AI-modus): laat het model uit de brede kandidatenlijst de best passende pagina's kiezen
// (op titel + tekstfragment). Retour: array picks (kan [] zijn = niets past), of null bij fout.
async function rerankCandidates(q,cands){
  const key=keyInput.value.trim();
  if(key.length<=10||cands.length<=TOPK)return cands.slice(0,TOPK);
  const listing=cands.map((idx,n)=>{const c=CORPUS[idx];const snip=((c.desc?c.desc+" ":"")+(c.text||"")).replace(/\s+/g," ").slice(0,300);return `[${n}] ${c.title}\n${snip}`;}).join("\n\n");
  try{
    const text=await PROVIDERS[provSel.value].call(key,modelSel.value,RERANK_SYSTEM,`Vraag van de burger:\n${q}\n\nKandidaat-pagina's:\n${listing}`);
    const j=parseModelJSON(text);
    if(!Array.isArray(j.pages))return null;
    const pick=j.pages.map(n=>cands[n]).filter(i=>Number.isInteger(i));
    return [...new Set(pick)].slice(0,TOPK);
  }catch(e){return null;}
}

async function runQuestion(rawQ){
  if(!corpusKlaar||!rawQ)return;
  if(typeof LISTEN!=="undefined"&&LISTEN&&LISTEN.active)LISTEN.stop(false);  // getypte vraag -> luistermodus uit
  const turn=addTurn(rawQ);               // toon de vraag zoals gesteld
  gesprekLoopt=true;refreshComposer();    // vanaf nu: vervolgvragen bouwen voort op dit gesprek
  const key=keyInput.value.trim();const ai=key.length>10;
  let q,cands;
  if(ai){
    // Expansie+HyDE+multi-query -> breed ophalen (+hubs) -> AI kiest op intentie -> confidence-check.
    const pre=await prepareQuery(rawQ);q=pre.q;
    if(!pre.inScope){                                           // buiten het domein -> niet zoeken
      logMiss(rawQ,"buiten-domein");
      const nores={restated_question:q,citations:[],note:"Deze vraag valt buiten NederlandWereldwijd (Nederlandse overheidszaken voor burgers in of naar het buitenland). Verwijs de burger zo nodig naar de juiste instantie.",used:[],related:[],clarifications:[],followups:[]};
      renderResult(turn,nores);recordTurn(rawQ,nores);return;
    }
    let broad;
    if(pre.subs.length>=2){
      // Samengestelde vraag: haal per deelvraag op en verdeel de plekken round-robin,
      // zodat ALLE aspecten gedekt zijn (RRF zou één dominant aspect laten winnen).
      const lists=[];
      for(const sq of pre.subs)lists.push(await fuseRetrieval([sq],[sq,rawQ,...pre.terms].join(" "),pre.category,10));
      const merged=[];const seen=new Set();
      for(let r=0;r<10&&merged.length<25;r++)for(const l of lists){const idx=l[r];if(idx!==undefined&&!seen.has(idx)){seen.add(idx);merged.push(idx);}}
      broad=hubCandidates(merged,[rawQ,q].join(" "));
    }else{
      // De ORIGINELE vraag gaat altijd mee: als de AI een vakterm herschrijft ("inreisvisum"
      // -> "Schengenvisum"), blijven de oorspronkelijke woorden toch meetellen in het zoeken.
      const semTexts=[q,rawQ,...pre.queries,pre.hyde].filter(Boolean);
      broad=hubCandidates(await fuseRetrieval(semTexts,[rawQ,q,...pre.terms].join(" "),pre.category,25),[rawQ,q].join(" "));
    }
    const picked=await rerankCandidates(q,broad);
    if(picked===null)cands=broad.slice(0,TOPK);                 // rerank faalde -> gewone retrieval
    else if(picked.length===0){                                 // niets past echt -> lage confidence
      logMiss(rawQ,"geen-passende-pagina");
      const nores={restated_question:q,citations:[],note:"Ik vond geen pagina die deze vraag duidelijk beantwoordt. Controleer op nederlandwereldwijd.nl of stel de vraag specifieker.",used:[],related:broad.slice(0,3).map(srcOf),clarifications:[],followups:[]};
      renderResult(turn,nores);recordTurn(rawQ,nores);return;
    }else cands=picked;
    cands=forceProduct(rawQ+" "+q,cands);   // genoemde vakterm hoort bovenaan
  }else{
    q=await condenseQuestion(rawQ);
    cands=await rankFor(q);
  }
  if(!cands.length){logMiss(rawQ,"geen-kandidaten");const nores={restated_question:q,citations:[],note:"Geen passende pagina gevonden voor deze vraag.",used:[],related:[]};renderResult(turn,nores);recordTurn(rawQ,nores);return;}
  try{
    const result=ai?await askAI(q,cands,key):demoAnswer(q,cands);
    renderResult(turn,result);
    recordTurn(rawQ,result);
    if(result.citations&&result.citations.length){
      const summary=(result.citations[0].text||"").slice(0,220);
      history.push({q:result.restated_question||q,summary});
      if(history.length>12)history.shift();
      refreshComposer();
    }
  }
  catch(err){turn.querySelector(".slot").innerHTML='<div class="bubble antwoord"><div class="error">Er ging iets mis: '+escapeHtml(err.message)+'</div></div>';}
}
