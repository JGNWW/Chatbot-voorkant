<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Voorlichter Chatbot — Demo (NederlandWereldwijd)</title>
<style>
:root{--rijk-blauw:#154273;--rijk-licht:#007bc7;--groen:#39870c;--oranje:#d3780c;--grijs:#f3f3f3;--rand:#d6d6d6;}
*{box-sizing:border-box;}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--grijs);color:#1a1a1a;}
.app{max-width:760px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
.header{background:var(--rijk-blauw);color:#fff;padding:18px 24px;}
.header h1{margin:0;font-size:1.3rem;}
.header p{margin:4px 0 0;font-size:.82rem;opacity:.85;}
.keybar{background:#0f3258;color:#fff;padding:10px 24px;font-size:.82rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.keybar input{flex:1;min-width:200px;padding:7px 10px;border:none;border-radius:6px;font-size:.85rem;}
.keybar .status{font-size:.78rem;}
.conversation{flex:1;padding:24px;overflow-y:auto;}
.empty{color:#666;font-style:italic;}
.samples{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;}
.samples button{background:#fff;border:1px solid var(--rand);border-radius:16px;padding:6px 12px;font-size:.8rem;cursor:pointer;}
.turn{margin-bottom:28px;}
.label{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:#6a6a6a;margin-bottom:4px;}
.user-question{background:var(--rijk-licht);color:#fff;padding:12px 16px;border-radius:10px 10px 10px 0;font-weight:600;}
.user-question .label{color:rgba(255,255,255,.8);}
.bot-answer{margin-top:14px;background:#fff;border:1px solid var(--rand);border-radius:0 10px 10px 10px;padding:16px;}
.restated{font-style:italic;color:#333;margin-bottom:12px;}
blockquote.answer{margin:0 0 12px;padding:14px 16px;background:#f7faf4;border-left:4px solid var(--groen);white-space:pre-wrap;line-height:1.5;}
blockquote.answer.unverified{background:#fdf6ec;border-left-color:var(--oranje);}
.note{font-size:.85rem;color:var(--oranje);margin-bottom:12px;}
.no-answer{color:#666;margin-bottom:12px;}
.source,.related{margin-top:12px;font-size:.9rem;}
.related ul{margin:4px 0 0;padding-left:18px;}
a{color:var(--rijk-licht);}
.loading{margin-top:12px;color:#555;font-style:italic;}
.error{margin-top:12px;color:#b00020;}
.composer{display:flex;gap:8px;padding:16px 24px;background:#fff;border-top:1px solid var(--rand);}
.composer input{flex:1;padding:12px 14px;border:1px solid var(--rand);border-radius:8px;font-size:1rem;}
.composer button{padding:12px 20px;background:var(--rijk-blauw);color:#fff;border:none;border-radius:8px;font-size:1rem;cursor:pointer;}
.composer button:hover{background:#0f3258;}
.badge{display:inline-block;font-size:.7rem;padding:2px 8px;border-radius:10px;margin-left:8px;vertical-align:middle;}
.badge.ai{background:#e6f0fa;color:var(--rijk-blauw);}
.badge.demo{background:#fdecec;color:#b00020;}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <h1>Voorlichter-assistent <span id="mode-badge"></span></h1>
    <p>Antwoorden letterlijk overgenomen van NederlandWereldwijd.nl — DEMO met een vaste set van 10 pagina's</p>
  </header>
  <div class="keybar">
    <span>🔑</span>
    <input id="apikey" type="password" placeholder="Plak hier je ANTHROPIC_API_KEY voor echte AI-antwoorden (optioneel)" />
    <span class="status" id="keystatus">Demo-modus (geen AI)</span>
  </div>
  <main class="conversation" id="conv">
    <p class="empty">Stel een vraag. Voorbeelden:</p>
    <div class="samples" id="samples"></div>
  </main>
  <form class="composer" id="form">
    <input id="input" type="text" placeholder="Typ hier de vraag van de burger…" autocomplete="off" autofocus />
    <button type="submit">Vraag stellen</button>
  </form>
</div>

ambassade of consulaat-generaal\nWoont u in het buitenland? U kunt een Nederlands paspoort of ID-kaart aanvragen bij Nederlandse ambassades of consulaten-generaal.\nKosten paspoort of ID-kaart bij ambassade of consulaat-generaal\nDocument\nKosten\nPaspoort 18 jaar en ouder\n€ 169,15\nPaspoort t/m 17 jaar\n€ 147,40\nID-kaart 18 jaar en ouder\n€ 167,80\nID-kaart t/m 17 jaar\n€ 128,75\nToeslag tijdelijke aanvraaglocatie (pop-up ambassade)\nEen pop-up ambassade is een tijdelijke locatie van een ambassade of consulaat-generaal. U kunt hier een Nederlands paspoort of ID-kaart aanvragen. Bij een pop-up ambassade betaalt u hetzelfde bedrag als op de ambassade of consulaat-generaal plus een toeslag. De toeslag is € 26,85.\nBekijk of een ambassade of consulaat-generaal bij u in de buurt komt\nWaarom betaal ik meer dan als ik in Nederland woon?\nWoont u in Nederland? Dan vraagt u uw paspoort of ID-kaart aan bij een gemeente. Dit is makkelijker en goedkoper te regelen. De gemeente kan namelijk direct zien of u Nederlander bent, omdat u staat ingeschreven bij de gemeente. Het document hoeft ook niet naar het buitenland te worden gestuurd.\nWoont u in het buitenland? Dan is het ingewikkelder. U staat niet meer ingeschreven bij een gemeente in Nederland. Het ministerie van Buitenlandse Zaken moet dan opnieuw controleren of u nog de Nederlandse nationaliteit heeft. Ook moet uw paspoort of ID-kaart vanuit Nederland veilig naar het buitenland worden verstuurd. Dit kost extra tijd en geld. U betaalt alleen de kosten die nodig zijn om dit goed te regelen.\nWaarom wordt mijn Nederlandse nationaliteit elke keer opnieuw onderzocht?\nAls u in het buitenland woont, staat u niet meer ingeschreven bij een gemeente in Nederland. Hierdoor weet het ministerie van Buitenlandse Zaken niet automatisch of u nog de Nederlandse nationaliteit heeft. Elke keer dat u een paspoort of ID-kaart aanvraagt, moet het ministerie van Buitenlandse Zaken dit controleren. Dit is nodig om zeker te weten dat u recht heeft op een Nederlands paspoort of ID-kaart.\nVFS Global\nWoont u in het buitenland? In 9 landen kunt u bij VFS Global een Nederlands paspoort of ID-kaart aanvragen. Dit bedrijf werkt samen met het ministerie van Buitenlandse Zaken. Bij VFS Global betaalt u hetzelfde bedrag als bij een Nederlandse ambassade of consulaat-generaal plus een toeslag. De toeslag verschilt per locatie.\nToeslag VFS Global per land\nAanvraaglocatie VFS Global\nToeslag\nAustralië (Brisbane, Melbourne, Perth)\nAU$ 43,00\nCanada (Edmonton, Toronto, Vancouver)\nCA$ 46,00\nIrak (Erbil)\nUS$ 23,10\nNieuw-Zeeland (Auckland)\nNZ$ 38,00\nSpanje (Barcelona, Madrid)\n€ 18,00\nTurkije (Izmir)\n€ 26,00\nVerenigd Koninkrijk (Birmingham, Edinburgh, Londen)\n£ 15,14\nVerenigde Staten (Boston, Chicago, Houston, Los Angeles)\nUS$ 33,00\nZuid-Afrika (Durban, Kaapstad)\nR 513,00\nMeer weten over VFS Global?\nLees de veelgestelde vragen over VFS Global\n.\nNederlandse grensgemeente of Schiphol\nWoont u in het buitenland? U kunt in Nederland bij een grensgemeente of op Schiphol een paspoort of ID-kaart aanvragen. Kosten kunnen verschillen tussen grensgemeentes.\nKosten paspoort of ID-kaart bij grensgemeente of Schiphol\nDocument\nKosten (maximaal)\nPaspoort 18 jaar en ouder\n€ 133,65\nPaspoort t/m 17 jaar\n€ 112,10\nID-kaart 18 jaar en ouder\n€ 128,95\nID-kaart t/m 17 jaar\n€ 92,00\nBekijk de lijst met Nederlandse grensgemeentes\nWaarom betaal ik minder bij een grensgemeente?\nBij een grensgemeente betaalt u minder voor een Nederlands paspoort of ID-kaart dan bij een ambassade of consulaat-generaal. Uw aanvraag wordt namelijk in Nederland verwerkt. Dat is eenvoudiger en goedkoper dan op een ambassade of consulaat-generaal in het buitenland.\nToch betaalt u meer dan iemand die in Nederland woont. Dit komt omdat u niet meer staat ingeschreven bij een gemeente in Nederland. De grensgemeente moet opnieuw controleren of u nog de Nederlandse nationaliteit heeft. Dit kost extra tijd en geld. U betaalt alleen de kosten die nodig zijn om dit goed te regelen.\nOok nuttig\nWaar kan ik een Nederlands paspoort of ID-kaart aanvragen als ik in het buitenland woon?\nHoelang duurt het om een Nederlands paspoort of ID-kaart aan te vragen in het buitenland?\nWaar moet ik op letten als ik een Nederlands paspoort of ID-kaart aanvraag in het buitenland?"}, {"url": "https://www.nederlandwereldwijd.nl/bsn/wat-is-bsn", "title": "Wat is een burgerservicenummer (BSN)? | NederlandWereldwijd", "text": "Een burgerservicenummer (BSN) is uw eigen persoonsnummer waarmee u staat ingeschreven in de Basisregistratie Personen (BRP). Het BSN bestaat uit 8 of 9 cijfers.\nWaar heb ik een BSN voor nodig?\nU gebruikt uw burgerservicenummer als u iets wilt regelen met de Nederlandse overheid. Bijvoorbeeld uw zorgverzekering, uw belastingaangifte of uw pensioen. U heeft ook een burgerservicenummer nodig als u een DigiD wilt aanvragen.\nGeldigheid BSN\nU ontvangt een burgerservicenummer eenmalig. Uw burgerservicenummer blijft altijd geldig en ongewijzigd. Ook als u in het buitenland woont (of gaat wonen). Of als u vanuit het buitenland terugkeert naar Nederland.\nVervanger van oude sofinummer\nHet burgerservicenummer is de vervanger van het oude sofinummer.\nLet op: bent u vóór 1 oktober 1994 uit Nederland vertrokken? Dan is uw sofinummer mogelijk niet meer bruikbaar als burgerservicenummer. Neem dan contact op met een van de\ngemeenten met een RNI-loket.\nHeb ik een BSN?\nU heeft een burgerservicenummer als u bent ingeschreven in de Basisregistratie Personen (BRP) of de Registratie Niet-Ingezetenen (RNI). Weet u niet zeker of u een burgerservicenummer heeft?\nLees waar u uw BSN kunt vinden\n.\nNog geen BSN?\nHeeft u geen burgerservicenummer? Lees dan\nhoe u aan een BSN komt\nof\nhoe u een BSN voor uw kind kunt regelen\n.\nContact\nKomt u er niet uit? Wij helpen u graag verder.\nNeem contact op met ons\nOok nuttig\nWat is de Basisregistratie Personen (BRP)?\nWat is de Registratie Niet-Ingezetenen (RNI)?"}, {"url": "https://www.nederlandwereldwijd.nl/digid-buiten-nederland", "title": "DigiD in het buitenland en in Caribisch Nederland | NederlandWereldwijd", "text": "Met uw DigiD regelt u online zaken met de Nederlandse overheid, zorginstellingen, onderwijsinstellingen en pensioenfondsen. Ook vanuit het buitenland\nen Caribisch Nederland\n. Daarnaast kunt u met DigiD inloggen bij overheidsorganisaties in andere Europese landen.\nOpzoeken\nDigiD aanvragen\nStappenplan DigiD aanvragen\nStappenplan DigiD aanvragen als AOW'er\nStappenplan DigiD aanvragen voor een kind\nDigiD activeren\nDigiD activeren\nActiveringscode ontvangen\nDigiD activeren via videobellen\nDigiD activeren via een balie in het buitenland\nDigiD activeren via een balie in Nederland\nDigiD app\nDigiD app downloaden\nDigiD app activeren\nWat is de ID-check in de DigiD app?\nDigiD app activeren met de ID-check\nID-check toevoegen aan DigiD app\nID-check lukt niet\nOver de DigiD app\nInloggen met DigiD\nInloggen met de DigiD app\nInloggen met sms-controle\nInloggen met identiteitskaart\nInloggen met gebruikersnaam en wachtwoord\nGebruikersnaam en wachtwoord\nGebruikersnaam of wachtwoord vergeten\nTelefoonnummer wijzigen\nTelefoonnummer wijzigen\nDigiD machtigen\nDigiD machtigen vanuit het buitenland\nMeer over DigiD\nOver DigiD"}, {"url": "https://www.nederlandwereldwijd.nl/digid-buiten-nederland/gebruikersnaam-wachtwoord-vergeten", "title": "Gebruikersnaam of wachtwoord vergeten voor DigiD | NederlandWereldwijd", "text": "Woont u in het buitenland of in Caribisch Nederland? En bent u uw gebruikersnaam of wachtwoord voor DigiD vergeten? Lees wat u kunt doen.\nGebruikersnaam vergeten\nBent u uw DigiD gebruikersnaam vergeten? Zoek uw gebruikersnaam op in de DigiD app. Maakt u nog geen gebruik van de DigiD app? Vraag uw gebruikersnaam op via de DigiD-website.\nGebruikersnaam opzoeken in de DigiD app\nWilt u uw gebruikersnaam opzoeken in de DigiD app? Volg hiervoor deze stappen:\nOpen uw DigiD app en log in.\nKlik op het menu linksboven in de app.\nKlik op 'Mijn DigiD'.\nKlik op 'Naar Mijn DigiD'.\nMijn DigiD opent. Hier ziet u uw gebruikersnaam staan.\nLet op:\nMaakt u nog geen gebruik van de DigiD app? Of kunt u niet meer inloggen met de DigiD app? Dan kunt u uw gebruikersnaam niet op deze manier opzoeken.\nGebruikersnaam opvragen via de DigiD-website\nWilt u uw gebruikersnaam opvragen via de DigiD-website? Volg hiervoor deze stappen:\nGa naar DigiD Gebruikersnaam opvragen\n.\nKlik op ‘Door persoonsgegevens in te vulllen’.\nKlik op ‘Volgende’.\nVoer uw burgerservicenummer (BSN) en DigiD-wachtwoord in.\nLees waar u uw BSN vindt\n.\nKlik op ‘Volgende’.\nU ontvangt een code per e-mail. Vul deze code in en tik op ‘Volgende’.\nU ontvangt een sms-code. Vul deze in en tik op ‘Volgende’.\nUw gebruikersnaam verschijnt in beeld.\nLet op:\nU ontvangt de codes op het e-mailadres en het telefoonnummer die aan uw DigiD gekoppeld zijn. Heeft u geen toegang meer tot dit e-mailadres en/of telefoonnummer? Of bent u uw DigiD wachtwoord vergeten? Dan kunt u uw gebruikersnaam niet op deze manier opvragen.\nWachtwoord vergeten\nBent u uw wachtwoord vergeten? Met de DigiD app herstelt u uw wachtwoord in Mijn DigiD. Maakt u nog geen gebruik van de DigiD app? Herstel uw wachtwoord per e-mail en sms.\nWachtwoord herstellen met de DigiD app\nWilt u uw wachtwoord herstellen met de DigiD app? Volg hiervoor deze stappen:\nGa naar Mijn DigiD\nen log in met de DigiD app.\nKlik op 'Meer details' (onder 'Met gebruikersnaam en wachtwoord').\nKies 'Wachtwoord wijzigen'.\nKies 'Ik weet mijn huidige wachtwoord niet meer en wil mijn wachtwoord opnieuw instellen via de DigiD app'.\nVoer uw nieuwe wachtwoord 2 keer in.\nOpen de DigiD app en druk op 'Koppelcode'.\nVoer de koppelcode uit uw DigiD app in op uw computer/laptop.\nScan de QR-code met uw DigiD app en klik na het scannen op 'Bevestigen'.\nUw wachtwoord is nu opnieuw ingesteld.\nLet op:\nMaakt u nog geen gebruik van de DigiD app? Of kunt u niet meer inloggen me Rijksoverheid.nl)"}, {"url": "https://www.nederlandwereldwijd.nl/rijbewijs-buitenland/kwijt-gestolen", "title": "Mijn Nederlandse rijbewijs is kwijt of gestolen in het buitenland. Wat nu? | NederlandWereldwijd", "text": "Bent u buiten Nederland en is uw Nederlandse rijbewijs kwijt of gestolen? Dan mag u niet autorijden. Wat u kunt doen, hangt af van uw situatie.\nLet op:\nIs uw rijbewijs buiten Nederland in beslag genomen? Dan is de procedure anders.\nLees wat u kunt doen als uw rijbewijs buiten Nederland in beslag is genomen\n.\nWat is uw situatie?\nIk woon in Nederland en ben op reis in het buitenland\nLet op:\nAls uw rijbewijs kwijt of gestolen is, mag u niet autorijden. U moet namelijk altijd een geldig rijbewijs kunnen laten zien. Ook in het buitenland.\nRijdt u toch en houdt de politie u aan? Dan kunt u een boete krijgen. Veroorzaakt u schade of een ongeluk? Dan bestaat de kans dat uw autoverzekeraar de schade niet dekt. Voorkom deze situatie en regel zo snel mogelijk een nieuw rijbewijs.\nStap 1: Verlies of diefstal melden bij RDW\nMeld het verlies of de diefstal van uw Nederlandse rijbewijs eerst bij de RDW. Dat kan digitaal via RDW.nl. Met uw melding van vermissing voorkomt u misbruik van uw rijbewijs. Om in te loggen op RDW.nl heeft u\nDigiD\nnodig.\nVermissing Nederlands rijbewijs melden\n(RDW.nl)\nKunt u niet inloggen? Geef dan de vermissing van uw rijbewijs door aan uw gemeente.\nNa uw melding blokkeert de RDW uw rijbewijs. Uw rijbewijs is dan niet meer geldig. U krijgt hierover een brief van de RDW. Aangifte doen bij de politie is niet nodig.\nStap 2: Nieuw Nederlands rijbewijs aanvragen\nVraag daarna een nieuw Nederlands rijbewijs aan bij uw woongemeente. Op de website van uw gemeente leest u hoe u een afspraak kunt maken en welke documenten u mee moet nemen naar uw afspraak.\nIk woon in een ander EU-land\nLet op:\nAls uw rijbewijs kwijt of gestolen is, mag u niet autorijden. U moet namelijk altijd een geldig rijbewijs kunnen laten zien. Ook in het buitenland.\nRijdt u toch en houdt de politie u aan? Dan kunt u een boete krijgen. Veroorzaakt u schade of een ongeluk? Dan bestaat de kans dat uw autoverzekeraar de schade niet dekt. Voorkom deze situatie en regel zo snel mogelijk een nieuw rijbewijs.\nStap 1: Verlies of diefstal melden bij RDW\nMeld het verlies of de diefstal van uw Nederlandse rijbewijs eerst bij de RDW. Dat kan digitaal via RDW.nl. Met uw melding van vermissing voorkomt u misbruik van uw rijbewijs. Om in te loggen op RDW.nl heeft u\nDigiD\nnodig.\nVermissing Nederlands rijbewijs melden\n(RDW.nl)\nKunt u niet inloggen? Vul dan een\nverklaring van vermissing\n(pdf, 182 kB) in. Stuur de ingevulde verklaring daarna per post op naar de RDW of upload deze via het\ncontactformulier van de RDW\n.\nU ontvangt een bevestiging van de registratie van verlies van de RDW.\nNa uw melding blokkeert de RDW uw rijbewijs. Uw rijbewijs is dan niet meer geldig. U krijgt hierover een brief van de RDW. Aangifte doen bij de politie is niet nodig.\nStap 2: Nieuw rijbewijs uit uw woonland aanvragen\nOmdat u in een ander\nland van de Europese Unie\n(EU) woont kunt u geen nieuw Nederlands rijbewijs aanvragen. U kunt wel een rijbewijs uit uw woonland aanvragen. Hiervoor heeft u nodig:\neen\nechtheidsverklaring van de RDW\n. Hierin staat of u met een rijbewijs geregistreerd staat in het rijbewijsregister. Op de website van de RDW leest u hoe u een echtheidsverklaring aanvraagt. Dit kost geld. Na uw betaling ontvangt u de echtheidsverklaring via de post op uw adres. De verklaring is in het Engels.\nin sommige situaties heeft u ook de bevestiging van registratie van verlies van de RDW nodig. Dit verschilt per land.\nVoor het aanvragen van een rijbewijs uit uw woonland heeft u vaak ook andere documenten nodig. Wilt u weten welke documenten dat zijn en waar u het rijbewijs aanvraagt? Lees meer over\nhoe u uw Nederlandse rijbewijs kunt verlengen of omwisselen in het buitenland\n.\nIk woon buiten de EU\nLet op:\nAls uw rijbewijs kwijt of gestolen is, mag u niet autorijden. U moet namelijk altijd een geldig rijbewijs kunnen laten zien. Ook in het buitenland.\nRijdt u toch en houdt de politie u aan? Dan kunt u een boete krijgen. Veroorzaakt u schade of een ongeluk? Dan bestaat de kans dat uw autoverzekeraar de schade niet dekt. Voorkom deze situatie en regel zo snel mogelijk een nieuw rijbewijs.\nStap 1: Verlies of diefstal melden bij RDW\nMeld het verlies of de diefstal van uw Nederlandse rijbewijs eerst bij de RDW. Dat kan digitaal via RDW.nl. Met uw melding van vermissing voorkomt u misbruik van uw rijbewijs. Om in te loggen op RDW.nl heeft u\nDigiD\nnodig.\nVermissing Nederlands rijbewijs melden\n(RDW.nl)\nKunt u niet inloggen? Vul dan een\nverklaring van vermissing\n(pdf, 182 kB) in. Stuur de ingevulde verklaring daarna per post op naar de RDW of upload deze via het\ncontactformulier van de RDW\n.\nU ontvangt een bevestiging van de registratie van verlies van de RDW.\nNa uw melding blokkeert de RDW uw rijbewijs. Uw rijbewijs is dan niet meer geldig. U krijgt hierover bericht van de RDW. Aangifte doen bij de politie is niet nodig.\nStap 2: Nieuw Nederlands rijbewijs aanvragen\nAls u buiten de\nEuropese Unie (EU)\nwoont, kunt u na uw melding een nieuw Nederlands rijbewijs aanvragen. Wilt u weten hoe u dat doet en welke documenten u daarvoor nodig heeft?  Lees meer over\nhoe u uw Nederlandse rijbewijs kunt verlengen of omwisselen in het buitenland\n.\nNa uw aanvraag\nDe RDW neemt uw aanvraag in behandeling en beoordeelt deze. Is uw aanvraag akkoord? Dan stuurt de RDW uw nieuwe Nederlandse rijbewijs op naar het correspondentieadres in Nederland. Dit is een adres in Nederland waar u post kunt ontvangen, bijvoorbeeld een adres van een familielid, vriend of kennis.\nContact\nKomt u er niet uit? Wij helpen u graag verder.\nNeem contact op met ons\nOok nuttig\nIk ben mijn paspoort of ID-kaart kwijt. Wat nu?"}, {"url": "https://www.nederlandwereldwijd.nl/legaliseren/wat-is-legaliseren", "title": "Wat is legaliseren van documenten? | NederlandWereldwijd", "text": "Legaliseren is een document geschikt maken voor gebruik in een ander land. Vaak zijn er voor legalisatie verschillende stappen nodig. Documenten die u kunt laten legaliseren zijn bijvoorbeeld een akte van de burgerlijke stand, een uitspraak van een rechtbank of een diploma.\nLegalisatie bewijst dat:\neen officiële instantie het document heeft afgegeven\nde handtekening en de zegel of stempel op het document echt zijn\nde vorm van het document klopt\nLegalisatie bewijst niet dat de inhoud van het document klopt. De instantie waar u het document moet overleggen, kan dit controleren.\nWelke stappen zijn er bij legaliseren?\nWelke stappen u moet zetten om een document te legaliseren, verschilt per land. Dit hangt af van de afspraken tussen het land waar u het document wilt gebruiken en waar het document vandaan komt.\nLet op:\nSoms moet u het document ook laten vertalen door een beëdigde vertaler. Vraag aan de autoriteiten of dit nodig is, en waar u de vertaling kunt laten doen.\nLegaliseren met een apostille\nIn veel landen kunt u een document laten legaliseren met een apostille. Dit is een verkorte vorm van legaliseren. Een autoriteit in land A legaliseert het document met 1 soort stempel of sticker: een apostille. Daarna kunt u het document gebruiken in\nalle landen die meedoen aan het Apostilleverdrag\n.\nLegaliseren zonder apostille\nDoet land A of B niet mee met het apostilleverdrag? Dan bestaat legalisatie vaak uit 2 stappen:\nStap 1\nEen autoriteit in land A controleert of de officiële instantie in land A het document heeft ondertekend. Meestal doet het ministerie van Buitenlandse Zaken van land A de controle. Na goedkeuring krijgt het document een stempel of sticker. Hiermee is voor land B duidelijk dat het document van een bevoegde instantie uit land A komt.\nStap 2\nLand B legaliseert het document, na controle, ook met een stempel of sticker. Meestal doet een ambassade, consulaat of honorair consul van land B dit in land A. Na legalisatie kunt u het document gebruiken in land B.\nLegaliseren niet nodig\nLegaliseren is niet nodig als land A een afspraak heeft gemaakt met land B, waardoor een document vrijstelling heeft. U kunt het document dan direct gebruiken. Er zijn ook afspraken tussen meerdere landen. In de\nEU-verordening\nstaat bijvoorbeeld dat openbare documenten niet gelegaliseerd hoeven te worden voor gebruik in andere EU-landen.\nLegaliseren niet mogelijk\nLegaliseren is soms niet mogelijk in een land. Bijvoorbeeld omdat er in land A oorlog is. Of omdat er geen instanties zijn die het document kunnen controleren. Dan controleren en beoordelen de autoriteiten in land B het document.\nWie mag een document legaliseren?\nU hoeft uw document niet zelf te laten legaliseren. Iemand anders mag dat voor u doen. Het is niet nodig die persoon daarvoor te machtigen."}, {"url": "https://www.nederlandwereldwijd.nl/legaliseren/apostille", "title": "Wat is een apostille? | NederlandWereldwijd", "text": "Een apostille is een stempel of sticker op een openbaar document, zoals een geboorteakte of diploma. De apostille bevestigt dat de handtekening op het document echt is. En dat het document van een officiële instantie komt, zoals een school of gemeente.\nSticker van de rechtbank\nIn Nederland is een apostille een sticker van de rechtbank. Deze sticker wordt op uw document geplakt. Een apostille wordt alleen gebruikt bij openbare documenten. Op de sticker komt ook een stempel van de rechtbank en een handtekening van een medewerker van de rechtbank. In andere landen kan een apostille een stempel, sticker of los document zijn.\nVoorbeeld apostille\nE-apostille\nEen apostille kan ook digitaal zijn. Dit heet een e-apostille. Heeft u een buitenlands document met een e-apostille? Dan kunt u dit document gewoon in Nederland gebruiken. Nederland zet zelf nog geen e-apostilles op documenten. U kunt voor een Nederlands document alleen een papieren apostille krijgen.\nOok nuttig\nIn welke landen is een apostille geldig?\nWaar kan ik een apostille halen?\nWanneer heb ik een apostille nodig?\nContact\nKomt u er niet uit? Wij helpen u graag verder.\nNeem contact op met ons"}];
const MODEL = "claude-sonnet-4-6";
const STOP = new Set("de het een en van in op te voor met aan is ik je u hoe wat waar wanneer kan moet mijn uw ben wil naar om dat die er ook als of bij dan zijn heb heeft wordt worden the a to of".split(" "));
const SAMPLES = [
  "Hoe lang duurt het om een paspoort aan te vragen in het buitenland?",
  "Wat kost een paspoort vanuit het buitenland?",
  "Wat is een BSN?",
  "Mijn rijbewijs is gestolen in het buitenland, wat nu?",
  "Ik ben mijn DigiD-wachtwoord vergeten",
  "Wat is een apostille?"
];

function tokenize(t){return t.toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>2&&!STOP.has(w));}
function tokensOf(p){return new Set((p.url.split(/[-\/]/).concat(tokenize(p.title))).map(s=>s.toLowerCase()));}
const PTOKENS = CORPUS.map(tokensOf);

function rank(q){
  const qt=tokenize(q);
  const scored=CORPUS.map((p,i)=>{
    let o=0; qt.forEach(t=>{if(PTOKENS[i].has(t))o++;});
    return {i,score:o};
  }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);
  return scored.slice(0,4).map(x=>x.i);
}

function normalize(s){return s.replace(/\s+/g," ").trim().toLowerCase();}

const conv=document.getElementById("conv");
const keyInput=document.getElementById("apikey");
const keyStatus=document.getElementById("keystatus");
const modeBadge=document.getElementById("mode-badge");
keyInput.value=localStorage.getItem("anthropic_key")||"";
function refreshMode(){
  const has=keyInput.value.trim().length>10;
  keyStatus.textContent=has?"AI-modus actief":"Demo-modus (geen AI)";
  modeBadge.innerHTML=has?'<span class="badge ai">AI</span>':'<span class="badge demo">DEMO</span>';
}
keyInput.addEventListener("input",()=>{localStorage.setItem("anthropic_key",keyInput.value);refreshMode();});
refreshMode();

const samples=document.getElementById("samples");
SAMPLES.forEach(s=>{const b=document.createElement("button");b.textContent=s;b.onclick=()=>{document.getElementById("input").value=s;document.getElementById("form").requestSubmit();};samples.appendChild(b);});

document.getElementById("form").addEventListener("submit",async(e)=>{
  e.preventDefault();
  const input=document.getElementById("input");
  const q=input.value.trim(); if(!q)return; input.value="";
  const turn=addTurn(q);
  const cands=rank(q);
  if(cands.length===0){renderResult(turn,{restated_question:q,answer:"",found:false,note:"Geen passende pagina in de demo-set voor deze vraag.",source:null,related:[]});return;}
  const key=keyInput.value.trim();
  try{
    let result;
    if(key.length>10){ result=await askClaude(q,cands,key); }
    else{ result=demoAnswer(q,cands); }
    renderResult(turn,result);
  }catch(err){ turn.querySelector(".slot").innerHTML='<div class="error">Er ging iets mis: '+escapeHtml(err.message)+'</div>'; }
});

function demoAnswer(q,cands){
  const p=CORPUS[cands[0]];
  const paras=p.text.split("\n").filter(x=>x.length>40);
  const ans=paras.slice(0,2).join("\n");
  return {restated_question:q,answer:ans,found:true,verified:true,demo:true,
    note:"DEMO-modus: dit is het begin van de pagina, niet door AI geselecteerd. Voer een API-sleutel in voor een echt, op de vraag toegesneden letterlijk antwoord.",
    source:{title:p.title,url:p.url}, related:cands.slice(1).map(i=>({title:CORPUS[i].title,url:CORPUS[i].url}))};
}

async function askClaude(q,cands,key){
  const listing=cands.map((idx,n)=>`[${n}] TITEL: ${CORPUS[idx].title}\nURL: ${CORPUS[idx].url}\nTEKST:\n${CORPUS[idx].text}`).join("\n\n---\n\n");
  const system="Je helpt een voorlichter van het klantcontactcentrum van NederlandWereldwijd. Je krijgt de vraag en enkele genummerde pagina's van NederlandWereldwijd.nl met hun letterlijke tekst. Kies de pagina die het antwoord het best bevat en neem het relevante gedeelte LETTERLIJK over uit die tekst — verzin niets, parafraseer niet, voeg niets toe. Citeer aaneengesloten passages exact. Antwoord UITSLUITEND met JSON: {\"restated_question\":\"<vraag kort geherformuleerd>\",\"primary_index\":<nummer of null>,\"answer\":\"<letterlijk fragment>\",\"found\":<true|false>,\"related_indices\":[<max 3 andere nummers>],\"note\":\"<korte toelichting of leeg>\"}";
  const body={model:MODEL,max_tokens:1200,system,messages:[{role:"user",content:`Vraag van de voorlichter:\n${q}\n\nPagina's:\n${listing}`}]};
  const resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify(body)});
  if(!resp.ok){const t=await resp.text();throw new Error("Claude API "+resp.status+": "+t.slice(0,200));}
  const data=await resp.json();
  const text=data.content.map(c=>c.text||"").join("");
  const m=text.match(/\{[\s\S]*\}/); if(!m)throw new Error("Geen JSON in modelantwoord");
  const r=JSON.parse(m[0]);
  const pidx=Number.isInteger(r.primary_index)?cands[r.primary_index]:null;
  const answer=(r.answer||"").trim();
  const found=!!r.found&&answer.length>0&&pidx!==null;
  let verified=false;
  if(found){verified=normalize(CORPUS[pidx].text).includes(normalize(answer));}
  const related=(r.related_indices||[]).map(n=>cands[n]).filter(i=>Number.isInteger(i)).map(i=>({title:CORPUS[i].title,url:CORPUS[i].url}));
  return {restated_question:r.restated_question||q,answer:found?answer:"",found,verified,
    note:found?(verified?null:"Let op: dit fragment kon niet letterlijk worden teruggevonden op de bronpagina. Controleer de bron zelf."):(r.note||"Op de gevonden pagina's staat geen letterlijk antwoord op deze vraag."),
    source:pidx!==null?{title:CORPUS[pidx].title,url:CORPUS[pidx].url}:null, related};
}

function addTurn(q){
  document.querySelector(".empty")?.remove(); document.getElementById("samples")?.remove();
  const art=document.createElement("article");art.className="turn";
  art.innerHTML=`<div class="user-question"><span class="label">Gestelde vraag</span>${escapeHtml(q)}</div><div class="slot"><div class="loading">Bezig met opzoeken…</div></div>`;
  conv.appendChild(art); art.scrollIntoView({behavior:"smooth",block:"end"}); return art;
}
function renderResult(turn,r){
  const badge=r.demo?'<span class="badge demo">DEMO</span>':'<span class="badge ai">AI</span>';
  let h=`<div class="bot-answer"><div class="restated"><span class="label">Je vraag (zoals begrepen) ${badge}</span>${escapeHtml(r.restated_question)}</div>`;
  if(r.answer){h+=`<blockquote class="answer ${r.verified?'verified':'unverified'}">${escapeHtml(r.answer)}</blockquote>`;}
  else{h+=`<div class="no-answer">Geen letterlijk antwoord gevonden.</div>`;}
  if(r.note)h+=`<div class="note">${escapeHtml(r.note)}</div>`;
  if(r.source)h+=`<div class="source"><span class="label">Bron</span><a href="${r.source.url}" target="_blank" rel="noreferrer">${escapeHtml(r.source.title)}</a></div>`;
  if(r.related&&r.related.length)h+=`<div class="related"><span class="label">Andere relevante bronnen</span><ul>${r.related.map(s=>`<li><a href="${s.url}" target="_blank" rel="noreferrer">${escapeHtml(s.title)}</a></li>`).join("")}</ul></div>`;
  h+=`</div>`;
  turn.querySelector(".slot").innerHTML=h; turn.scrollIntoView({behavior:"smooth",block:"end"});
}
function escapeHtml(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
</script>
</body>
</html>
